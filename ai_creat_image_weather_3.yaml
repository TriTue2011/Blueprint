            'Dubrovnik Croatia, the honey-gold medieval walls and terracotta rooftops of the walled city glowing in the last sun, the Adriatic blazing beyond',
            'Budapest Hungary, the Parliament on the Danube lit gold by the setting sun, the river reflecting the warm facade and the Chain Bridge',
            'Sydney Australia, the Opera House sails and Harbour Bridge glowing warm against a fiery orange sky, the harbour reflecting the sunset',
            'Prague Czech Republic, the Gothic spires and red rooftops of the old town glowing gold, Charles Bridge and the castle silhouetted against an amber sky'
          ] %}
        {% elif 'chạng' in tp or 'dusk' in tp %}
          {% set scenes = [
            'Shanghai China, the Bund and the Pudong towers lighting up against a deep blue-violet twilight, the Huangpu river a mirror of coloured light',
            'Hong Kong, Victoria Harbour at blue hour, the wall of skyscrapers glowing against the darkening sky, lights reflected in the water, the Peak behind',
            'Paris France, the Eiffel Tower and Haussmann rooftops at blue hour, warm street lights coming on while the sky holds deep blue',
            'Tre Cime di Lavaredo Dolomites Italy, the three vertical spires glowing pink and violet in alpenglow as the sky darkens, mountain huts warm below',
            'Singapore, Marina Bay at blue hour, the Gardens by the Bay Supertrees and the skyline glowing against a violet sky, reflections across the still bay',
            'Manhattan New York, the skyline at blue hour from across the water, thousands of windows lighting up against the twilight graded orange to indigo',
            'Torres del Paine Chile, the granite towers glowing famous pink-gold Patagonian alpenglow, mirrored in a still lake as the land falls dark',
            'Matterhorn Zermatt Switzerland, the iconic peak glowing pink against a deep blue dusk, village lights coming on in the dark valley below',
            'Dubai UAE, the Marina and Burj Khalifa skyline blazing with light against a burnt-orange to indigo twilight gradient, reflections in the water'
          ] %}
        {% elif 'tối' in tp or 'evening' in tp %}
          {% set scenes = [
            'Kyoto Japan, the wooden Kiyomizu-dera and the Gion lanes glowing with warm lantern light in full darkness, stone lanterns and paper windows lit, a still canal reflecting the glow',
            'Marrakech Morocco, the Jemaa el-Fnaa square at night alive with food-stall smoke and warm lamplight, the lit Koutoubia minaret rising against the black sky',
            'Varanasi India, the Ganges ghats at night during the Ganga Aarti, hundreds of oil lamps and floating candles on the dark river, temples lit behind',
            'Tokyo Japan, the Shibuya crossing and neon-drenched streets at night, brilliant signage reflected in wet pavement, crowds under a black sky',
            'Venice Italy at night, warm lamplight along the dark canals, gondolas moored, the lit facade of a palazzo mirrored in the black water',
            'Bruges Belgium, medieval stepped-gable houses along the canals lit warm at night, the Belfry floodlit above the square, still black water mirroring the golden reflections',
            'Kuala Lumpur Malaysia, the Petronas Twin Towers blazing with light against the night sky, the surrounding city lit, reflecting pool below',
            'Istanbul Turkey, the Blue Mosque and Hagia Sophia floodlit warm against the black sky, minarets rising, the plaza between them softly lit',
            'Luang Prabang Laos, the night market and gilded temple roofs glowing under warm lantern strings in full darkness, monks\' quarters lit softly behind'
          ] %}
        {% else %}
          {% set scenes = [
            'Atacama Desert Chile, the darkest sky on Earth at high altitude, the entire Milky Way and nebulae blazing overhead, giant cardon cacti as black silhouettes on the pale floor',
            'Mauna Kea Hawaii, the volcano summit above the clouds, the Milky Way arcing over the silhouetted observatory domes, thousands of stars in the cold clear air',
            'Deadvlei Namibia at night, the ancient black skeletal camel-thorn trees on the white clay pan under brilliant moonlight, the Milky Way blazing above the red dunes',
            'Aoraki Mount Cook New Zealand, the highest peak under a spectacular southern night sky, the Milky Way horizon to horizon reflected in the black mirror of Lake Pukaki',
            'Sahara Merzouga Morocco, immense moonlit orange dunes rolling to the horizon under a sky thick with stars, a single line of camel tracks, absolute silence',
            'Salar de Uyuni Bolivia wet season, a thin layer of water turning the salt flat into a perfect mirror of the entire star-filled sky, the horizon dissolving',
            'Lofoten Islands Norway, the Northern Lights in curtains of green and violet dancing above jagged black peaks, mirrored in the still Arctic fjord, red cabins on the shore',
            'Tromso Norway, the aurora borealis rippling over a snow-covered Arctic landscape, the frozen fjord reflecting the green light, silhouetted pines',
            'Wadi Rum Jordan at night, the red desert and sandstone mountains under brilliant moonlight and a dense field of stars, a few tent lights glowing warm on the valley floor'
          ] %}
        {% endif %}
        {% set si = now().timetuple().tm_yday % (scenes | length) %}
        {{ scenes[si] }}
      n_weather_fx: >-
        {% set dark = 'tối' in tp or 'đêm' in tp or 'chạng' in tp %}
        {% if 'rain' in w or 'mưa' in w %}
          heavy rain, wet reflective ground, puddles, droplets on leaves
        {% elif 'thunder' in w or 'bão' in w %}
          violent thunderstorm, dark cumulonimbus, distant lightning, strong wind
        {% elif 'cloud' in w or 'mây' in w %}
          {% if dark %}thick overcast, cloud base lit faintly from below, stars hidden{% else %}thick overcast clouds, diffused soft flat light, no harsh shadows{% endif %}
        {% elif 'fog' in w or 'sương' in w %}
          dense rolling fog, low visibility, {% if dark %}lights as glowing halos{% else %}soft ethereal mood{% endif %}
        {% elif 'clear' in w or 'nắng' in w or 'sunny' in w %}
          {% if dark %}clear sky, stars from horizon to horizon, crisp moonlit shadows{% else %}clear sky, vivid saturated colours, sharp defined shadows{% endif %}
        {% elif 'snow' in w %}
          light snowfall, white snow-covered ground, frosted branches, cold breath
        {% else %}
          {% if dark %}calm night, few clouds across the stars, soft moonlight{% else %}partly cloudy, scattered white cumulus, pleasant natural light{% endif %}
        {% endif %}
      n_temp_fx: >-
        {% set dark = 'tối' in tp or 'đêm' in tp or 'chạng' in tp %}
        {% if temp > 35 %}
          scorching {{ temp | round }}°C{% if dark %}, heat radiating after dark{% else %}, heat shimmer, wilting leaves{% endif %}
        {% elif temp > 30 %}
          hot {{ temp | round }}°C{% if dark %}, warmth lingering into the night{% else %}, summer haze, seeking shade{% endif %}
        {% elif temp > 25 %}
          warm {{ temp | round }}°C{% if dark %}, mild still night{% else %}, comfortable, lush green vegetation{% endif %}
        {% elif temp > 18 %}
          cool {{ temp | round }}°C, crisp fresh air
        {% else %}
          cold {{ temp | round }}°C, frost on surfaces, breath visible
        {% endif %}
      n_wind_fx: >-
        {% if wind > 30 %}
          powerful gale wind, trees bending violently, debris flying, rippling turbulent water
        {% elif wind > 15 %}
          moderate wind, leaves and branches swaying rhythmically, rippled puddle surfaces
        {% elif wind > 5 %}
          gentle breeze, soft subtle movement of grass tips and leaves
        {% else %}
          perfectly calm still air, glassy mirror-like water reflections
        {% endif %}

      n_hum_fx: >-
        {% set dark = 'tối' in tp or 'đêm' in tp or 'chạng' in tp %}
        {% if hum > 85 %}
          humid {{ hum }}%, damp glistening surfaces, condensation
        {% elif hum > 60 %}
          humid {{ hum }}%, {% if dark %}damp sheen and settling dew{% else %}lush vegetation glistening{% endif %}
        {% elif hum < 30 %}
          dry air {{ hum }}%, dust particles, cracked earth
        {% else %}
        {% endif %}
      n_aqi_fx: >-
        {% set dark = 'tối' in tp or 'đêm' in tp or 'chạng' in tp %}
        {% if aqi > 150 %}
          heavy smog AQI {{ aqi }}, thick haze, poor visibility
        {% elif aqi > 100 %}
          hazy air AQI {{ aqi }}, washed-out distance, grey tint
        {% elif aqi > 50 %}
          slight haze AQI {{ aqi }}, muted distant colours
        {% else %}
          {% if dark %}clean air AQI {{ aqi }}, stars sharp to the horizon{% else %}clean clear air AQI {{ aqi }}, sharp vivid distant detail{% endif %}
        {% endif %}
      n_parts: >-
        {{ [
          n_lighting | trim,
          n_scene | trim,
          n_weather_fx | trim,
          n_temp_fx | trim,
          n_wind_fx | trim,
          n_hum_fx | trim,
          n_aqi_fx | trim
        ] | select('ne', '') | list | join(', ') }}

      nvidia_prompt: >-
        {{ ('Photorealistic aerial DSLR photograph, ' ~ n_parts ~ ', wide-angle panoramic composition, deep depth of field, HDR cinematic colour grade, ultra sharp details, 8K resolution, no text, no watermark, no faces')
           | regex_replace('\\s+', ' ')
           | trim
           | truncate(750, True, '') }}

  # ── BƯỚC 4: GỌI AI THEO ENGINE ĐƯỢC CHỌN ─────────────────────────────────
  - choose:

      # ── NHÁNH GEMINI ────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ ai_engine == 'gemini' }}"
        sequence:
          - continue_on_error: false
            action: ai_task.generate_image
            data:
              entity_id: !input ai_task_entity
              task_name: "{{ task_name }}"
              instructions: "{{ gemini_prompt }}"
            response_variable: ai_result

          - if:
              - condition: template
                value_template: >
                  {{ ai_result is defined
                     and (ai_result.url is defined or ai_result.media_source_id is defined) }}
            then:
              - variables:
                  ai_image_source_id: "{{ ai_result.media_source_id | default('') }}"
                  image_path: >-
                    {% set sid = ai_result.media_source_id | default('') %}
                    {% if sid.startswith('media-source://ai_task/image/') %}
                      /config/media/ai_task/image/{{ sid.split('/')[-1] }}
                    {% elif sid.startswith('media-source://') %}
                      /config/media/{{ sid.replace('media-source://', '') }}
                    {% else %}
                      {{ sid }}
                    {% endif %}

              - continue_on_error: true
                action: shell_command.copy_weather_image
                data:
                  source: "{{ image_path }}"
                  destination: "{{ final_image_path }}"
                response_variable: copy_result

              - if:
                  - condition: template
                    value_template: "{{ delete_ai_image and ai_image_delete_folder != '' }}"
                then:
                  - continue_on_error: true
                    action: delete.files_in_folder
                    data:
                      folder: "{{ ai_image_delete_folder }}"
                      time: "{{ ai_image_delete_age | int(3600) }}"

      # ── NHÁNH NVIDIA FLUX ───────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ ai_engine == 'nvidia' }}"
        sequence:
          - action: pyscript.generate_weather_image
            data:
              prompt: "{{ nvidia_prompt }}"
              output_path: "{{ final_image_path }}"
              steps: !input steps
              width: !input width
              height: !input height

          - action: system_log.write
            data:
              level: info
              message: >-
                [WeatherImage/NVIDIA] ✅ {{ tp }} | {{ w }} | {{ temp }}°C | hum={{ hum }}%
                | wind={{ wind }} | aqi={{ aqi }} | scene={{ scene_index }}
                | chars={{ nvidia_prompt | length }}
                | prompt={{ nvidia_prompt | truncate(120) }}

      # ── NHÁNH GOOGLE FLOW ───────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ ai_engine == 'flow' }}"
        sequence:
          - variables:
              flow_project_id: !input flow_project_id
              flow_api_url: !input flow_api_url
              flow_prompt_style: !input flow_prompt_style
              flow_prompt: >-
                {% if flow_prompt_style == 'compact' %}
                  {{ nvidia_prompt }}
                {% else %}
                  {{ gemini_prompt }}
                {% endif %}

          - action: pyscript.generate_flow_image
            data:
              prompt: "{{ flow_prompt }}"
              output_path: "{{ final_image_path }}"
              project_id: "{{ flow_project_id }}"
              api_url: "{{ flow_api_url }}"

          - action: system_log.write
            data:
              level: info
              message: >-
                [WeatherImage/Flow] ✅ {{ tp }} | {{ w }} | {{ temp }}°C | hum={{ hum }}%
                | wind={{ wind }} | aqi={{ aqi }} | scene={{ scene_index }}
                | style={{ flow_prompt_style }}
                | chars={{ flow_prompt | length }}
                | prompt={{ flow_prompt | truncate(120) }}

  # ── BƯỚC 5: GỬI ẢNH ──────────────────────────────────────────────────────
  - variables:
      _tg:             !input include_telegram_notify
      _tg_cfg:         !input telegram_config_entry
      _tg_target:      !input telegram_target
      _tg_thread:      !input telegram_thread_id
      _zb:             !input enable_zalo_bot
      _zb_id:          !input zalo_bot_chat_id
      _zc:             !input enable_zalo_custom
      _zc_acc:         !input zalo_custom_account
      _zc_tid:         !input zalo_custom_thread_id
      _zc_uid:         !input zalo_custom_user_id
      _zc_type:        !input zalo_custom_receiver_type
      _zc_ttl:         !input zalo_custom_ttl
      _zc_resolved: >-
        {{ _zc_tid if _zc_type == '1' else _zc_uid }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ _tg }}"
        sequence:
          - continue_on_error: true
            action: telegram_bot.send_photo
            data: >
              {% set d = {'config_entry_id': _tg_cfg, 'file': final_image_path} %}
              {% if _tg_target != '' %}{% set d = dict(d, chat_id=_tg_target | int) %}{% endif %}
              {% if _tg_thread != '' %}{% set d = dict(d, message_thread_id=_tg_thread | int) %}{% endif %}
              {{ d }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ _zb }}"
        sequence:
          - continue_on_error: true
            action: pyscript.send_zalo_photo
            data:
              chat_id: "{{ _zb_id }}"
              file_path: "{{ final_image_path }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ _zc and _zc_resolved | trim | length > 0 and _zc_acc | length > 0 }}
        sequence:
          - continue_on_error: true
            action: zalo_bot.send_image
            data:
              account_selection: !input zalo_custom_account
              thread_id: "{{ _zc_resolved | trim | string }}"
              type: "{{ _zc_type }}"
              image_path: "{{ final_image_path }}"
              ttl: "{{ _zc_ttl }}"

mode: single
max_exceeded: silent
