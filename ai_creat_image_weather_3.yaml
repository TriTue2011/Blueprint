# ############################################################################
#  ⚠️ ĐỌC TRƯỚC KHI DÙNG
#
#  1. File này dựng lại từ blueprint của bạn. Bản bạn dán bị CẮT ở mốc 50.000
#     ký tự (tới "BƯỚC 3 NVIDIA buổi sáng"), nên phần ACTION (gọi engine, lưu,
#     gửi) tôi KHÔNG thấy bản gốc — tôi dựng theo mô tả trong blueprint.
#
#  2. BA DÒNG gọi engine dưới đây phải khớp tên hàm trong file .py CỦA BẠN.
#     Tìm chữ "⚠️ KIỂM" và đối chiếu:
#        - Gemini : service ai_task.generate_image  (tên service HA của bạn)
#        - NVIDIA : service pyscript.weather_image   (tên hàm trong weather_image.py)
#        - Flow   : service pyscript.flow_image      (tên hàm trong flow_image.py)
#     Sai tên là automation chạy tới đó thì đứng — sửa đúng 3 chỗ đó là xong.
#
#  3. SENSOR 9 KHOẢNG: dán khối này vào configuration.yaml (KHÔNG nằm trong
#     blueprint). Đây là nguồn cho `period_english` mà prompt đọc.
#
#     template:
#       - sensor:
#           - name: "Buổi trong ngày"
#             unique_id: time_of_day_vn
#             state: >-
#               {% set h = now().hour %}
#               {% if   5 <= h < 6  %} Rạng đông
#               {% elif 6 <= h < 8  %} Bình minh
#               {% elif 8 <= h < 11 %} Sáng
#               {% elif 11 <= h < 14 %} Trưa
#               {% elif 14 <= h < 16 %} Xế
#               {% elif 16 <= h < 18 %} Hoàng hôn
#               {% elif 18 <= h < 19 %} Chạng vạng
#               {% elif 19 <= h < 22 %} Tối
#               {% else %} Đêm
#               {% endif %}
#             attributes:
#               period_english: >-
#                 {% set h = now().hour %}
#                 {% if   5 <= h < 6  %} dawn
#                 {% elif 6 <= h < 8  %} sunrise
#                 {% elif 8 <= h < 11 %} morning
#                 {% elif 11 <= h < 14 %} noon
#                 {% elif 14 <= h < 16 %} afternoon
#                 {% elif 16 <= h < 18 %} sunset
#                 {% elif 18 <= h < 19 %} dusk
#                 {% elif 19 <= h < 22 %} evening
#                 {% else %} night
#                 {% endif %}
# ############################################################################

blueprint:
  name: Tạo ảnh thời tiết AI (9 khoảng thời gian)
  author: TriTue2011
  description: >
    Tự động tạo ảnh thời tiết bằng AI với 3 lựa chọn engine:
    **Gemini AI Task** (tích hợp HA native), **NVIDIA Flux qua PyScript**,
    hoặc **Google Flow qua PyScript** (Local API nội bộ).
    Phong cảnh thay đổi theo **9 khoảng thời gian** trong ngày (rạng đông → đêm),
    mỗi khoảng có **bộ địa danh đẹp nhất riêng**, dữ liệu thời tiết thực tế, và
    prompt viết phù hợp từng buổi để không tự mâu thuẫn.

    <details>
    <summary><b>⚙️ Yêu cầu cấu hình chung:</b> - Nhấn để mở rộng</summary>

      **Template Sensor nhận diện buổi trong ngày (bắt buộc) — bản 9 khoảng:**

      Thêm vào `configuration.yaml`:
      ```yaml
      template:
        - sensor:
            - name: "Buổi trong ngày"
              unique_id: time_of_day_vn
              icon: >-
                {% set h = now().hour %}
                {% if   5 <= h < 6  %} mdi:weather-sunset-up
                {% elif 6 <= h < 8  %} mdi:weather-sunny
                {% elif 8 <= h < 11 %} mdi:weather-sunny
                {% elif 11 <= h < 14 %} mdi:white-balance-sunny
                {% elif 14 <= h < 16 %} mdi:weather-sunny
                {% elif 16 <= h < 18 %} mdi:weather-sunset
                {% elif 18 <= h < 19 %} mdi:weather-sunset-down
                {% elif 19 <= h < 22 %} mdi:weather-night
                {% else %} mdi:weather-night
                {% endif %}
              state: >-
                {% set h = now().hour %}
                {% if   5 <= h < 6  %} Rạng đông
                {% elif 6 <= h < 8  %} Bình minh
                {% elif 8 <= h < 11 %} Sáng
                {% elif 11 <= h < 14 %} Trưa
                {% elif 14 <= h < 16 %} Xế
                {% elif 16 <= h < 18 %} Hoàng hôn
                {% elif 18 <= h < 19 %} Chạng vạng
                {% elif 19 <= h < 22 %} Tối
                {% else %} Đêm
                {% endif %}
              attributes:
                period_english: >-
                  {% set h = now().hour %}
                  {% if   5 <= h < 6  %} dawn
                  {% elif 6 <= h < 8  %} sunrise
                  {% elif 8 <= h < 11 %} morning
                  {% elif 11 <= h < 14 %} noon
                  {% elif 14 <= h < 16 %} afternoon
                  {% elif 16 <= h < 18 %} sunset
                  {% elif 18 <= h < 19 %} dusk
                  {% elif 19 <= h < 22 %} evening
                  {% else %} night
                  {% endif %}
      ```

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu khi dùng Gemini AI Task:</b> - Nhấn để mở rộng</summary>

      Sử dụng addon (dockercompse) https://github.com/luuquangvu/Gemini-FastAPI và tích hợp https://github.com/luuquangvu/hass_local_openai_llm.

      Thêm vào `configuration.yaml`:
      ```yaml
      shell_command:
        copy_weather_image: >
          mv "{{ source }}" "{{ destination }}"
      ```

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu khi dùng NVIDIA Flux PyScript:</b> - Nhấn để mở rộng</summary>

      Dùng api nvidia. đăng ký tại https://build.nvidia.com và dùng tích hợp https://github.com/luuquangvu/hass_local_openai_llm

      Thêm vào `configuration.yaml`:
      ```yaml
      pyscript:
        allow_all_imports: true
        hass_is_global: true
        nvidia_api_key: !secret nvidia_api_key
      ```

      Thêm vào `secrets.yaml`:
      ```yaml
      nvidia_api_key: "nvapi-xxx"
      ```

      Tải file script Python tại:
      https://github.com/TriTue2011/Blueprint/blob/main/scripts/weather_image.py

      Đặt file vào thư mục `pyscript/` trong config Home Assistant.

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu khi dùng Google Flow PyScript:</b> - Nhấn để mở rộng</summary>

      Dùng API Google Flow nội bộ hoặc proxy server riêng. Khuyến nghị trỏ
      `flow_api_url` vào CỔNG CHÍNH của gateway
      (`http://172.16.10.38:3030/v1/images/generations`, thân yêu cầu
      `{"model":"flow/banana-pro"}`) để đi đường REST: khung hình đúng, ảnh gốc,
      tự xoay tài khoản, và ảnh vào thư viện.

      Thêm vào `configuration.yaml`:
      ```yaml
      pyscript:
        allow_all_imports: true
        hass_is_global: true
        flow_api_key: !secret flow_api_key
      ```

      Thêm vào `secrets.yaml`:
      ```yaml
      flow_api_key: "your-flow-api-key"
      ```

      Tải file script Python `flow_image.py` và đặt vào thư mục `pyscript/`.

    </details>
  domain: automation
  homeassistant:
    min_version: 2025.10.0

  input:
    engine_settings:
      name: "🤖 Chọn Engine AI"
      icon: mdi:robot-outline
      collapsed: false
      input:
        ai_engine:
          name: Engine tạo ảnh
          description: >
            Gemini dùng ai_task native của HA. NVIDIA Flux dùng PyScript + API
            key. Google Flow dùng PyScript + Flow API nội bộ.
          default: gemini
          selector:
            select:
              options:
                - label: Gemini AI Task (HA Native)
                  value: gemini
                - label: NVIDIA Flux (PyScript)
                  value: nvidia
                - label: Google Flow (PyScript - Local API)
                  value: flow

    weather_sensors:
      name: "🌤️ Cảm biến thời tiết"
      icon: mdi:weather-partly-cloudy
      collapsed: false
      input:
        time_phase_sensor:
          name: Pha thời gian trong ngày
          description: Sensor "Buổi trong ngày" 9 khoảng (xem khối sensor ở đầu file)
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false
        weather_entity:
          name: Thực thể thời tiết
          selector:
            entity:
              filter:
                - domain: weather
              multiple: false
        temperature_sensor:
          name: Cảm biến nhiệt độ (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
              multiple: false
        humidity_sensor:
          name: Cảm biến độ ẩm (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
              multiple: false
        wind_speed_sensor:
          name: Cảm biến tốc độ gió (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false
        pressure_sensor:
          name: Cảm biến áp suất (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false

    air_quality_sensors:
      name: "🏭 Cảm biến chất lượng không khí"
      icon: mdi:air-filter
      collapsed: true
      input:
        aqi_sensor:
          name: AQI (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: aqi
              multiple: false
        pm25_sensor:
          name: PM2.5 (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false

    gemini_settings:
      name: "✨ Cài đặt Gemini AI Task"
      icon: mdi:google
      collapsed: true
      input:
        ai_task_entity:
          name: AI Task Entity
          description: AI entity tạo ảnh (Gemini 2.5 Flash Image). Bỏ qua nếu dùng NVIDIA/Flow.
          default: []
          selector:
            entity:
              domain: ai_task
              multiple: false
        image_style:
          name: Phong cách ảnh
          default: photorealistic
          selector:
            select:
              options:
                - label: Ảnh chụp chân thực
                  value: photorealistic
                - label: Nghệ thuật
                  value: artistic
                - label: Sống động
                  value: vibrant

    image_output:
      name: "💾 Lưu ảnh"
      icon: mdi:content-save
      collapsed: true
      input:
        save_image:
          name: Lưu ảnh vào thư mục
          default: true
          selector:
            boolean:
        output_directory:
          name: Thư mục đầu ra
          default: "/config/media/weather"
          selector:
            text:
        use_fixed_filename:
          name: Dùng tên file cố định (ghi đè)
          default: true
          selector:
            boolean:
        fixed_filename:
          name: Tên file cố định
          default: "weather_current"
          selector:
            text:
        filename_prefix:
          name: Tiền tố tên file (khi không cố định)
          default: "weather_"
          selector:
            text:
        file_extension:
          name: Phần mở rộng file
          default: "png"
          selector:
            select:
              options: [png, jpg, jpeg, webp]
        delete_ai_image:
          name: Xóa ảnh AI tạm sau khi lưu (dự phòng — chỉ Gemini)
          default: false
          selector:
            boolean:
        ai_image_delete_folder:
          name: Thư mục ảnh AI tạm (dự phòng — chỉ Gemini)
          default: "/config/media/ai_task/image"
          selector:
            text:
        ai_image_delete_age:
          name: Xóa ảnh cũ hơn (giây) — chỉ Gemini
          default: 3600
          selector:
            number:
              min: 60
              max: 86400
              step: 60
              unit_of_measurement: giây
              mode: box

    nvidia_settings:
      name: "⚡ Cài đặt NVIDIA Flux PyScript"
      icon: mdi:flash
      collapsed: true
      input:
        steps:
          name: Số bước sinh ảnh
          default: 6
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: slider
        width:
          name: Chiều rộng (px)
          default: 1344
          selector:
            number:
              min: 512
              max: 1920
              step: 64
              mode: slider
        height:
          name: Chiều cao (px)
          default: 768
          selector:
            number:
              min: 256
              max: 1080
              step: 64
              mode: slider

    flow_settings:
      name: "🌊 Cài đặt Google Flow PyScript"
      icon: mdi:google-cloud
      collapsed: true
      input:
        flow_api_url:
          name: Flow API URL
          description: >
            Khuyến nghị dùng CỔNG CHÍNH của gateway (đường REST, khung hình đúng,
            ảnh gốc, tự xoay tài khoản, vào thư viện):
            http://172.16.10.38:3030/v1/images/generations
            — thân yêu cầu dùng {"model":"flow/banana-pro"} (xem BƯỚC 4C).
          default: "http://172.16.10.38:3030/v1/images/generations"
          selector:
            text:
        flow_project_id:
          name: Project ID
          default: "54468d77-02ff-4a06-bb81-05a7d1111544"
          selector:
            text:
        flow_prompt_style:
          name: Phong cách prompt gửi cho Flow
          default: detailed
          selector:
            select:
              options:
                - label: Chi tiết (như Gemini)
                  value: detailed
                - label: Ngắn gọn (như NVIDIA)
                  value: compact

    notify_image_section:
      name: "📤 Gửi ảnh sau khi tạo"
      icon: mdi:image-send
      collapsed: false
      input:
        include_telegram_notify:
          name: ✅ Gửi qua Telegram
          default: false
          selector:
            boolean: {}
        telegram_config_entry:
          name: 🤖 Telegram Bot
          default: ""
          selector:
            config_entry:
              integration: telegram_bot
        telegram_target:
          name: 🧑‍💻 Target Chat ID
          default: ""
          selector:
            text: {}
        telegram_thread_id:
          name: 🧵 Thread ID
          default: ""
          selector:
            text: {}
        enable_zalo_bot:
          name: ✅ Gửi qua Zalo Bot (Pyscript)
          default: false
          selector:
            boolean: {}
        zalo_bot_chat_id:
          name: 🧑‍💻 Zalo Bot Chat ID
          default: ""
          selector:
            text: {}
        enable_zalo_custom:
          name: ✅ Gửi qua Zalo Custom Integration
          default: false
          selector:
            boolean: {}
        zalo_custom_account:
          name: 📱 Tài khoản Zalo
          default: ""
          selector:
            text: {}
        zalo_custom_thread_id:
          name: 💬 Thread ID (Nhóm)
          default: ""
          selector:
            text: {}
        zalo_custom_user_id:
          name: 👤 User ID (Cá nhân)
          default: ""
          selector:
            text: {}
        zalo_custom_receiver_type:
          name: 👥 Receiver Type
          default: "0"
          selector:
            select:
              options:
                - label: User (Cá nhân)
                  value: "0"
                - label: Group (Nhóm)
                  value: "1"
        zalo_custom_ttl:
          name: ⏳ TTL (ms)
          default: 0
          selector:
            number:
              min: 0
              max: 86400000
              step: 1000
              mode: box

# ===== TRIGGER: sensor đổi trạng thái ở mỗi ranh giới khoảng (9 lần/ngày) ====
trigger:
  - platform: state
    entity_id: !input time_phase_sensor
    not_from: [unknown, unavailable]
    not_to: [unknown, unavailable]
  - platform: time
    at: "00:05:00"

condition:
  - condition: template
    value_template: >
      {{ trigger.platform == 'time'
         or trigger.from_state.state != trigger.to_state.state }}

action:
  # ── BƯỚC 1: THU THẬP DỮ LIỆU THỜI TIẾT ───────────────────────────────────
  - variables:
      ai_engine: !input ai_engine
      time_phase_sensor: !input time_phase_sensor
      tp: "{{ states(time_phase_sensor) | lower }}"
      weather_entity: !input weather_entity
      w: "{{ states(weather_entity) | lower }}"
      scene_index: "{{ now().timetuple().tm_yday % 12 }}"
      temperature_sensor: !input temperature_sensor
      temp: >-
        {% if temperature_sensor and temperature_sensor != '' and states(temperature_sensor) not in ['unknown','unavailable',''] %}
          {{ states(temperature_sensor) | float(30) | round(1) }}
        {% else %}
          {{ state_attr(weather_entity, 'temperature') | float(30) | round(1) }}
        {% endif %}
      humidity_sensor: !input humidity_sensor
      hum: >-
        {% if humidity_sensor and humidity_sensor != '' and states(humidity_sensor) not in ['unknown','unavailable',''] %}
          {{ states(humidity_sensor) | int(70) }}
        {% else %}
          {{ state_attr(weather_entity, 'humidity') | int(70) }}
        {% endif %}
      wind_speed_sensor: !input wind_speed_sensor
      wind: >-
        {% if wind_speed_sensor and wind_speed_sensor != '' and states(wind_speed_sensor) not in ['unknown','unavailable',''] %}
          {{ states(wind_speed_sensor) | float(5) | round(1) }}
        {% else %}
          {{ state_attr(weather_entity, 'wind_speed') | float(5) | round(1) }}
        {% endif %}
      pressure_sensor: !input pressure_sensor
      pressure: >-
        {% if pressure_sensor and pressure_sensor != '' and states(pressure_sensor) not in ['unknown','unavailable',''] %}
          {{ states(pressure_sensor) | float(0) | round(0) }}
        {% else %}
          {{ state_attr(weather_entity, 'pressure') | float(0) | round(0) }}
        {% endif %}
      aqi_sensor: !input aqi_sensor
      aqi: >-
        {% if aqi_sensor and aqi_sensor != '' and states(aqi_sensor) not in ['unknown','unavailable',''] %}
          {{ states(aqi_sensor) | int(0) }}
        {% else %}
          0
        {% endif %}
      pm25_sensor: !input pm25_sensor
      pm25: >-
        {% if pm25_sensor and pm25_sensor != '' and states(pm25_sensor) not in ['unknown','unavailable',''] %}
          {{ states(pm25_sensor) | float(0) | round(1) }}
        {% else %}
          0
        {% endif %}

  # ── BƯỚC 1B: ĐƯỜNG DẪN ẢNH ───────────────────────────────────────────────
  - variables:
      use_fixed_filename: !input use_fixed_filename
      fixed_filename: !input fixed_filename
      output_directory: !input output_directory
      filename_prefix: !input filename_prefix
      file_extension: !input file_extension
      save_image: !input save_image
      delete_ai_image: !input delete_ai_image
      ai_image_delete_folder: !input ai_image_delete_folder
      ai_image_delete_age: !input ai_image_delete_age
      final_image_path: >-
        {{ output_directory }}/{% if use_fixed_filename %}{{ fixed_filename }}.{{ file_extension }}{% else %}{{ filename_prefix }}{{ now().strftime('%Y%m%d_%H%M%S') }}.{{ file_extension }}{% endif %}

  # ── BƯỚC 2: KHOẢNG THỜI GIAN + NGUYÊN LIỆU THEO BUỔI ─────────────────────
  - variables:
      image_style: !input image_style
      period: >-
        {{ (state_attr(time_phase_sensor, 'period_english') | default('') | trim | lower)
           or (
             'dawn'      if 'rạng' in tp else
             'sunrise'   if ('bình minh' in tp or 'sunrise' in tp) else
             'morning'   if ('sáng' in tp or 'morning' in tp) else
             'noon'      if ('trưa' in tp or 'noon' in tp) else
             'afternoon' if ('xế' in tp or 'afternoon' in tp) else
             'sunset'    if ('hoàng hôn' in tp or 'sunset' in tp) else
             'dusk'      if ('chạng' in tp or 'dusk' in tp) else
             'evening'   if ('tối' in tp or 'evening' in tp) else
             'night'
           ) }}
      troi_toi: "{{ period in ['dusk', 'evening', 'night'] }}"
      tam_nhin_bi_che: >-
        {{ 'fog' in w or 'sương' in w or 'mist' in w or 'rain' in w or 'mưa' in w
           or 'thunder' in w or 'bão' in w or 'snow' in w or 'tuyết' in w }}
      at_nguon: >-
        {%- if period == 'dawn' -%}the cold pre-dawn glow
        {%- elif period == 'sunrise' -%}the low warm sunrise
        {%- elif period == 'morning' -%}the clear morning sun
        {%- elif period == 'noon' -%}the overhead sun
        {%- elif period == 'afternoon' -%}the strong angled afternoon sun
        {%- elif period == 'sunset' -%}the low western sun
        {%- elif period == 'dusk' -%}the afterglow and the first lights
        {%- elif period == 'evening' -%}the lanterns and lit windows
        {%- else -%}the moon and stars
        {%- endif -%}
      at_trong: >-
        {%- if period == 'dawn' -%}the fading stars still pinpoint-sharp, ridgelines emerging crisp from the blue dark
        {%- elif period == 'sunrise' -%}distant ridgelines crisp in the low warm light, colours true to the horizon
        {%- elif period == 'morning' -%}every distant detail sharp, colours clean all the way to the horizon
        {%- elif period == 'noon' -%}unlimited visibility, colours at full saturation under the strong light
        {%- elif period == 'afternoon' -%}the far horizon sharp, warm colours holding true into the distance
        {%- elif period == 'sunset' -%}the horizon clean and sharply defined behind the setting sun
        {%- elif period == 'dusk' -%}the afterglow gradient clean and unmuddied, first stars already sharp points
        {%- elif period == 'evening' -%}distant lights crisp and distinct, the sky clear enough to show stars
        {%- else -%}so transparent that stars stay sharp down to the horizon and the Milky Way is plainly structured
        {%- endif -%}
      at_am: >-
        {%- if period in ['dawn', 'sunrise'] -%}heavy dew beaded on every leaf and blade of grass
        {%- elif period in ['morning', 'noon', 'afternoon'] -%}a moist sheen on foliage catching {{ at_nguon }}
        {%- elif period == 'sunset' -%}leaves holding wet highlights of the low sun
        {%- elif period in ['dusk', 'evening'] -%}moisture settling back as dew, a damp sheen on leaves and stone
        {%- else -%}heavy dew and condensation on every surface, a damp haze around each light
        {%- endif -%}
      at_nhiet: >-
        {%- if period in ['dawn', 'sunrise'] -%}the day's heat only beginning to build
        {%- elif period == 'morning' -%}the heat climbing steadily through the morning
        {%- elif period in ['noon', 'afternoon'] -%}the heat at its full peak, shimmer distorting the air above hot surfaces
        {%- elif period == 'sunset' -%}the accumulated heat of the whole day still hanging over the land
        {%- else -%}stone and earth still radiating the day's heat long after sunset, the air motionless
        {%- endif -%}

  # ── BƯỚC 3: CÁC KHỐI MÔ TẢ (dùng chung cho Gemini/NVIDIA/Flow) ───────────
  - variables:
      g_lighting: >-
        {% if period == 'dawn' %}Pre-dawn blue hour before sunrise, the sky a deep cool blue brightening faintly at the eastern horizon, no sun yet, the last stars still overhead, cold soft shadowless light, muted blue tones, low-light exposure
        {% elif period == 'sunrise' %}Golden-hour sunrise, warm pink-orange sun low on the horizon, long soft golden shadows stretching across the land, the first direct warm light of the day
        {% elif period == 'morning' %}Clear bright mid-morning daylight, a clean blue sky, medium-length shadows, fresh even natural light
        {% elif period == 'noon' %}Harsh overhead noon sun, deep cobalt sky, very short hard-edged shadows directly beneath objects, full intense midday light
        {% elif period == 'afternoon' %}Strong angled mid-afternoon sun, the light beginning to warm, shadows lengthening and leaning, colours rich and clear
        {% elif period == 'sunset' %}Golden-hour sunset, warm amber sun low in the west, long horizontal shadows, a glowing orange horizon melting up into deeper blue
        {% elif period == 'dusk' %}Blue-hour twilight just after sunset with no direct sun left, sky graded from burnt orange at the horizon through violet to deep blue overhead, first stars appearing, only faint afterglow and the earliest lights on the ground, deep shadows, low-light exposure
        {% elif period == 'evening' %}Full evening after twilight, the sky dark blue to black with stars out, the landscape lit by warm lantern and window light and the last trace of glow at the horizon, deep shadows retained, long low-light exposure
        {% else %}Deep night with no sun and no daylight at all, the landscape lit only by a bright full moon casting cool silver-blue shadows, the Milky Way arcing overhead, warm lantern glow the only earthly light, black shadows retained, long-exposure night photography
        {% endif %}
      g_scene: >-
        {% if period == 'dawn' %}
          {% set scenes = [
            'Bagan Myanmar, thousands of ancient brick temples emerging from thick dawn river mist, hot-air balloons just beginning to rise against the brightening blue sky',
            'Ha Long Bay Vietnam, hundreds of limestone karst towers rising from glass-calm emerald water wrapped in dawn mist, junk boats as dark silhouettes',
            'Angkor Wat Cambodia, the five temple towers a perfect black silhouette mirrored in the still lotus pond, the sky graded deep blue to faint pink before sunrise',
            'Trang An Ninh Binh Vietnam, jagged karst peaks rising from a winding river through flooded valleys, dense dawn mist pouring between the towers, sampan boats gliding',
            'Li River Guilin China, rounded karst peaks receding into layers of dawn mist, a lone fisherman on a bamboo raft with cormorants, the river a flat pale mirror',
            'Mount Bromo Indonesia, the smoking caldera seen from the high viewpoint above an endless sea of clouds, the first cold blue light touching distant peaks',
            'Sa Pa Vietnam, terraced rice valleys filled with a slow river of dawn cloud, black ridgelines of the Hoang Lien mountains floating above the mist',
            'Inle Lake Myanmar, Intha leg-rowing fishermen poised motionless on flat calm water in heavy dawn mist, distant stilt villages barely visible',
            'Zhangjiajie Hunan China, vertical sandstone pillars rising out of a deep sea of pre-dawn cloud, only the tallest columns catching the first cold light'
          ] %}
        {% elif period == 'sunrise' %}
          {% set scenes = [
            'Mu Cang Chai Vietnam, flooded terraced rice paddies cascading down mountains reflecting the pink-gold sunrise sky, thin mist in the valley folds, H\'Mong farmers beginning work',
            'Serengeti Tanzania, a lone flat-topped acacia silhouetted against a blazing orange sunrise, herds of wildebeest and zebra crossing the golden savanna',
            'Uluru Australia, the vast sacred sandstone monolith glowing deep fiery red as the first sun strikes it, the flat desert still in cool shadow',
            'Taj Mahal India, white marble turning warm gold and rose in the first sunlight, mirrored in the long reflecting pool, faint river mist behind',
            'Grand Canyon USA, first golden light spilling across the layered red buttes while the deep gorges stay in cool blue shadow, immense scale',
            'Cappadocia Turkey, hundreds of hot-air balloons rising into the golden sunrise above the fairy-chimney valleys, warm light raking the tufa',
            'Mount Fuji Japan, the snow-capped cone catching pink alpenglow, the Chureito pagoda and cherry blossoms in warm light in the foreground',
            'Jinshanling Great Wall China, the ancient wall snaking along golden ridgelines, low warm sun raking across the watchtowers and hills',
            'Bromo Tengger Indonesia, warm first light flooding across the volcanic sand sea to the smoking cone, long golden shadows from every ridge'
          ] %}
        {% elif period == 'morning' %}
          {% set scenes = [
            'Moraine Lake Banff Canada, the vivid turquoise glacial lake perfectly still under clean morning light, the sharp Valley of the Ten Peaks behind, pine forest all around',
            'Plitvice Lakes Croatia, terraced turquoise and emerald lakes linked by countless waterfalls seen from above, wooden walkways between them, vivid clear light',
            'Jiuzhaigou China, impossibly coloured turquoise and cobalt lakes with submerged logs perfectly visible, autumn forest reflected, bright clean daylight',
            'Lake Bled Slovenia, the island church on the emerald alpine lake, a castle on the cliff above, the Julian Alps behind, crisp clear morning light',
            'Iguazu Falls Argentina Brazil, the vast horseshoe of hundreds of waterfalls thundering into mist, bright rainbows in the spray under strong clear sun',
            'Neuschwanstein Germany, the fairy-tale white castle on its forested crag with the Alps behind, deep green summer hills and a clear blue sky',
            'Faroe Islands Saksun, an emerald turf-roofed hamlet above a tidal lagoon ringed by sheer green cliffs and waterfalls, dramatic clean northern light',
            'Cinque Terre Italy, stacked pastel houses of a cliff village above the sparkling blue Ligurian Sea, terraced vineyards, colours vivid in clear light',
            'Milford Sound New Zealand, sheer forested fjord walls plunging into deep still water, Mitre Peak rising vertically, dozens of waterfalls, crisp under clear morning light'
          ] %}
        {% elif period == 'noon' %}
          {% set scenes = [
            'Maldives North Male Atoll, an infinite expanse of warm Indian Ocean in every shade of blue, ring-shaped reef islands and overwater villas, every coral head visible from above at midday',
            'Bora Bora French Polynesia, the electric-blue lagoon around the green peak of Mount Otemanu, overwater bungalows on stilts, coral gardens through the clear water',
            'El Nido Palawan Philippines, jagged limestone karst islands rising from blazing turquoise water, hidden lagoons, white coral beaches, vivid under the overhead sun',
            'Whitehaven Beach Whitsundays Australia, swirling tidal patterns of pure white silica sand and turquoise water in Hill Inlet seen from above, dazzling at noon',
            'Navagio Zakynthos Greece, the hidden cove of blinding white pebble sand and the famous shipwreck ringed by sheer cliffs, the water electric blue under vertical sun',
            'Maya Bay Thailand, a sheltered emerald bay enclosed by towering jungle-topped limestone cliffs, powder-white sand and glass-clear shallows brilliant at midday',
            'Great Barrier Reef Australia, aerial of the Heart Reef and coral ribbons, endless gradients of turquoise against deep blue ocean, vivid under the noon sun',
            'Anse Source d\'Argent Seychelles, sculpted rose-pink granite boulders on powder-white sand and a shallow turquoise lagoon, palms overhead, colours at maximum',
            'Grace Bay Turks and Caicos, twelve kilometres of powder-white sand and a shallow bank grading from pure white through aquamarine to deep navy, dazzling at midday'
          ] %}
        {% elif period == 'afternoon' %}
          {% set scenes = [
            'Monument Valley USA, vast red sandstone buttes and mesas rising from the flat desert, long leaning shadows in the strong warm afternoon light, deep blue sky',
            'Zhangye Danxia China, rainbow-striped sandstone hills in vivid bands of red, orange and yellow, colours saturated under strong angled afternoon sun',
            'Wadi Rum Jordan, immense red sandstone mountains rising from orange desert sand, long dramatic shadows raking across the dunes in warm light',
            'Namib Desert Sossusvlei Namibia, towering rust-red dunes with knife-edge crests, one face in warm light one in deep shadow, a white salt pan at the base',
            'Petra Jordan, the rose-red rock-cut Treasury glowing warm where the angled sun reaches into the narrow canyon, dramatic light and shadow on carved stone',
            'Grand Prismatic Yellowstone USA, the enormous hot spring ringed in vivid orange, yellow and green around deep blue water, steam drifting, vivid in strong light',
            'Salar de Uyuni Bolivia dry season, the endless white hexagonal salt crust to the horizon under a deep blue sky, distant volcanoes shimmering in the heat',
            'Cappadocia valleys Turkey, the pale fairy-chimney rock formations casting long warm shadows across the valleys in the strong afternoon sun',
            'Antelope Canyon USA, smooth sculpted orange sandstone walls glowing where the high afternoon sun filters into the narrow slot, warm reflected light'
          ] %}
        {% elif period == 'sunset' %}
          {% set scenes = [
            'Santorini Oia Greece, white cubic houses and blue-domed churches cascading down the caldera cliff, the whole village and the Aegean blazing orange as the sun sinks into the sea',
            'Hoi An Vietnam, the lantern-filled ancient town glowing amber, the Japanese covered bridge and yellow merchant houses reflected in the Thu Bon river, silk lanterns swaying',
            'Venice Italy, the Grand Canal and the domes of Santa Maria della Salute in warm gold light, gondolas silhouetted, the water ablaze with the sunset',
            'Mont Saint-Michel France, the island abbey rising from tidal flats mirrored in wet sand, spire and ramparts glowing amber against a fiery sky',
            'Positano Amalfi Italy, pastel houses tumbling down the steep cliff to the sea, warm golden light on the facades and the Tyrrhenian horizon burning orange',
            'Dubrovnik Croatia, the honey-gold medieval walls and terracotta rooftops of the walled city glowing in the last sun, the Adriatic blazing beyond',
            'Budapest Hungary, the Parliament on the Danube lit gold by the setting sun, the river reflecting the warm facade and the Chain Bridge',
            'Sydney Australia, the Opera House sails and Harbour Bridge glowing warm against a fiery orange sky, the harbour reflecting the sunset',
            'Prague Czech Republic, the Gothic spires and red rooftops of the old town glowing gold, Charles Bridge and the castle silhouetted against an amber sky'
          ] %}
        {% elif period == 'dusk' %}
          {% set scenes = [
            'Shanghai China, the Bund and the Pudong towers lighting up against a deep blue-violet twilight, the Huangpu river a mirror of coloured light',
            'Hong Kong, Victoria Harbour at blue hour, the wall of skyscrapers glowing against the darkening sky, lights reflected in the water, the Peak behind',
            'Paris France, the Eiffel Tower and Haussmann rooftops at blue hour, warm street lights coming on while the sky holds deep blue',
            'Tre Cime di Lavaredo Dolomites Italy, the three vertical spires glowing pink and violet in alpenglow as the sky darkens, mountain huts warm below',
            'Singapore, Marina Bay at blue hour, the Gardens by the Bay Supertrees and the skyline glowing against a violet sky, reflections across the still bay',
            'Manhattan New York, the skyline at blue hour from across the water, thousands of windows lighting up against the twilight graded orange to indigo',
            'Torres del Paine Chile, the granite towers glowing famous pink-gold Patagonian alpenglow, mirrored in a still lake as the land falls dark',
            'Matterhorn Zermatt Switzerland, the iconic peak glowing pink against a deep blue dusk, village lights coming on in the dark valley below',
            'Dubai UAE, the Marina and Burj Khalifa skyline blazing with light against a burnt-orange to indigo twilight gradient, reflections in the water'
          ] %}
        {% elif period == 'evening' %}
          {% set scenes = [
            'Kyoto Japan, the wooden Kiyomizu-dera and the Gion lanes glowing with warm lantern light in full darkness, stone lanterns and paper windows lit, a still canal reflecting the glow',
            'Marrakech Morocco, the Jemaa el-Fnaa square at night alive with food-stall smoke and warm lamplight, the lit Koutoubia minaret rising against the black sky',
            'Varanasi India, the Ganges ghats at night during the Ganga Aarti, hundreds of oil lamps and floating candles on the dark river, temples lit behind',
            'Tokyo Japan, the Shibuya crossing and neon-drenched streets at night, brilliant signage reflected in wet pavement, crowds under a black sky',
            'Venice Italy at night, warm lamplight along the dark canals, gondolas moored, the lit facade of a palazzo mirrored in the black water',
            'Bruges Belgium, medieval stepped-gable houses along the canals lit warm at night, the Belfry floodlit above the square, still black water mirroring the golden reflections',
            'Kuala Lumpur Malaysia, the Petronas Twin Towers blazing with light against the night sky, the surrounding city lit, reflecting pool below',
            'Istanbul Turkey, the Blue Mosque and Hagia Sophia floodlit warm against the black sky, minarets rising, the plaza between them softly lit',
            'Luang Prabang Laos, the night market and gilded temple roofs glowing under warm lantern strings in full darkness, monks\' quarters lit softly behind'
          ] %}
        {% else %}
          {% set scenes = [
            'Atacama Desert Chile, the darkest sky on Earth at high altitude, the entire Milky Way and nebulae blazing overhead, giant cardon cacti as black silhouettes on the pale floor',
            'Mauna Kea Hawaii, the volcano summit above the clouds, the Milky Way arcing over the silhouetted observatory domes, thousands of stars in the cold clear air',
            'Deadvlei Namibia at night, the ancient black skeletal camel-thorn trees on the white clay pan under brilliant moonlight, the Milky Way blazing above the red dunes',
            'Aoraki Mount Cook New Zealand, the highest peak under a spectacular southern night sky, the Milky Way horizon to horizon reflected in the black mirror of Lake Pukaki',
            'Sahara Merzouga Morocco, immense moonlit orange dunes rolling to the horizon under a sky thick with stars, a single line of camel tracks, absolute silence',
            'Salar de Uyuni Bolivia wet season, a thin layer of water turning the salt flat into a perfect mirror of the entire star-filled sky, the horizon dissolving',
            'Lofoten Islands Norway, the Northern Lights in curtains of green and violet dancing above jagged black peaks, mirrored in the still Arctic fjord, red cabins on the shore',
            'Tromso Norway, the aurora borealis rippling over a snow-covered Arctic landscape, the frozen fjord reflecting the green light, silhouetted pines',
            'Wadi Rum Jordan at night, the red desert and sandstone mountains under brilliant moonlight and a dense field of stars, a few tent lights glowing warm on the valley floor'
          ] %}
        {% endif %}
        {% set si = now().timetuple().tm_yday % (scenes | length) %}
        {{ scenes[si] }}
      g_weather_fx: >-
        {% if 'thunder' in w or 'bão' in w %}A violent thunderstorm overhead, towering cumulonimbus boiling upward, a lightning bolt striking in the middle distance{% if troi_toi %} and lighting the whole landscape white for a split second out of the dark{% else %} beneath a sky of black, purple and sickly green storm colour{% endif %}, wind bending trees sideways, debris spinning through turbulent air
        {% elif 'rain' in w or 'mưa' in w %}Heavy rain falling in thick curtains, every surface a wet mirror, puddles rippling in overlapping circles, droplets hanging from every leaf tip, rain streaks catching {{ at_nguon }}, the far distance softened by the water
        {% elif 'snow' in w or 'tuyết' in w %}Large snowflakes drifting through still air, a thick untouched blanket of snow over every surface, branches laden and bowed, the snow catching {{ at_nguon }}, distant shapes softened by the falling snow
        {% elif 'fog' in w or 'sương' in w or 'mist' in w %}Dense fog rolling across the landscape, near objects crisp while the mid-distance dissolves and the far distance disappears entirely,{% if troi_toi %} every light source becoming a soft glowing halo inside the mist{% else %} light scattering softly through the moisture with no hard shadows{% endif %}, an atmosphere of mystery and isolation
        {% elif 'cloud' in w or 'mây' in w %}Layers of thick overcast cloud from flat stratus to billowing cumulus,{% if period in ['dusk', 'sunset'] %} the cloud base still holding the last warm light from below{% elif period == 'evening' %} the cloud base faintly lit by distant town lights{% elif period == 'night' %} the cloud hiding the stars, a faint glow where the moon sits behind it{% else %} light arriving soft and directionless with no hard shadows anywhere{% endif %}
        {% elif 'clear' in w or 'nắng' in w or 'sunny' in w %}A completely cloudless sky{% if period in ['dusk', 'evening'] %}, the twilight gradient unbroken by any cloud{% elif period == 'night' %}, the stars unobscured from horizon to horizon{% elif period == 'dawn' %}, the last stars fading in a clean brightening blue{% else %} of the deepest blue, hard-edged shadows with sharply defined borders{% endif %}
        {% else %}Scattered white cumulus drifting across the sky,{% if period == 'night' %} passing in front of the moon and briefly dimming the land below{% elif period in ['dusk', 'sunset'] %} their undersides lit warm by the low sun{% else %} their shadows moving in patches over the land below{% endif %}
        {% endif %}
      g_air: >-
        {% if aqi | int > 150 %}Heavy toxic smog at AQI {{ aqi }}{% if pm25 | float > 0 %} with PM2.5 at {{ pm25 }} µg/m³{% endif %}, a thick acrid brown haze,{% if troi_toi %} every light swollen into a dirty orange halo, no stars visible at all{% else %} visibility cut to a few hundred metres, the sun only a pale disc, the whole scene desaturated{% endif %}
        {% elif aqi | int > 100 %}Unhealthy air at AQI {{ aqi }}{% if pm25 | float > 0 %}, PM2.5 {{ pm25 }} µg/m³{% endif %},{% if troi_toi %} distant lights dimmed and yellowed, only the brightest stars pushing through{% else %} a grey-brown haze softening everything beyond the middle distance{% endif %}
        {% elif aqi | int > 50 %}Mild haze from AQI {{ aqi }}{% if troi_toi %} dimming whatever sits low on the horizon while things overhead stay clear{% else %} softening the far horizon only, nearer objects unaffected{% endif %}
        {% else %}{% if tam_nhin_bi_che %}The air itself clean at AQI {{ aqi }} — what hangs in it is pure water vapour, not pollution{% else %}Clean air at AQI {{ aqi }}, {{ at_trong }}{% endif %}
        {% endif %}
      g_temp_fx: >-
        {% if temp | float > 35 %}Scorching {{ temp | round }}°C, {{ at_nhiet }}, plants visibly drooping, every creature seeking shelter
        {% elif temp | float > 30 %}Heavy tropical heat of {{ temp | round }}°C, {{ at_nhiet }}
        {% elif temp | float > 25 %}A warm {{ temp | round }}°C,{% if troi_toi %} a mild still evening, comfortable enough to sit outside{% else %} vegetation full and thriving in the gentle heat{% endif %}
        {% elif temp | float > 18 %}A cool {{ temp | round }}°C with a crispness to the air{% if troi_toi %}, a chill settling in now the sun has gone{% endif %}
        {% else %}Biting cold of {{ temp | round }}°C, frost crystals coating every surface, breath condensing into white vapour, the frost glittering wherever {{ at_nguon }} reaches it
        {% endif %}
      g_wind_fx: >-
        {% if wind | float > 30 %}Gale-force wind of {{ wind | round }} km/h, mature trees bent to 45 degrees, branches and debris spiralling through the air, any water surface whipped into white-capped waves
        {% elif wind | float > 15 %}Steady wind of {{ wind | round }} km/h, all foliage in continuous motion, grass rippling in waves, clear ripples across every water surface
        {% elif wind | float > 5 %}A light breeze of {{ wind | round }} km/h, only the finest leaf edges and grass tips stirring
        {% else %}Not a breath of wind at {{ wind | round }} km/h, every leaf motionless, every water surface a flawless mirror reflecting {{ at_nguon }} in perfect detail
        {% endif %}
      g_hum_fx: >-
        {% if hum | int > 85 %}Oppressive humidity of {{ hum }}%, the air thick and heavy, {{ at_am }}
        {% elif hum | int > 60 %}Humidity of {{ hum }}%, {{ at_am }}
        {% elif hum | int < 30 %}Parched air at only {{ hum }}% humidity, fine dust suspended in the air, the earth cracked into geometric plates
        {% else %}Balanced humidity of {{ hum }}%, the air fresh and free of moisture haze
        {% endif %}
      g_style_fx: >-
        {% if image_style == 'artistic' %}Painterly interpretation, expressive brushstroke-like texture, impressionistic mood
        {% elif image_style == 'vibrant' %}Bold high-contrast rendering, colours pushed to their most vivid
        {% else %}Photorealistic rendering faithful to real-world colour and material
        {% endif %}

  # ── BƯỚC 3B: GHÉP PROMPT (chi tiết cho Gemini/Flow, gọn cho NVIDIA) ───────
  - variables:
      g_parts: >-
        {{ [ g_scene | trim, g_lighting | trim, g_weather_fx | trim, g_air | trim,
             g_temp_fx | trim, g_wind_fx | trim, g_hum_fx | trim, g_style_fx | trim ]
           | select('ne', '') | list | join('. ') }}
      # Prompt CHI TIẾT — dùng cho Gemini và Flow (style=detailed)
      detailed_prompt: >-
        {{ ('Ultra-photorealistic cinematic aerial photograph, Hasselblad medium format, 24mm wide-angle lens. '
            ~ g_parts
            ~ '. Wide panoramic composition with strong foreground-to-horizon depth. '
            ~ 'Award-winning National Geographic reportage quality. '
            ~ ('No people in frame, only the landscape. ' if troi_toi else '')
            ~ 'No text, no captions, no borders, no modern intrusions.'
           ) | regex_replace('\\s+', ' ') | trim }}
      # Prompt NGẮN GỌN — dùng cho NVIDIA và Flow (style=compact). Chỉ 4 khối
      # cốt lõi: chủ đề + ánh sáng + thời tiết + nhiệt. Flux đọc ngắn hợp hơn.
      compact_prompt: >-
        {{ ([ g_scene | trim, g_lighting | trim, g_weather_fx | trim, g_temp_fx | trim ]
            | select('ne', '') | list | join('. ')
            ~ '. Cinematic aerial landscape photo, photorealistic, no text.'
           ) | regex_replace('\\s+', ' ') | trim }}
      flow_prompt_style: !input flow_prompt_style
      # Prompt cuối theo từng engine
      gemini_prompt: "{{ detailed_prompt }}"
      nvidia_prompt: "{{ compact_prompt }}"
      flow_prompt: "{{ detailed_prompt if flow_prompt_style == 'detailed' else compact_prompt }}"
      task_name: "Weather {{ states(time_phase_sensor) }} - {{ states(weather_entity) }} - Scene {{ scene_index }}"

  # ── BƯỚC 4: GỌI ENGINE THEO LỰA CHỌN ─────────────────────────────────────
  #  ⚠️ Ba nhánh dưới đây là phần tôi KHÔNG thấy bản gốc của bạn (paste bị cắt).
  #     Đối chiếu tên service với file .py / cấu hình ai_task của bạn rồi sửa.
  - choose:

      # ── 4A · GEMINI ────────────────────────────────────────────────────
      - conditions:
          - "{{ ai_engine == 'gemini' }}"
        sequence:
          - variables:
              ai_task_entity: !input ai_task_entity
          # ⚠️ KIỂM: service tạo ảnh của ai_task trên HA của bạn. Tùy phiên bản
          #    có thể là ai_task.generate_image hoặc ai_task.generate_data.
          #    `response_variable` giữ kết quả để lấy đường dẫn ảnh sinh ra.
          - service: ai_task.generate_image
            data:
              task_name: "{{ task_name }}"
              entity_id: "{{ ai_task_entity }}"
              instructions: "{{ gemini_prompt }}"
            response_variable: ai_result
          # ⚠️ KIỂM: khóa chứa đường dẫn ảnh trong ai_result (có bản trả
          #    'image_path', có bản 'path' hoặc 'media_path'). In ra log 1 lần
          #    để biết đúng khóa rồi sửa dòng dưới.
          - variables:
              nguon_anh: "{{ ai_result.image_path | default(ai_result.path | default('')) }}"
          # Lưu: mv ảnh AI tạm → đường dẫn cuối (shell_command trong config).
          - if:
              - "{{ save_image and nguon_anh not in ['', none] }}"
            then:
              - service: shell_command.copy_weather_image
                data:
                  source: "{{ nguon_anh }}"
                  destination: "{{ final_image_path }}"
          # Dọn ảnh AI tạm còn sót (dự phòng — chỉ Gemini).
          - if:
              - "{{ delete_ai_image }}"
            then:
              - service: delete.files_in_folder
                data:
                  folder: "{{ ai_image_delete_folder }}"
                  age_in_seconds: "{{ ai_image_delete_age }}"

      # ── 4B · NVIDIA FLUX (PyScript) ────────────────────────────────────
      - conditions:
          - "{{ ai_engine == 'nvidia' }}"
        sequence:
          # ⚠️ KIỂM: tên hàm @service trong weather_image.py và tên tham số.
          #    Script này TỰ ghi ra `output_path`, nên không cần shell_command.
          - service: pyscript.weather_image
            data:
              prompt: "{{ nvidia_prompt }}"
              steps: !input steps
              width: !input width
              height: !input height
              output_path: "{{ final_image_path }}"

      # ── 4C · GOOGLE FLOW (PyScript hoặc gateway REST) ──────────────────
      - conditions:
          - "{{ ai_engine == 'flow' }}"
        sequence:
          # ⚠️ KIỂM: tên hàm @service trong flow_image.py và tên tham số.
          #    NÊN trỏ flow_api_url vào CỔNG CHÍNH .../v1/images/generations và
          #    để flow_image.py gửi thân {"model":"flow/banana-pro","prompt":...,
          #    "size":"<width>x<height>"} — khi đó Flow đi đường REST đã sửa:
          #    khung hình đúng, ảnh gốc, tự xoay tài khoản, vào thư viện.
          - service: pyscript.flow_image
            data:
              prompt: "{{ flow_prompt }}"
              api_url: !input flow_api_url
              project_id: !input flow_project_id
              output_path: "{{ final_image_path }}"

  # ── BƯỚC 5: GỬI ẢNH ──────────────────────────────────────────────────────
  - variables:
      include_telegram_notify: !input include_telegram_notify
      telegram_target: !input telegram_target
      telegram_thread_id: !input telegram_thread_id
      enable_zalo_bot: !input enable_zalo_bot
      zalo_bot_chat_id: !input zalo_bot_chat_id
      enable_zalo_custom: !input enable_zalo_custom
      zalo_custom_account: !input zalo_custom_account
      zalo_custom_thread_id: !input zalo_custom_thread_id
      zalo_custom_user_id: !input zalo_custom_user_id
      zalo_custom_receiver_type: !input zalo_custom_receiver_type
      zalo_custom_ttl: !input zalo_custom_ttl
      caption: >-
        {{ states(time_phase_sensor) }} · {{ states(weather_entity) }} ·
        {{ temp | round }}°C · ẩm {{ hum }}% · gió {{ wind | round }}km/h

  # Telegram
  - if:
      - "{{ include_telegram_notify }}"
    then:
      # ⚠️ KIỂM: khớp cách bạn vốn gửi Telegram (config_entry hay notify.*).
      - service: telegram_bot.send_photo
        data:
          file: "{{ final_image_path }}"
          caption: "{{ caption }}"
          target: "{{ telegram_target if telegram_target != '' else omit }}"
          message_thread_id: "{{ telegram_thread_id if telegram_thread_id != '' else omit }}"

  # Zalo Bot (PyScript)
  - if:
      - "{{ enable_zalo_bot and zalo_bot_chat_id != '' }}"
    then:
      # ⚠️ KIỂM: tên hàm @service Zalo Bot của bạn.
      - service: pyscript.zalo_bot_send_photo
        data:
          chat_id: "{{ zalo_bot_chat_id }}"
          photo_path: "{{ final_image_path }}"
          caption: "{{ caption }}"

  # Zalo Custom Integration
  - if:
      - "{{ enable_zalo_custom }}"
    then:
      # ⚠️ KIỂM: tên service tích hợp Zalo custom của bạn và tên tham số.
      - service: zalo.send_image
        data:
          account: "{{ zalo_custom_account }}"
          thread_id: "{{ zalo_custom_thread_id }}"
          user_id: "{{ zalo_custom_user_id }}"
          receiver_type: "{{ zalo_custom_receiver_type }}"
          image_path: "{{ final_image_path }}"
          message: "{{ caption }}"
          ttl: "{{ zalo_custom_ttl }}"
