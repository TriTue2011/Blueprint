blueprint:
  name: Tạo ảnh thời tiết AI
  author: TriTue2011
  source_url: https://raw.githubusercontent.com/TriTue2011/Blueprint/main/ai_creat_image_weather_3.yaml
  description: >
    Tự động tạo ảnh thời tiết bằng AI với 3 lựa chọn engine:
    **Gemini AI Task** (tích hợp HA native), **NVIDIA Flux qua PyScript**,
    hoặc **Google Flow qua PyScript** (Local API nội bộ).
    Phong cảnh thay đổi theo buổi trong ngày, dữ liệu thời tiết thực tế,
    và **xoay vòng 12 địa điểm đẹp nhất thế giới** cho mỗi buổi.

    <details>
    <summary><b>⚙️ Yêu cầu cấu hình chung:</b> - Nhấn để mở rộng</summary>

      **Template Sensor nhận diện buổi trong ngày (bắt buộc):**

      Thêm vào `configuration.yaml`:
      ```yaml
      template:
        - sensor:
            - name: "Buổi trong ngày"
              unique_id: time_of_day_vn
              icon: >-
                {% set h = now().hour %}
                {% if   5 <= h < 6  %} mdi:weather-sunset-up
                {% elif 6 <= h < 8  %} mdi:weather-sunny
                {% elif 8 <= h < 11 %} mdi:weather-sunny
                {% elif 11 <= h < 14 %} mdi:white-balance-sunny
                {% elif 14 <= h < 16 %} mdi:weather-sunny
                {% elif 16 <= h < 18 %} mdi:weather-sunset
                {% elif 18 <= h < 19 %} mdi:weather-sunset-down
                {% elif 19 <= h < 22 %} mdi:weather-night
                {% else %} mdi:weather-night
                {% endif %}
              state: >-
                {% set h = now().hour %}
                {% if   5 <= h < 6  %} Rạng đông
                {% elif 6 <= h < 8  %} Bình minh
                {% elif 8 <= h < 11 %} Sáng
                {% elif 11 <= h < 14 %} Trưa
                {% elif 14 <= h < 16 %} Xế
                {% elif 16 <= h < 18 %} Hoàng hôn
                {% elif 18 <= h < 19 %} Chạng vạng
                {% elif 19 <= h < 22 %} Tối
                {% else %} Đêm
                {% endif %}
              attributes:
                period_english: >-
                  {% set h = now().hour %}
                  {% if   5 <= h < 6  %} dawn
                  {% elif 6 <= h < 8  %} sunrise
                  {% elif 8 <= h < 11 %} morning
                  {% elif 11 <= h < 14 %} noon
                  {% elif 14 <= h < 16 %} afternoon
                  {% elif 16 <= h < 18 %} sunset
                  {% elif 18 <= h < 19 %} dusk
                  {% elif 19 <= h < 22 %} evening
                  {% else %} night
                  {% endif %}
      ```

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu khi dùng Gemini AI Task:</b> - Nhấn để mở rộng</summary>

      Sử dụng addon (dockercompse) https://github.com/luuquangvu/Gemini-FastAPI và tích hợp https://github.com/luuquangvu/hass_local_openai_llm.

      Thêm vào `configuration.yaml`:
      ```yaml
      shell_command:
        copy_weather_image: >
          mv "{{ source }}" "{{ destination }}"
      ```

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu khi dùng NVIDIA Flux PyScript:</b> - Nhấn để mở rộng</summary>

      Dùng api nvidia. đăng ký tại https://build.nvidia.com và dùng tích hợp https://github.com/luuquangvu/hass_local_openai_llm

      Thêm vào `configuration.yaml`:
      ```yaml
      pyscript:
        allow_all_imports: true
        hass_is_global: true
        nvidia_api_key: !secret nvidia_api_key
      ```

      Thêm vào `secrets.yaml`:
      ```yaml
      nvidia_api_key: "nvapi-xxx"
      ```

      Tải file script Python tại:
      https://github.com/TriTue2011/Blueprint/blob/main/scripts/weather_image.py

      Đặt file vào thư mục `pyscript/` trong config Home Assistant.

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu khi dùng Google Flow PyScript:</b> - Nhấn để mở rộng</summary>

      Dùng API Google Flow nội bộ hoặc proxy server riêng.

      Thêm vào `configuration.yaml`:
      ```yaml
      pyscript:
        allow_all_imports: true
        hass_is_global: true
        flow_api_key: !secret flow_api_key
      ```

      Thêm vào `secrets.yaml`:
      ```yaml
      flow_api_key: "your-flow-api-key"
      ```

      Tải file script Python `flow_image.py` và đặt vào thư mục `pyscript/`.

    </details>

  domain: automation
  homeassistant:
    min_version: 2025.10.0

  input:
    # ===== CHỌN ENGINE AI =====
    engine_settings:
      name: "🤖 Chọn Engine AI"
      icon: mdi:robot-outline
      collapsed: false
      input:
        ai_engine:
          name: Engine tạo ảnh
          description: >
            Chọn phương thức tạo ảnh:
            **Gemini** dùng ai_task native của HA (khuyến nghị).
            **NVIDIA Flux** dùng PyScript + API key riêng.
            **Google Flow** dùng PyScript + Flow API nội bộ.
          default: gemini
          selector:
            select:
              options:
                - label: Gemini AI Task (HA Native - Khuyến nghị)
                  value: gemini
                - label: NVIDIA Flux (PyScript)
                  value: nvidia
                - label: Google Flow (PyScript - Local API)
                  value: flow

    # ===== CÀI ĐẶT THỜI TIẾT =====
    weather_sensors:
      name: "🌤️ Cảm biến thời tiết"
      icon: mdi:weather-partly-cloudy
      collapsed: false
      input:
        time_phase_sensor:
          name: Pha thời gian trong ngày
          description: Sensor hiển thị buổi trong ngày (Sáng/Trưa/Chiều/Tối/Đêm)
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false

        weather_entity:
          name: Thực thể thời tiết
          description: Weather entity chính (weather.*)
          selector:
            entity:
              filter:
                - domain: weather
              multiple: false

        temperature_sensor:
          name: Cảm biến nhiệt độ (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
              multiple: false

        humidity_sensor:
          name: Cảm biến độ ẩm (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
              multiple: false

        wind_speed_sensor:
          name: Cảm biến tốc độ gió (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false

        pressure_sensor:
          name: Cảm biến áp suất (tùy chọn) — chỉ dùng với Gemini
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false

    # ===== CHẤT LƯỢNG KHÔNG KHÍ =====
    air_quality_sensors:
      name: "🏭 Cảm biến chất lượng không khí"
      icon: mdi:air-filter
      collapsed: true
      input:
        aqi_sensor:
          name: AQI - Chỉ số chất lượng không khí (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: aqi
              multiple: false

        pm25_sensor:
          name: PM2.5 (tùy chọn)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false

    # ===== CÀI ĐẶT GEMINI =====
    gemini_settings:
      name: "✨ Cài đặt Gemini AI Task"
      icon: mdi:google
      collapsed: true
      input:
        ai_task_entity:
          name: AI Task Entity
          description: Chọn AI entity hỗ trợ tạo ảnh (Gemini 2.5 Flash Image recommended). Bỏ qua nếu dùng NVIDIA hoặc Flow.
          default: []
          selector:
            entity:
              domain: ai_task
              multiple: false

        image_style:
          name: Phong cách ảnh (Gemini)
          default: photorealistic
          selector:
            select:
              options:
                - label: Ảnh chụp chân thực (Photorealistic)
                  value: photorealistic
                - label: Phong cách nghệ thuật (Artistic)
                  value: artistic
                - label: Phong cách sống động (Vibrant)
                  value: vibrant

    # ===== LƯU ẢNH (CHUNG CHO CẢ 3 ENGINE) =====
    image_output:
      name: "💾 Lưu ảnh — Chung cho cả 3 Engine"
      icon: mdi:content-save
      collapsed: true
      input:
        save_image:
          name: Lưu ảnh vào thư mục
          description: |
            ⚠️ Yêu cầu shell_command trong configuration.yaml:
            shell_command:
              copy_weather_image: mv "{{ source }}" "{{ destination }}"
          default: true
          selector:
            boolean:

        output_directory:
          name: Thư mục đầu ra
          default: "/config/media/weather"
          selector:
            text:

        use_fixed_filename:
          name: Sử dụng tên file cố định
          description: Bật để ghi đè file cũ (khuyến nghị)
          default: true
          selector:
            boolean:

        fixed_filename:
          name: Tên file cố định
          default: "weather_current"
          selector:
            text:

        filename_prefix:
          name: Tiền tố tên file (khi không cố định)
          default: "weather_"
          selector:
            text:

        file_extension:
          name: Phần mở rộng file
          default: "png"
          selector:
            select:
              options:
                - png
                - jpg
                - jpeg
                - webp

        delete_ai_image:
          name: Xóa ảnh AI sau khi lưu (dự phòng — chỉ Gemini)
          description: |
            Dùng delete.files_in_folder (HACS) như bước dự phòng.
            Nếu đã dùng mv trong shell_command thì ảnh gốc đã bị xóa.
          default: false
          selector:
            boolean:

        ai_image_delete_folder:
          name: Thư mục chứa ảnh AI cần xóa (dự phòng — chỉ Gemini)
          description: |
            Thư mục mà Gemini AI Task lưu ảnh tạm thời.
            Chỉ dùng khi bật "Xóa ảnh AI sau khi lưu" ở trên.
            Mặc định: `/config/media/ai_task/image`
          default: "/config/media/ai_task/image"
          selector:
            text:

        ai_image_delete_age:
          name: Xóa ảnh cũ hơn (giây) — chỉ Gemini
          description: |
            Ảnh cũ hơn số giây này sẽ bị xóa khỏi thư mục AI tạm.
            Mặc định: 3600 giây (1 giờ).
          default: 3600
          selector:
            number:
              min: 60
              max: 86400
              step: 60
              unit_of_measurement: giây
              mode: box

    # ===== CÀI ĐẶT NVIDIA =====
    nvidia_settings:
      name: "⚡ Cài đặt NVIDIA Flux PyScript"
      icon: mdi:flash
      collapsed: true
      input:
        steps:
          name: Số bước sinh ảnh
          description: Cao hơn = chất lượng tốt hơn, chậm hơn (khuyến nghị 6–8)
          default: 6
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: slider

        width:
          name: Chiều rộng (px)
          default: 1344
          selector:
            number:
              min: 512
              max: 1920
              step: 64
              mode: slider

        height:
          name: Chiều cao (px)
          default: 768
          selector:
            number:
              min: 256
              max: 1080
              step: 64
              mode: slider

    # ===== CÀI ĐẶT GOOGLE FLOW =====
    flow_settings:
      name: "🌊 Cài đặt Google Flow PyScript"
      icon: mdi:google-cloud
      collapsed: true
      input:
        flow_api_url:
          name: Flow API URL
          description: URL của Flow API server nội bộ
          default: "http://172.16.10.38:8010/v1/google/flow/generate-image"
          selector:
            text:

        flow_project_id:
          name: Project ID
          description: Google Cloud Project ID dùng cho Flow API
          default: "54468d77-02ff-4a06-bb81-05a7d1111544"
          selector:
            text:

        flow_prompt_style:
          name: Phong cách prompt gửi cho Flow
          description: >
            **Chi tiết** dùng prompt dài như Gemini (mô tả cảnh rất đầy đủ).
            **Ngắn gọn** dùng prompt súc tích như NVIDIA.
            Flow hoạt động tốt với cả hai; khuyến nghị Chi tiết.
          default: detailed
          selector:
            select:
              options:
                - label: Chi tiết (Gemini style - khuyến nghị)
                  value: detailed
                - label: Ngắn gọn (NVIDIA style)
                  value: compact

    # ===== GỬI ẢNH =====
    notify_image_section:
      name: "📤 Gửi ảnh sau khi tạo"
      icon: mdi:image-send
      collapsed: false
      input:
        include_telegram_notify:
          name: ✅ Gửi qua Telegram
          default: false
          selector:
            boolean: {}

        telegram_config_entry:
          name: 🤖 Telegram Bot
          default: ""
          selector:
            config_entry:
              integration: telegram_bot

        telegram_target:
          name: 🧑‍💻 Target Chat ID
          description: Bỏ trống để dùng mặc định của bot.
          default: ""
          selector:
            text: {}

        telegram_thread_id:
          name: 🧵 Thread ID (tuỳ chọn)
          default: ""
          selector:
            text: {}

        enable_zalo_bot:
          name: ✅ Gửi qua Zalo Bot (Pyscript)
          default: false
          selector:
            boolean: {}

        zalo_bot_chat_id:
          name: 🧑‍💻 Zalo Bot Chat ID
          default: ""
          selector:
            text: {}

        enable_zalo_custom:
          name: ✅ Gửi qua Zalo Custom Integration
          default: false
          selector:
            boolean: {}

        zalo_custom_account:
          name: 📱 Tài khoản Zalo
          default: ""
          selector:
            text: {}

        zalo_custom_thread_id:
          name: 💬 Thread ID (Nhóm)
          default: ""
          selector:
            text: {}

        zalo_custom_user_id:
          name: 👤 User ID (Cá nhân)
          default: ""
          selector:
            text: {}

        zalo_custom_receiver_type:
          name: 👥 Receiver Type
          default: "0"
          selector:
            select:
              options:
                - label: User (Cá nhân)
                  value: "0"
                - label: Group (Nhóm)
                  value: "1"

        zalo_custom_ttl:
          name: ⏳ TTL (ms)
          default: 0
          selector:
            number:
              min: 0
              max: 86400000
              step: 1000
              mode: box

# ===== TRIGGER =====
trigger:
  - platform: time
    at: "05:00:00"
  - platform: time
    at: "11:00:00"
  - platform: time
    at: "13:00:00"
  - platform: time
    at: "18:00:00"
  - platform: time
    at: "22:00:00"
  - platform: state
    entity_id: !input time_phase_sensor
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable

# ===== CONDITIONS =====
condition:
  - condition: template
    value_template: >
      {{ trigger.platform == 'time'
         or trigger.from_state.state != trigger.to_state.state }}

# ===== ACTIONS =====
action:
  # ── BƯỚC 1: THU THẬP DỮ LIỆU THỜI TIẾT ───────────────────────────────────
  - variables:
      ai_engine: !input ai_engine
      time_phase_sensor: !input time_phase_sensor
      tp: "{{ states(time_phase_sensor) | lower }}"
      weather_entity: !input weather_entity
      w: "{{ states(weather_entity) | lower }}"

      scene_index: "{{ now().timetuple().tm_yday % 12 }}"

      temperature_sensor: !input temperature_sensor
      temp: >-
        {% if temperature_sensor and temperature_sensor != '' and states(temperature_sensor) not in ['unknown','unavailable',''] %}
          {{ states(temperature_sensor) | float(30) | round(1) }}
        {% else %}
          {{ state_attr(weather_entity, 'temperature') | float(30) | round(1) }}
        {% endif %}

      humidity_sensor: !input humidity_sensor
      hum: >-
        {% if humidity_sensor and humidity_sensor != '' and states(humidity_sensor) not in ['unknown','unavailable',''] %}
          {{ states(humidity_sensor) | int(70) }}
        {% else %}
          {{ state_attr(weather_entity, 'humidity') | int(70) }}
        {% endif %}

      wind_speed_sensor: !input wind_speed_sensor
      wind: >-
        {% if wind_speed_sensor and wind_speed_sensor != '' and states(wind_speed_sensor) not in ['unknown','unavailable',''] %}
          {{ states(wind_speed_sensor) | float(5) | round(1) }}
        {% else %}
          {{ state_attr(weather_entity, 'wind_speed') | float(5) | round(1) }}
        {% endif %}

      pressure_sensor: !input pressure_sensor
      pressure: >-
        {% if pressure_sensor and pressure_sensor != '' and states(pressure_sensor) not in ['unknown','unavailable',''] %}
          {{ states(pressure_sensor) | float(0) | round(0) }}
        {% else %}
          {{ state_attr(weather_entity, 'pressure') | float(0) | round(0) }}
        {% endif %}

      aqi_sensor: !input aqi_sensor
      aqi: >-
        {% if aqi_sensor and aqi_sensor != '' and states(aqi_sensor) not in ['unknown','unavailable',''] %}
          {{ states(aqi_sensor) | int(0) }}
        {% else %}
          0
        {% endif %}

      pm25_sensor: !input pm25_sensor
      pm25: >-
        {% if pm25_sensor and pm25_sensor != '' and states(pm25_sensor) not in ['unknown','unavailable',''] %}
          {{ states(pm25_sensor) | float(0) | round(1) }}
        {% else %}
          0
        {% endif %}

  # ── BƯỚC 1B: TÍNH ĐƯỜNG DẪN ẢNH ──────────────────────────────────────────
  - variables:
      use_fixed_filename: !input use_fixed_filename
      fixed_filename: !input fixed_filename
      output_directory: !input output_directory
      filename_prefix: !input filename_prefix
      file_extension: !input file_extension
      delete_ai_image: !input delete_ai_image
      ai_image_delete_folder: !input ai_image_delete_folder
      ai_image_delete_age: !input ai_image_delete_age
      timestamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
      filename: >-
        {% if use_fixed_filename %}
          {{ fixed_filename }}.{{ file_extension }}
        {% else %}
          {{ filename_prefix }}{{ now().strftime('%Y%m%d_%H%M%S') }}.{{ file_extension }}
        {% endif %}
      final_image_path: >-
        {{ output_directory }}/{% if use_fixed_filename %}{{ fixed_filename }}.{{ file_extension }}{% else %}{{ filename_prefix }}{{ now().strftime('%Y%m%d_%H%M%S') }}.{{ file_extension }}{% endif %}

  # ── BƯỚC 2: BUILD PROMPT GEMINI ───────────────────────────────────────────
  - variables:
      image_style: !input image_style

      g_lighting: >-
        {% if 'rạng' in tp or 'dawn' in tp %}
          Pre-dawn blue hour before sunrise, the sky a deep cool blue brightening faintly at
          the eastern horizon, no sun yet, the last stars still overhead, cold soft shadowless
          light, muted blue tones, low-light exposure
        {% elif 'bình minh' in tp or 'sunrise' in tp %}
          Golden-hour sunrise, warm pink-orange sun low on the horizon, long soft golden shadows
          stretching across the land, the first direct warm light of the day
        {% elif 'sáng' in tp or 'morning' in tp %}
          Clear bright mid-morning daylight, a clean blue sky, medium-length shadows, fresh even
          natural light
        {% elif 'trưa' in tp or 'noon' in tp %}
          Harsh overhead noon sun, deep cobalt sky, very short hard-edged shadows directly beneath
          objects, full intense midday light
        {% elif 'xế' in tp or 'afternoon' in tp %}
          Strong angled mid-afternoon sun, the light beginning to warm, shadows lengthening and
          leaning, colours rich and clear
        {% elif 'hoàng hôn' in tp or 'sunset' in tp %}
          Golden-hour sunset, warm amber sun low in the west, long horizontal shadows, a glowing
          orange horizon melting up into deeper blue
        {% elif 'chạng' in tp or 'dusk' in tp %}
          Blue-hour twilight just after sunset with no direct sun left, sky graded from burnt orange
          at the horizon through violet to deep blue overhead, first stars appearing, only faint
          afterglow and the earliest lights on the ground, deep shadows, low-light exposure
        {% elif 'tối' in tp or 'evening' in tp %}
          Full evening after twilight, the sky dark blue to black with stars out, the landscape lit
          by warm lantern and window light and the last trace of glow at the horizon, deep shadows
          retained, long low-light exposure
        {% else %}
          Deep night with no sun and no daylight at all, the landscape lit only by a bright full moon
          casting cool silver-blue shadows, the Milky Way arcing overhead, warm lantern glow the only
          earthly light, black shadows retained, long-exposure night photography
        {% endif %}
      g_scene: >-
        {% if 'rạng' in tp or 'dawn' in tp %}
          {% set scenes = [
            'Bagan Myanmar, thousands of ancient brick temples emerging from thick dawn river mist, hot-air balloons just beginning to rise against the brightening blue sky',
            'Ha Long Bay Vietnam, hundreds of limestone karst towers rising from glass-calm emerald water wrapped in dawn mist, junk boats as dark silhouettes',
            'Angkor Wat Cambodia, the five temple towers a perfect black silhouette mirrored in the still lotus pond, the sky graded deep blue to faint pink before sunrise',
            'Trang An Ninh Binh Vietnam, jagged karst peaks rising from a winding river through flooded valleys, dense dawn mist pouring between the towers, sampan boats gliding',
            'Li River Guilin China, rounded karst peaks receding into layers of dawn mist, a lone fisherman on a bamboo raft with cormorants, the river a flat pale mirror',
            'Mount Bromo Indonesia, the smoking caldera seen from the high viewpoint above an endless sea of clouds, the first cold blue light touching distant peaks',
            'Sa Pa Vietnam, terraced rice valleys filled with a slow river of dawn cloud, black ridgelines of the Hoang Lien mountains floating above the mist',
            'Inle Lake Myanmar, Intha leg-rowing fishermen poised motionless on flat calm water in heavy dawn mist, distant stilt villages barely visible',
            'Zhangjiajie Hunan China, vertical sandstone pillars rising out of a deep sea of pre-dawn cloud, only the tallest columns catching the first cold light'
          ] %}
        {% elif 'bình minh' in tp or 'sunrise' in tp %}
          {% set scenes = [
            'Mu Cang Chai Vietnam, flooded terraced rice paddies cascading down mountains reflecting the pink-gold sunrise sky, thin mist in the valley folds, H\'Mong farmers beginning work',
            'Serengeti Tanzania, a lone flat-topped acacia silhouetted against a blazing orange sunrise, herds of wildebeest and zebra crossing the golden savanna',
            'Uluru Australia, the vast sacred sandstone monolith glowing deep fiery red as the first sun strikes it, the flat desert still in cool shadow',
            'Taj Mahal India, white marble turning warm gold and rose in the first sunlight, mirrored in the long reflecting pool, faint river mist behind',
            'Grand Canyon USA, first golden light spilling across the layered red buttes while the deep gorges stay in cool blue shadow, immense scale',
            'Cappadocia Turkey, hundreds of hot-air balloons rising into the golden sunrise above the fairy-chimney valleys, warm light raking the tufa',
            'Mount Fuji Japan, the snow-capped cone catching pink alpenglow, the Chureito pagoda and cherry blossoms in warm light in the foreground',
            'Jinshanling Great Wall China, the ancient wall snaking along golden ridgelines, low warm sun raking across the watchtowers and hills',
            'Bromo Tengger Indonesia, warm first light flooding across the volcanic sand sea to the smoking cone, long golden shadows from every ridge'
          ] %}
