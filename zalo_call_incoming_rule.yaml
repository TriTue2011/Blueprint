blueprint:
  name: Zalo Call - Quy tắc cho cuộc gọi đến (tự nghe máy, AI, báo ra loa)
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/zalo_call_incoming_rule.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: "**Phiên bản: v.2026.11.13**"
  input:
    ap_dung:
      name: ① Áp dụng cho ai
      icon: mdi:account-filter-outline
      input:
        bat_quy_tac:
          name: Bật quy tắc
          description: Tắt rồi chạy lại để xoá quy tắc này.
          selector:
            boolean: {}
          default: true
        pham_vi:
          name: Áp dụng cho
          selector:
            select:
              mode: dropdown
              options:
                - label: Một người hoặc một nhóm cụ thể (chọn ở ô bên dưới)
                  value: thread
                - label: Mọi người trong danh bạ (bạn bè)
                  value: contacts
                - label: Mọi người lạ (không có trong danh bạ)
                  value: strangers
                - label: Mọi nhóm
                  value: groups
          default: thread
        nguoi_cu_the:
          name: Những người hoặc nhóm cụ thể (chọn nhiều) (chỉ khi «Áp dụng cho» = Một người hoặc một nhóm cụ thể)
          description: Chỉ dùng khi chọn «Một người hoặc một nhóm cụ thể». Chọn từ danh sách Zalo Call, người và nhóm lẫn lộn đều được; mỗi người/nhóm được đặt một quy tắc giống nhau.
          selector:
            entity:
              multiple: true
              filter:
                - integration: zalo_call
                  domain: notify
          default: []
        them_theo_ma:
          name: Thêm người hoặc nhóm theo mã Zalo (threadID) (chỉ khi «Áp dụng cho» = Một người hoặc một nhóm cụ thể)
          description: Mỗi dòng một mã (chỉ gồm chữ số). Không cần cấu hình tích hợp. Mã là duy nhất nên không nhầm khi trùng tên. Xem mã ở *Công cụ nhà phát triển → Hành động → zalo_call.list_contacts* (hiện id và tên của bạn bè và nhóm). Dùng cùng ô chọn bên trên cũng được.
          selector:
            text:
              multiple: true
          default: []
        ten_goi:
          name: Tên gọi (để bạn nhớ)
          description: Cũng là tên đọc ra loa khi báo có cuộc gọi. Bỏ trống thì dùng tên Zalo của người gọi.
          selector:
            text: {}
          default: ""
    thiet_bi:
      name: "② Thiết bị trong nhà (loa, mic, camera: ưu tiên và khi nào dùng)"
      icon: mdi:video-wireless-outline
      description: "Mỗi thiết bị có hai ô: danh sách xếp theo ưu tiên (cái đầu hỏng thì dùng cái kế) và «khi nào dùng». Danh sách để trống thì dùng thiết bị mặc định của Zalo Call."
      collapsed: false
      input:
        loa:
          name: "Loa trong nhà (xếp theo thứ tự ưu tiên)"
          description: "Loa đầu tiên không dùng được thì tự chuyển sang loa kế tiếp. Để trống = loa mặc định của thiết bị Zalo Call. Loa Google Home/Cast chỉ đọc tiếng báo, không nhận tiếng cuộc gọi, nên để cuối danh sách."
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: media_player
          default: []
        che_do_loa:
          name: "Loa - khi nào dùng"
          description: "Phát tiếng người gọi ra loa trong nhà."
          selector:
            select:
              mode: dropdown
              multiple: false
              custom_value: false
              options:
                - label: Không dùng
                  value: tat
                - label: Bật khi người nhà nói trực tiếp
                  value: khi_noi
                - label: Bật NGAY khi nghe máy (không chờ người nhà)
                  value: ngay
          default: khi_noi
        mic:
          name: "Mic trong nhà (xếp theo thứ tự ưu tiên)"
          description: "Mic đầu tiên không dùng được thì tự chuyển sang mic kế tiếp. Chọn vệ tinh Assist (mic loa R1, mic camera) hoặc camera. Để trống = mic mặc định."
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain:
                    - camera
                    - assist_satellite
          default: []
        che_do_mic:
          name: "Mic - khi nào dùng"
          description: "Gửi tiếng trong nhà cho người gọi."
          selector:
            select:
              mode: dropdown
              multiple: false
              custom_value: false
              options:
                - label: Không dùng
                  value: tat
                - label: Bật khi người nhà nói trực tiếp
                  value: khi_noi
                - label: Bật NGAY khi nghe máy (không chờ người nhà)
                  value: ngay
          default: khi_noi
        camera:
          name: "Camera trong nhà (xếp theo thứ tự ưu tiên)"
          description: "Camera đầu tiên không có hình thì tự chuyển sang camera kế tiếp. Để trống = camera mặc định."
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: camera
          default: []
        che_do_camera:
          name: "Camera - khi nào dùng"
          description: "Gửi hình trong nhà cho người gọi (cuộc gọi video)."
          selector:
            select:
              mode: dropdown
              multiple: false
              custom_value: false
              options:
                - label: Không dùng
                  value: tat
                - label: Bật khi người nhà nói trực tiếp
                  value: khi_noi
                - label: Bật NGAY khi nghe máy (không chờ người nhà)
                  value: ngay
          default: khi_noi
        am_luong:
          name: Âm lượng loa (0 = giữ nguyên)
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
          default: 0
        ai_chon_thiet_bi:
          name: Cho AI tự quyết bật loa/mic/camera nào
          description: Chỉ trong các thiết bị đang để «Bật khi…» hoặc «Bật NGAY» ở trên.
          selector:
            boolean: {}
          default: false
        chong_vong:
          name: Chế độ mic/loa khi nói chuyện (song công chỉ áp dụng cho loa R1)
          selector:
            select:
              mode: dropdown
              options:
                - label: Tự quyết (khuyên dùng)
                  value: auto
                - label: Luân phiên - tạm tắt mic khi loa phát (êm tai, khuyên dùng với R1)
                  value: "on"
                - label: Song công - nghe và nói cùng lúc (chỉ loa R1; dễ chói nếu mic gần loa)
                  value: duplex
                - label: Tắt
                  value: "off"
          default: auto
    ai:
      name: ③ AI nói chuyện
      icon: mdi:robot-outline
      collapsed: true
      input:
        cho_ai_noi:
          name: Cho AI nói chuyện khi nghe máy
          selector:
            boolean: {}
          default: false
        tro_ly_giong_noi:
          name: Trợ lý giọng nói (Assist) (chỉ khi bật «Cho AI nói chuyện»)
          description: Bắt buộc khi cho AI nói chuyện. Chọn từ danh sách trợ lý giọng nói của Home Assistant.
          selector:
            assist_pipeline: {}
          default: ""
        nguoi_tin_cay:
          name: Người tin cậy (chỉ khi bật «Cho AI nói chuyện»)
          description: Tin cậy thì AI nói chuyện bình thường. Không tin cậy thì AI được dặn không tiết lộ thông tin gia đình.
          selector:
            boolean: {}
          default: false
        cau_chao:
          name: Câu AI chào khi nghe máy (chỉ khi bật «Cho AI nói chuyện»)
          description: Bỏ trống = «Xin chào, tôi là trợ lý của gia đình. Bạn cần gì ạ?»
          selector:
            text: {}
          default: ""
        ai_tra_loi_tin:
          name: AI trả lời cả tin nhắn chữ của người này (chỉ khi bật «Cho AI nói chuyện»)
          selector:
            boolean: {}
          default: false
    bao_loa:
      name: ④ Nghe máy và báo cuộc gọi đến
      icon: mdi:bullhorn-outline
      description: Một loa trong nhà đọc «Có cuộc gọi ... từ ...» để người trong nhà biết (kể cả khi không tự nghe máy).
      collapsed: true
      input:
        tu_nghe_may:
          name: Tự nghe máy
          selector:
            boolean: {}
          default: false
        nghe_sau:
          name: Nghe máy sau (giây) (chỉ khi bật «Tự nghe máy»)
          selector:
            number:
              min: 0
              max: 120
              step: 1
              unit_of_measurement: giây
          default: 5
        loai_cuoc_goi:
          name: Nghe loại cuộc gọi nào (chỉ khi bật «Tự nghe máy»)
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Thoại
                  value: voice
                - label: Video
                  value: video
          default:
            - voice
            - video
        bat_bao_loa:
          name: Báo ra loa
          selector:
            boolean: {}
          default: false
        loa_bao:
          name: Loa dùng để báo (chọn nhiều = báo ra tất cả các loa) (chỉ khi bật «Báo ra loa»)
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
          default: []
        am_luong_bao:
          name: Âm lượng lúc báo (0 = giữ nguyên) (chỉ khi bật «Báo ra loa»)
          description: Âm lượng loa khi đọc thông báo. Không ai nghe máy thì loa trở về mức cũ. Loa R1 có 15 mức, ví dụ mức 6 là 40%.
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
          default: 0
        lap_bao:
          name: Báo lại sau mỗi (giây) (chỉ khi bật «Báo ra loa»)
          description: Đọc xong thì chờ chừng này giây rồi đọc lại, tới khi nghe máy hoặc cuộc gọi kết thúc. 0 = chỉ báo một lần.
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: giây
          default: 0
        cau_bao:
          name: Câu báo (chỉ khi bật «Báo ra loa»)
          description: "Dùng {ten} (tên người gọi) và {loai} (thoại hoặc video). Bỏ trống = «Có cuộc gọi {loai} từ {ten}.»"
          selector:
            text: {}
          default: ""
    xin_video:
      name: ⑤ Chuyển từ thoại sang video
      icon: mdi:video-outline
      collapsed: true
      input:
        xu_ly_xin_video:
          name: Cách xử lý
          description: >-
            Mặc định không tự đồng ý. Chọn «Tự đồng ý» thì người này được tự đồng ý **khi công tắc tổng «Cho phép đồng ý chuyển sang video»
            trên thiết bị Zalo Call đang BẬT** (mặc định TẮT; xem ô bên dưới). Muốn hỏi trên điện thoại thì dùng blueprint «Người gọi xin chuyển
            từ thoại sang video». Áp cho cả cuộc gọi đến lẫn cuộc gọi đi với người này.
          selector:
            select:
              mode: dropdown
              options:
                - label: Không tự đồng ý (chỉ báo cho automation)
                  value: ask
                - label: Tự đồng ý, KHÔNG gửi hình trong nhà
                  value: accept
                - label: Tự đồng ý và gửi camera đã chọn ở trên
                  value: accept_camera
          default: ask
        bat_cong_tac_chuyen_video:
          name: "Bật công tắc tổng «Cho phép đồng ý chuyển sang video» (chỉ khi «Cách xử lý» là Tự đồng ý)"
          description: >-
            Tự đồng ý chỉ xảy ra khi công tắc tổng này BẬT (mặc định TẮT, nằm trên thiết bị Zalo Call). Tích ô này thì mỗi lần Home Assistant khởi
            động (hoặc bạn bấm *Chạy*) quy tắc sẽ BẬT công tắc đó, chỉ khi bạn chọn «Tự đồng ý» ở trên. Không tích thì blueprint không đụng tới
            công tắc: bạn tự bật/tắt trên thiết bị.
          default: false
          selector:
            boolean:

mode: restart

variables:
  version: 20261113
  bat_quy_tac: !input bat_quy_tac
  pham_vi: !input pham_vi
  nguoi_cu_the: !input nguoi_cu_the
  them_theo_ma: !input them_theo_ma
  ten_goi: !input ten_goi
  tu_nghe_may: !input tu_nghe_may
  nghe_sau: !input nghe_sau
  loai_cuoc_goi: !input loai_cuoc_goi
  bat_bao_loa: !input bat_bao_loa
  loa_bao_goc: !input loa_bao
  loa_bao: >-
    {{ (loa_bao_goc if loa_bao_goc is not string else ([loa_bao_goc] if loa_bao_goc else [])) | join(',') }}
  cau_bao: !input cau_bao
  lap_bao: !input lap_bao
  am_luong_bao: !input am_luong_bao
  cho_ai_noi: !input cho_ai_noi
  tro_ly_giong_noi: !input tro_ly_giong_noi
  nguoi_tin_cay: !input nguoi_tin_cay
  cau_chao: !input cau_chao
  ai_tra_loi_tin: !input ai_tra_loi_tin
  che_do_loa: !input che_do_loa
  che_do_mic: !input che_do_mic
  che_do_camera: !input che_do_camera
  ai_chon_thiet_bi: !input ai_chon_thiet_bi
  noi_khi_chuyen: >-
    {% set l = [] %}
    {% if che_do_mic != 'tat' %}{% set l = l + ['mic'] %}{% endif %}
    {% if che_do_loa != 'tat' %}{% set l = l + ['speaker'] %}{% endif %}
    {% if che_do_camera != 'tat' %}{% set l = l + ['camera'] %}{% endif %}
    {% if ai_chon_thiet_bi %}{% set l = l + ['ai'] %}{% endif %}
    {{ l }}
  noi_ngay: >-
    {% set l = [] %}
    {% if che_do_mic == 'ngay' %}{% set l = l + ['mic'] %}{% endif %}
    {% if che_do_loa == 'ngay' %}{% set l = l + ['speaker'] %}{% endif %}
    {% if che_do_camera == 'ngay' %}{% set l = l + ['camera'] %}{% endif %}
    {{ l }}
  loa_goc: !input loa
  loa: >-
    {{ (loa_goc if loa_goc is not string else ([loa_goc] if loa_goc else [])) | join(',') }}
  mic_goc: !input mic
  mic: >-
    {{ (mic_goc if mic_goc is not string else ([mic_goc] if mic_goc else [])) | join(',') }}
  camera_goc: !input camera
  camera: >-
    {{ (camera_goc if camera_goc is not string else ([camera_goc] if camera_goc else [])) | join(',') }}
  am_luong: !input am_luong
  chong_vong: !input chong_vong
  xu_ly_xin_video: !input xu_ly_xin_video
  bat_cong_tac_chuyen_video: !input bat_cong_tac_chuyen_video

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded

actions:
  - alias: Gom mã Zalo của những người được chọn
    variables:
      ds_thread: >-
        {% set ns = namespace(l=[], sai=[]) %}
        {% for e in nguoi_cu_the %}{% set ns.l = ns.l + [state_attr(e, 'thread_id') | string] %}{% endfor %}
        {% for ma in them_theo_ma %}
          {% set m = ma | string | trim %}
          {% if m is match('^[0-9]+$') %}{% set ns.l = ns.l + [m] %}{% else %}{% set ns.sai = ns.sai + [m] %}{% endif %}
        {% endfor %}
        {{ {'ids': ns.l | unique | list, 'sai': ns.sai} }}
      muc_tieu: "{{ ds_thread.ids if pham_vi == 'thread' else [''] }}"
  - alias: Ghi cảnh báo nếu có mã không hợp lệ
    if:
      - condition: template
        value_template: "{{ pham_vi == 'thread' and ds_thread.sai | count > 0 }}"
    then:
      - action: system_log.write
        data:
          level: warning
          logger: zalo_call.blueprint
          message: "Quy tắc cuộc gọi đến: mã Zalo không hợp lệ (chỉ gồm chữ số): {{ ds_thread.sai | join(', ') }}"
  - repeat:
      for_each: "{{ muc_tieu }}"
      sequence:
        - choose:
            - alias: Xoá quy tắc
              conditions:
                - condition: template
                  value_template: "{{ not bat_quy_tac }}"
              sequence:
                - action: zalo_call.remove_rule
                  data: >-
                    {% set d = {'scope': pham_vi} %}
                    {% if pham_vi == 'thread' %}{% set d = dict(d, thread_id=repeat.item | string) %}{% endif %}
                    {{ d }}
          default:
            - alias: Xoá quy tắc cũ của mục tiêu (đặt lại từ đầu, không giữ trường cũ nào)
              action: zalo_call.remove_rule
              data: >-
                {% set d = {'scope': pham_vi} %}
                {% if pham_vi == 'thread' %}{% set d = dict(d, thread_id=repeat.item | string) %}{% endif %}
                {{ d }}
            - action: zalo_call.set_rule
              data: >-
                {% set d = {'scope': pham_vi, 'answer': tu_nghe_may, 'answer_delay': nghe_sau | int(5),
                            'call_types': loai_cuoc_goi, 'ai': cho_ai_noi, 'trusted': nguoi_tin_cay,
                            'reply_ai': ai_tra_loi_tin and cho_ai_noi, 'announce': bat_bao_loa and loa_bao | default('', true) != '',
                            'connect': noi_khi_chuyen, 'connect_now': noi_ngay,
                            'echo_guard': chong_vong, 'video_request': xu_ly_xin_video, 'announce_repeat': lap_bao | int(0), 'announce_volume': am_luong_bao | int(0)} %}
                {% if pham_vi == 'thread' %}{% set d = dict(d, thread_id=repeat.item | string) %}{% endif %}
                {% if ten_goi | trim != '' %}{% set d = dict(d, name=ten_goi | trim) %}{% endif %}
                {% if cho_ai_noi and tro_ly_giong_noi %}{% set d = dict(d, pipeline=tro_ly_giong_noi) %}{% endif %}
                {% if cau_chao | trim != '' %}{% set d = dict(d, greeting=cau_chao | trim) %}{% endif %}
                {% if bat_bao_loa and loa_bao %}{% set d = dict(d, announce_to=loa_bao) %}{% endif %}
                {% if cau_bao | trim != '' %}{% set d = dict(d, announce_text=cau_bao | trim) %}{% endif %}
                {% if loa %}{% set d = dict(d, speaker=loa) %}{% endif %}
                {% if mic %}{% set d = dict(d, mic=mic) %}{% endif %}
                {% if camera %}{% set d = dict(d, camera=camera) %}{% endif %}
                {% if am_luong | int(0) > 0 %}{% set d = dict(d, volume=am_luong | int) %}{% endif %}
                {{ d }}
  - alias: Bật công tắc tổng cho phép đồng ý chuyển sang video
    if:
      - condition: template
        value_template: "{{ bat_quy_tac and bat_cong_tac_chuyen_video and xu_ly_xin_video != 'ask' }}"
    then:
      - action: zalo_call.set_default_devices
        data:
          video_consent: true
  - alias: Báo cho bạn biết quy tắc đã được đặt (xem ở chuông thông báo)
    action: persistent_notification.create
    data:
      notification_id: "zalo_call_quy_tac_{{ this.entity_id }}"
      title: "Zalo Call: {{ 'ĐÃ ĐẶT' if bat_quy_tac else 'ĐÃ XOÁ' }} quy tắc cuộc gọi đến"
      message: |-
        {% set ten = {'thread': 'người/nhóm: ' ~ (ds_thread.ids | join(', ')), 'contacts': 'MỌI NGƯỜI trong danh bạ', 'strangers': 'mọi người lạ', 'groups': 'mọi nhóm'}[pham_vi] %}
        Áp dụng cho: {{ ten }}{{ ' (' ~ ten_goi ~ ')' if ten_goi | trim != '' else '' }}
        {% if bat_quy_tac %}
        Tự nghe máy: {{ ('có, sau ' ~ nghe_sau ~ ' giây') if tu_nghe_may else 'không' }}
        Báo ra loa: {{ loa_bao if (bat_bao_loa and loa_bao) else 'không' }}
        AI nói chuyện: {{ 'có' if cho_ai_noi else 'không' }}
        Loa: {{ loa or 'mặc định' }} | Mic: {{ mic or 'mặc định' }} | Camera: {{ camera or 'mặc định' }}
        Nối ngay khi nghe máy: {{ noi_ngay | join(', ') or 'không' }}
        Nối khi người nhà nói: {{ noi_khi_chuyen | join(', ') or 'không' }}
