blueprint:
  name: Cảnh báo camera AI 4
  author: TriTue2011
  homeassistant:
    min_version: 2026.3.0
  description: >
    Phân tích sự kiện camera bằng AI Task. Có cửa lọc một ảnh để loại báo động ảo,
    hai nhánh ảnh và video chạy song song, và ba đường gửi riêng cho ảnh, video,
    kết quả phân tích. Gửi qua điện thoại, Telegram, Zalo và TTS ra loa.

    <details>
    <summary><b>Chi tiết:</b> - Nhấn để mở rộng</summary>

      **Phiên bản: v.2026.08.19**

      **Khác gì bản 3:**

        1- **Xác nhận sau trigger thành một ô chọn.** Bản 3 có hai công tắc rời
        (Trigger Confirmation và Wait for Person) bật cùng lúc được, chạy nối
        đuôi nhau. Bản này gộp thành một ô chọn ba giá trị nên chỉ một đường
        chạy, hoặc không đường nào.

        2- **Cửa lọc một ảnh.** Chụp một ảnh hỏi AI đúng một câu có người hay
        không rồi mới quyết định làm tiếp. Prompt lọc viết cực ngắn để chạy
        nhanh trên model tại nhà. Đặt số ảnh đợt 1 từ 2 trở lên là tắt cửa lọc
        và dùng luôn bộ ảnh đó để phân tích.

        3- **Nhánh video.** Quay video kèm lookback, chọn được camera riêng,
        thời lượng riêng. Bật cùng lúc với nhánh ảnh được.

        4- **Ba đường gửi cho từng thứ.** Ảnh, video và kết quả phân tích mỗi
        thứ có ô riêng: gửi mọi lượt, chỉ khi có người, hoặc chỉ khi mất an
        ninh. Kết quả phân tích không đi một mình — nó chỉ kèm theo khi ảnh
        hoặc video đã được gửi.

        5- **Prompt viết lại cho model nhỏ.** Nói rõ các ảnh là khung liên tiếp
        của cùng một cảnh và cùng một người xuất hiện lại ở khung sau không
        phải người mới. Model được hỏi thêm khung nào rõ nhất, để blueprint
        chọn đúng ảnh đó khi bạn chỉ muốn gửi một tấm.

      **Chạy được với:** Google Gemini, OpenAI, Ollama, và mọi AI Task provider
      khác trong Home Assistant. Nhánh video chỉ phân tích được bằng provider
      đọc được tệp mp4 (Gemini); model chạy tại nhà thì để video ở chế độ chỉ
      gửi kèm.

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu cấu hình:</b> - Nhấn để mở rộng</summary>

      **Thêm vào `configuration.yaml` để HA nhận diện đúng thư mục media:**

      ```yaml
      homeassistant:
        media_dirs:
          local: /media
      ```

      ⚠️ Thiếu dòng này thì AI Task và thông báo điện thoại không đọc được ảnh.

    </details>

  domain: automation
  source_url: https://raw.githubusercontent.com/TriTue2011/Blueprint/main/alarm_person_camera_4.yaml

  input:

    # ============================================================
    # TRIGGER
    # ============================================================
    trigger_section:
      name: 1 · Cảm biến kích hoạt
      icon: mdi:play-circle
      collapsed: true
      input:
        trigger_sensor:
          name: 🚶 Cảm biến kích hoạt
          description: |
            👉 Cảm biến làm automation chạy (cửa, chuyển động).
            ✅ Chọn được nhiều cảm biến cùng lúc.
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: true

        trigger_from_state:
          name: 🔄 Từ trạng thái
          description: Trạng thái trước khi kích hoạt.
          default: "off"
          selector:
            select:
              options: ["off", "on"]
              custom_value: true
              multiple: false

        trigger_to_state:
          name: 🔄 Sang trạng thái
          description: Trạng thái làm automation chạy.
          default: "on"
          selector:
            select:
              options: ["on", "off"]
              custom_value: true
              multiple: false

    # ============================================================
    # XÁC NHẬN SAU TRIGGER — MỘT Ô CHỌN, KHÔNG PHẢI HAI CÔNG TẮC
    # ============================================================
    confirm_section:
      name: 2 · Xác nhận sau khi kích hoạt
      icon: mdi:check-decagram
      collapsed: true
      input:
        che_do_xac_nhan:
          name: ✅ Cách xác nhận
          description: |
            👉 Chọn MỘT cách xác nhận trước khi tốn công chụp ảnh.
            ✅ Không xác nhận: chạy thẳng, nhanh nhất.
            ✅ Chờ rồi kiểm lại: lọc được cảm biến rung, chớp nhanh, chuyển động thoáng qua.
            ✅ Theo dõi cảm biến khác: chờ một cảm biến khác báo có người, hợp với mmWave.
            ⚠️ Hai cách sau loại trừ nhau, không chạy cùng lúc được.
          default: khong
          selector:
            select:
              options:
                - label: Không xác nhận, chạy thẳng
                  value: khong
                - label: Chờ một lúc rồi kiểm lại chính cảm biến đó
                  value: kiem_lai
                - label: Theo dõi một cảm biến khác
                  value: cam_bien_khac
              multiple: false

        danh_thuc_som:
          name: 🔑 Đánh thức model ngay khi cảm biến kêu
          description: |
            👉 BẬT: gửi một lời gọi rỗng cho AI ngay lúc kích hoạt, để model nạp lên GPU trong lúc
            blueprint còn đang xác nhận và chụp ảnh. Giống hệt Idling Stop trên xe tay ga — vặn ga
            là nổ lại, không đợi tới lúc cần mới khởi động.
            ⚠️ Chỉ có ích khi model đặt chế độ ngủ khi rảnh. Đo trên máy tại nhà: model ngủ rồi gọi
            mất 11,8 giây, model đang thức chỉ mất 1,0 giây. Bật ô này thì phần lớn 11 giây đó
            trôi qua trong lúc bạn còn đang chờ xác nhận, nên không cảm thấy.
            👉 TẮT nếu model của bạn luôn thức, hoặc dùng dịch vụ ngoài mạng tính tiền theo lượt gọi.
          default: true
          selector:
            boolean: {}

        thoi_gian_kiem_lai:
          name: ⏱️ Chờ bao lâu rồi kiểm lại
          description: |
            👉 Số giây chờ trước khi kiểm tra lại cảm biến và toàn bộ Điều kiện chạy.
            ⚠️ Chỉ dùng khi chọn cách "Chờ một lúc rồi kiểm lại".
            ✅ 0 giây nghĩa là kiểm lại ngay.
          default: 3
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: seconds
              mode: box

        cam_bien_nguoi:
          name: 🧍 Cảm biến khác để theo dõi
          description: |
            👉 Cảm biến phát hiện người, ví dụ mmWave hoặc vùng PIR.
            ⚠️ Chỉ dùng khi chọn cách "Theo dõi một cảm biến khác".
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: false

        trang_thai_co_nguoi:
          name: 🔎 Trạng thái nghĩa là có người
          description: Trạng thái của cảm biến đó khi thấy người.
          default: "on"
          selector:
            select:
              options: ["on", "off"]
              custom_value: true
              multiple: false

        cho_toi_da:
          name: ⌛ Chờ cảm biến khác tối đa
          description: |
            👉 Số giây chờ tối đa. Hết giờ mà cảm biến chưa báo thì vẫn chạy tiếp.
            ⚠️ Đặt 0 là chờ không giới hạn — automation sẽ nằm chờ cho tới khi có người.
          default: 30
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
              mode: box
              step: 1

    # ============================================================
    # ĐIỀU KIỆN CHẠY
    # ============================================================
    run_conditions:
      name: 🛠️ Điều kiện chạy
      description: |
        👉 Điều kiện phải đúng thì automation mới chạy.
        ⚠️ Cách xác nhận "Chờ rồi kiểm lại" sẽ kiểm tra lại toàn bộ các điều kiện này lần nữa.
      default: []
      selector:
        condition: {}

    cooldown:
      name: ⏱️ Nghỉ giữa hai lần chạy
      description: |
        👉 Chạy xong thì nghỉ bao lâu mới cho chạy lại.
        ✅ Tránh dội thông báo khi cảm biến kêu liên tục.
      default:
        minutes: 10
      selector:
        duration: {}

    # ============================================================
    # CỬA LỌC — ĐỢT ẢNH ĐẦU TIÊN
    # ============================================================
    loc_section:
      name: 3 · Cửa lọc một ảnh
      icon: mdi:filter-check
      collapsed: true
      input:
        bat_cua_loc:
          name: ✅ Bật cửa lọc
          description: |
            👉 BẬT: chụp MỘT ảnh bằng camera phân tích rồi hỏi AI đúng một câu có người hay không.
            Không có ai thì dừng, khỏi tốn công chụp tiếp, quay video và phân tích.
            👉 TẮT: chạy thẳng xuống chụp ảnh và phân tích.
            ✅ Đây là chỗ tiết kiệm nhiều nhất khi cảm biến hay báo động ảo.
          default: true
          selector:
            boolean: {}

        cho_truoc_khi_chup:
          name: ⌛ Chờ trước khi chụp tấm đầu
          description: |
            👉 Số giây chờ sau khi kích hoạt rồi mới chụp.
            ✅ Cho người kịp bước vào khung hình, và cho camera kịp lấy nét.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

        ghi_de_anh:
          name: 🏞️ Ghi đè ảnh cũ
          description: |
            👉 BẬT để ảnh mới ghi đè ảnh cũ, tiết kiệm ổ đĩa.
            ⚠️ TẮT thì mỗi lần chạy lưu một bộ ảnh riêng, đầy ổ rất nhanh.
            ✅ Ảnh luôn nằm trong /media/snapshots/.
          default: true
          selector:
            boolean: {}
    # ============================================================
    # NHÁNH ẢNH — ĐỢT 2
    # ============================================================
    anh_section:
      name: 4 · Nhánh ảnh
      icon: mdi:camera-burst
      collapsed: true
      input:
        bat_nhanh_anh:
          name: ✅ Bật nhánh ảnh
          description: |
            👉 BẬT để chụp một đợt ảnh sau khi cửa lọc thấy có người.
            ⚠️ Tắt cả nhánh ảnh lẫn nhánh video thì automation không có gì để gửi.
          default: true
          selector:
            boolean: {}

        camera_phan_tich:
          name: 🔍 Camera cho AI đọc
          description: |
            👉 Camera chụp những tấm ĐƯA VÀO AI, và cũng là camera dùng cho cửa lọc.
            ✅ Nên chọn luồng phụ, thường có đuôi -sub. Đo trên máy thật: ba ảnh luồng chính tốn
            8425 token và 20,7 giây, cùng cảnh đó ba ảnh luồng phụ chỉ tốn 925 token và 4,3 giây,
            mà AI nhận ra đúng từng ấy người với mô tả như nhau.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera

        camera_gui:
          name: 🖼️ Camera cho ảnh gửi đi
          description: |
            👉 Camera chụp những tấm GỬI CHO BẠN XEM.
            ✅ Chọn luồng chính ở đây để ảnh nhận được thật nét, trong khi AI vẫn đọc bản nhẹ.
            ✅ Bỏ trống là dùng lại camera ở trên, khi đó mỗi lần chỉ chụp một tấm.
            ⚠️ Hai tấm của mỗi nhịp được bấm CÙNG LÚC chứ không nối tiếp, nên tấm AI chấm là
            rõ nhất luôn khớp đúng khoảnh khắc với tấm nét gửi cho bạn.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera

        so_anh:
          name: ⌛ Số ảnh
          description: |
            👉 Chụp mấy tấm liên tiếp để AI so sánh.
            ✅ Ba tấm là đủ thấy người đó đang đi vào hay đi ra.
          default: 3
          selector:
            number:
              min: 1
              max: 5
              step: 1
              unit_of_measurement: ảnh
              mode: slider

        gian_cach_anh:
          name: ⌛ Giãn cách giữa các ảnh
          description: |
            👉 Số giây giữa hai tấm.
            ⚠️ Quá ngắn thì ba tấm gần như giống hệt nhau, AI không thấy được chuyển động.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

        anh_gui_khi:
          name: 📤 Gửi ảnh khi nào
          description: |
            👉 Gửi mọi lượt: ảnh đi ngay sau khi chụp, không đợi AI. Nhanh nhất.
            👉 Chỉ khi có người: đợi AI xong, có người mới gửi.
            👉 Chỉ khi mất an ninh: đợi AI xong, đáng ngờ mới gửi.
            ⚠️ Đường mất an ninh cần chế độ phân tích An ninh. Chọn chế độ khác thì blueprint
            tự hạ xuống thành "chỉ khi có người" và ghi một dòng vào nhật ký cho bạn biết.
          default: ngay
          selector:
            select:
              options:
                - label: Gửi mọi lượt, không đợi AI
                  value: ngay
                - label: Chỉ khi có người
                  value: co_nguoi
                - label: Chỉ khi mất an ninh
                  value: an_ninh
              multiple: false

        anh_gui_may_tam:
          name: 🖼️ Gửi mấy tấm
          description: |
            👉 Một tấm: gửi tấm mà AI nói là thấy rõ nhất. Nếu gửi ngay không đợi AI thì lấy tấm đầu.
            👉 Tất cả: gửi hết cả đợt.
            ⚠️ Mỗi kênh có trần riêng — Telegram gộp tối đa 10 ảnh một chùm, Zalo cá nhân 50 ảnh,
            còn Zalo Bot và thông báo điện thoại thì mỗi ảnh là một tin riêng.
          default: mot
          selector:
            select:
              options:
                - label: Một tấm, chọn tấm rõ nhất
                  value: mot
                - label: Tất cả ảnh đã chụp
                  value: tat_ca
              multiple: false

    # ============================================================
    # NHÁNH VIDEO
    # ============================================================
    video_section:
      name: 5 · Nhánh video
      icon: mdi:video
      collapsed: true
      input:
        bat_nhanh_video:
          name: ✅ Bật nhánh video
          description: |
            👉 BẬT để quay một đoạn video song song với nhánh ảnh.
            ✅ Bật cả hai nhánh thì ảnh tới trước cho bạn xem ngay, video tới sau.
            ⚠️ Camera phải có luồng chạy được (tích hợp stream), nếu không thì việc quay sẽ hỏng.
          default: false
          selector:
            boolean: {}

        camera_video:
          name: 🎥 Camera quay video
          description: |
            👉 Camera dùng để quay.
            ✅ Bỏ trống là dùng lại camera của nhánh ảnh.
            ✅ Chọn luồng chính cho video xem lại cho rõ, hoặc luồng phụ cho tệp nhẹ gửi nhanh.
          default: []
          selector:
            entity:
              multiple: false
              filter:
                - domain: camera

        thoi_luong_video:
          name: ⏱️ Quay bao nhiêu giây
          description: |
            👉 Độ dài đoạn quay.
            ⚠️ Home Assistant coi con số này là ước lượng, độ dài thật xê dịch đôi chút nhưng
            xê dịch đều nhau ở cùng một camera.
          default: 10
          selector:
            number:
              min: 3
              max: 60
              step: 1
              unit_of_measurement: seconds
              mode: slider

        lay_truoc_video:
          name: ⏪ Lấy thêm mấy giây TRƯỚC lúc kích hoạt
          description: |
            👉 Home Assistant giữ sẵn một đoạn đệm của luồng đang chạy, nên lấy ngược lại được
            cả khoảnh khắc trước khi cảm biến kêu.
            ✅ Đây là cách duy nhất thấy được người ta lúc mới bước vào khung hình.
            ⚠️ Chỉ chạy khi camera đang có luồng HLS hoạt động. Đặt 0 để tắt.
          default: 5
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: seconds
              mode: slider

        video_gui_khi:
          name: 📤 Gửi video khi nào
          description: |
            👉 Ba đường giống hệt nhánh ảnh, nhưng đặt riêng.
            ✅ Kiểu dùng hay gặp: ảnh gửi mọi lượt cho nhanh, video chỉ gửi khi thật sự đáng ngờ.
            ⚠️ Video luôn tới sau ảnh vì phải quay xong mới gửi được.
          default: an_ninh
          selector:
            select:
              options:
                - label: Gửi mọi lượt, không đợi AI
                  value: ngay
                - label: Chỉ khi có người
                  value: co_nguoi
                - label: Chỉ khi mất an ninh
                  value: an_ninh
              multiple: false

        nguon_phan_tich:
          name: 🧠 AI phân tích cái gì
          description: |
            👉 Chỉ ảnh: AI đọc chuỗi ảnh. Nhanh nhất, chạy với mọi provider kể cả model tại nhà.
            👉 Chỉ video: AI đọc đoạn phim, thấy được chuyển động liên tục thay vì vài khoảnh khắc rời.
            👉 Cả hai: gửi ảnh lẫn video trong cùng một lời gọi, AI có đủ cả nét lẫn diễn tiến.
            ⚠️ Hai lựa chọn có video CHỈ chạy với provider đọc được tệp mp4, hiện là Google Gemini.
            Tích hợp Local OpenAI từ chối thẳng tệp video (lỗi unsupported_attachment_type), nên
            model chạy tại nhà phải để ở "Chỉ ảnh".
            ⚠️ Video ăn token gấp nhiều lần ảnh: đo trên máy tại nhà, ba ảnh luồng phụ tốn 978 token
            còn mười giây video tốn 7 025 token.
            ✅ Chọn video mà quên bật nhánh video thì blueprint tự quay về chỉ ảnh và ghi một dòng
            vào nhật ký.
          default: anh
          selector:
            select:
              options:
                - label: 📸 Chỉ ảnh
                  value: anh
                - label: 🎥 Chỉ video
                  value: video
                - label: 📸🎥 Cả hai, trong cùng một lời gọi
                  value: ca_hai
              multiple: false

    # ============================================================
    # PHÂN TÍCH AI
    # ============================================================
    ai_section:
      name: 6 · Phân tích AI
      icon: mdi:brain
      collapsed: true
      input:
        bat_ai:
          name: ✅ Bật phân tích AI
          description: |
            👉 TẮT thì automation gửi ảnh ngay khi có chuyển động, không phân tích gì cả.
            ⚠️ Tắt AI thì ba đường "chỉ khi có người" và "chỉ khi mất an ninh" mất chỗ dựa,
            nên mọi thứ đều gửi như đường "gửi mọi lượt".
          default: true
          selector:
            boolean: {}

        che_do_ket_qua:
          name: 🤖 Kiểu kết quả
          description: |
            ✅ Có cấu trúc: dùng đường sẵn có của Home Assistant, chắc chắn hơn. Nên chọn cái này.
            ✅ JSON: dành cho provider chỉ trả về chữ thô. Blueprint tự bóc dấu ```json và tự đọc.
          default: co_cau_truc
          selector:
            select:
              options:
                - label: Có cấu trúc (Home Assistant lo, khuyến nghị)
                  value: co_cau_truc
                - label: JSON thô
                  value: json
              multiple: false

        doi_tuong:
          name: 🔍 Phân tích cái gì
          description: |
            ✅ Chỉ người: đếm và tả người.
            ✅ Chỉ động vật: đếm và tả chó, mèo, chim.
            ✅ Cả hai: tả cả người lẫn động vật.
            ✅ An ninh: đếm người, tả hành động, và chấm một câu có đáng ngờ hay không.
            ⚠️ Chỉ chế độ An ninh mới mở khoá được các đường gửi "chỉ khi mất an ninh".
          default: humans
          selector:
            select:
              options:
                - label: 👤 Chỉ người
                  value: humans
                - label: 🐾 Chỉ động vật
                  value: animals
                - label: 👤🐾 Cả người và động vật
                  value: both
                - label: 🛡️ An ninh
                  value: security
              multiple: false

        ai_provider:
          name: 🤖 AI Task dùng để phân tích
          description: |
            👉 Chọn thực thể AI Task lo phần phân tích đầy đủ.
            ✅ Bỏ trống để dùng cái mặc định của hệ thống.
          default: []
          selector:
            entity:
              domain: ai_task
              multiple: false

        ai_provider_loc:
          name: ⚡ AI Task dùng cho cửa lọc
          description: |
            👉 Cửa lọc chỉ hỏi đúng một câu nên nên giao cho model nhỏ và nhanh, kể cả khi phần
            phân tích đầy đủ bạn giao cho model lớn ngoài mạng.
            ✅ Bỏ trống là dùng chung cái ở trên.
          default: []
          selector:
            entity:
              domain: ai_task
              multiple: false

        ai_provider_video:
          name: 🎬 AI Task dùng khi có video
          description: |
            👉 Chỉ dùng khi ô "AI phân tích cái gì" có chọn video.
            ✅ Đây là chỗ khai provider đám mây đọc được mp4, trong khi phần còn lại vẫn chạy model
            tại nhà.
            ✅ Bỏ trống là dùng chung ô AI Task ở trên.
          default: []
          selector:
            entity:
              domain: ai_task
              multiple: false

        phan_tich_gui_khi:
          name: 📤 Gửi kết quả phân tích khi nào
          description: |
            👉 Đi kèm: gửi bất cứ khi nào ảnh hoặc video được gửi.
            👉 Chỉ khi có người: có người mới gửi phần chữ.
            👉 Chỉ khi mất an ninh: đáng ngờ mới gửi phần chữ.
            ⚠️ Kết quả phân tích không bao giờ đi một mình. Nếu lượt đó không gửi ảnh lẫn video
            thì cũng không gửi chữ, dù bạn chọn "Đi kèm".
          default: di_kem
          selector:
            select:
              options:
                - label: Đi kèm, cứ có ảnh hoặc video là gửi
                  value: di_kem
                - label: Chỉ khi có người
                  value: co_nguoi
                - label: Chỉ khi mất an ninh
                  value: an_ninh
              multiple: false
