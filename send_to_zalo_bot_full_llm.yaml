blueprint:
  name: Voice - Send to Zalo (Ultimate)
  author: TriTue2011 nguồn luuquangvu
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/send_to_zalo_bot_full_llm.yaml
  description: |-
    Công cụ gửi nội dung qua Zalo cho Voice Assistant.
    Hỗ trợ gửi thông tin, vị trí, hình ảnh.
    Tự động chuyển đổi đường dẫn local và xóa ảnh tạm sau khi gửi.
  domain: script

  homeassistant:
    min_version: 2024.10.0

  input:
    zalo_settings:
      name: Settings for Zalo
      icon: mdi:alpha-z-circle-outline
      input:
        chat_id:
          name: Chat ID
          selector:
            text:
        delete_after_send:
          name: Delete Image After Sending
          description: Only deletes snapshot/tmp images
          selector:
            boolean: {}
          default: true
        delete_delay:
          name: Delete Delay (seconds)
          selector:
            number:
              min: 0
              max: 30
              step: 1
          default: 5

    duong_gui_anh_settings:
      name: Đường gửi ảnh
      icon: mdi:image-move
      description: >-
        Zalo Bot chỉ nhận ảnh qua **URL công khai** — nó tự đi tải về, nên đường
        dẫn trong mạng LAN không dùng được. Mặc định blueprint chép ảnh vào
        `/config/www/zalo` rồi đưa URL đó cho Zalo, tức **Home Assistant phải mở
        ra Internet**.


        Ai đang chạy `zalo-server` (dự án chatgpt2api) thì chọn đường khác: đẩy
        thẳng tệp lên server, server lưu vào kho ảnh công khai của nó rồi mới gọi
        Zalo. Home Assistant **không cần mở ra Internet**, và server còn tự
        chuyển ảnh không phải PNG sang PNG — Zalo trả sai content-type nếu byte
        JPEG nằm trong tệp `.png`.


        Chọn đường server thì phải khai trước một `shell_command` trong
        `configuration.yaml`, rồi trỏ ô dưới vào nó:


        ```

        shell_command:
          zalo_gui_anh: >
            curl -s -m 30 -X POST http://172.16.10.38:3030/api/zalo-bot/send
            -H "authorization: Bearer {{ token }}"
            -F "text={{ text }}"
            -F "photo=@{{ duong_dan }}"
        ```
      collapsed: true
      input:
        hanh_dong_gui_anh:
          name: Hành động gửi ảnh
          description: >-
            Để trống = dùng pyscript như cũ (cần Home Assistant mở ra Internet).
            Muốn đi qua zalo-server thì đặt vào đây lời gọi `shell_command` đã
            khai, truyền `duong_dan` là đường dẫn ảnh và `text` là chú thích.
          selector:
            action:
          default: []
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      collapsed: true
      input:
        summary_prompt:
          name: Summary Prompt
          selector:
            text:
              multiline: true
          default: |-
            <=10 words overview/caption. Plain text. Multiple items = multiple calls

        detail_prompt:
          name: Detail Prompt
          selector:
            text:
              multiline: true
          default: |-
            Full details. No links/markdown/emojis/repeats. Plain text

        content_type_prompt:
          name: Content Type Prompt
          selector:
            text:
              multiline: true
          default: |-
            Exactly one: information, location, image. location=place/address/map, image=visual media

        location_prompt:
          name: Location Prompt
          selector:
            text:
              multiline: true
          default: |-
            Address only. No commas or punctuation

        image_path_prompt:
          name: Image Path Prompt
          selector:
            text:
              multiline: true
          default: |-
            Existing path (local/, /media/). No guessing

        chat_id_override_prompt:
          name: Chat ID Override Prompt
          selector:
            text:
              multiline: true
          default: |-
            Alternate chat ID. Digits only

mode: queued
max: 30
max_exceeded: silent
description: Sends messages, locations, or images to Zalo through the official Zalo Bot

variables:
  version: 20260823
  hanh_dong_gui_anh: !input hanh_dong_gui_anh

fields:
  summary:
    name: Summary
    description: !input summary_prompt
    selector:
      text:
    required: true

  detail:
    name: Detail
    description: !input detail_prompt
    selector:
      text:

  content_type:
    name: Content Type
    description: !input content_type_prompt
    selector:
      select:
        options:
          - information
          - location
          - image
    required: true

  location:
    name: Location
    description: !input location_prompt
    selector:
      text:

  image_path:
    name: Image Path
    description: !input image_path_prompt
    selector:
      text:

  target_chat_id:
    name: Override Chat ID
    description: !input chat_id_override_prompt
    selector:
      text:

sequence:
  - variables:
      default_chat_id: !input chat_id
      delete_after_send: !input delete_after_send
      delete_delay: !input delete_delay

      summary: "{{ summary | default('') | trim }}"
      detail: "{{ detail | default('') | trim }}"
      content_type: "{{ content_type | default('') | trim }}"
      location: "{{ location | default('') | trim }}"
      image_path: "{{ image_path | default('') | trim }}"
      override_chat_id: "{{ target_chat_id | default('') | trim }}"

      chat_id_value: >-
        {% set c = override_chat_id if override_chat_id else default_chat_id %}
        {{ c | string | trim if c else '' }}

      image_path_resolved: >-
        {% if image_path.startswith('local/') %}
          {{ '/media/' ~ image_path[6:] }}
        {% else %}
          {{ image_path }}
        {% endif %}

      is_temp_image: >-
        {{
          image_path_resolved.startswith('/media/snapshot')
          or image_path_resolved.startswith('/media/tmp')
        }}

  - alias: Validate inputs
    if:
      - condition: template
        value_template: >-
          {{
            not summary
            or content_type not in ['information','location','image']
            or not chat_id_value
            or (content_type == 'location' and not location)
            or (content_type == 'image' and not image_path)
          }}
    then:
      - variables:
          zalo_response:
            error: >-
              Invalid input for sending Zalo message. Check summary,
              content_type, chat_id, location, or image_path.
      - stop: Invalid input for sending Zalo message.
        response_variable: zalo_response

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ content_type == 'information' }}"
        sequence:
          - action: pyscript.send_zalo_message
            data:
              chat_id: "{{ chat_id_value }}"
              message: |-
                {{ summary }}{% if detail %}

                {{ detail }}{% endif %}

                {% set q = summary | urlencode -%}
                Google Search (https://www.google.com/search?q={{ q }})
            response_variable: zalo_response

      - conditions:
          - condition: template
            value_template: "{{ content_type == 'location' }}"
        sequence:
          - action: pyscript.send_zalo_message
            data:
              chat_id: "{{ chat_id_value }}"
              message: |-
                {{ summary }}{% if detail %}

                {{ detail }}{% endif %}

                {% set p = (summary ~ ' ' ~ location) | urlencode -%}
                Google Maps (https://www.google.com/maps/search/?api=1&query={{ p }})
            response_variable: zalo_response

      - conditions:
          - condition: template
            value_template: "{{ content_type == 'image' }}"
        sequence:
          - variables:
              chu_thich: |-
                {{ summary }}{% if detail %}

                {{ detail }}{% endif %}
          - if:
              - condition: template
                value_template: "{{ hanh_dong_gui_anh | count > 0 }}"
            then:
              # Đi qua zalo-server: HA không phải mở ra Internet. Hành động do
              # người dùng khai nhận hai biến `duong_dan` và `text`.
              - variables:
                  duong_dan: "{{ image_path_resolved }}"
                  text: "{{ chu_thich }}"
              - sequence: !input hanh_dong_gui_anh
              # Hành động do người dùng khai nên không lấy được kết quả trả về.
              # Đừng bịa `ok: true` — nói đúng thứ biết được: đã gửi đi, chưa có
              # xác nhận. Trợ lý thuật lại thế, người dùng không tưởng đã tới nơi.
              - variables:
                  zalo_response:
                    sent_via: zalo-server
                    confirmed: false
                    note: >-
                      Đã đẩy ảnh sang zalo-server. Không có xác nhận từ Zalo ở
                      bước này — xem log của zalo-server nếu ảnh không tới.
                    file: "{{ image_path_resolved }}"
            else:
              - action: pyscript.send_zalo_photo
                data:
                  chat_id: "{{ chat_id_value }}"
                  file_path: "{{ image_path_resolved }}"
                  caption: "{{ chu_thich }}"
                response_variable: zalo_response

          - if:
              - condition: template
                value_template: "{{ delete_after_send and is_temp_image }}"
            then:
              - delay:
                  seconds: "{{ delete_delay }}"
              - action: delete.file
                data:
                  file: "{{ image_path_resolved }}"

  - alias: Build final response
    variables:
      final_response: >-
        {% if zalo_response is defined and zalo_response %}
          {{ zalo_response }}
        {% else %}
          {{ { 'error': 'No response received from Zalo service. Check pyscript logs.' } }}
        {% endif %}

  - stop: ""
    response_variable: final_response
