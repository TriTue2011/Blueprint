triggers:
  - trigger: event
    event_type: r1_speaker_phim
    event_data:
      device_id: !input thiet_bi

actions:
  - choose:
      - alias: Nhấn đơn
        conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'don' }}"
        sequence:
          - choose:
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int == 1 }}"
                sequence: !input hanh_dong_don_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int == 2 }}"
                sequence: !input hanh_dong_don_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int == 3 }}"
                sequence: !input hanh_dong_don_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int == 4 }}"
                sequence: !input hanh_dong_don_4
            default: !input mac_dinh_don
      - alias: Nhấn đúp
        conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'doi' }}"
        sequence:
          - choose:
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int == 1 }}"
                sequence: !input hanh_dong_doi_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int == 2 }}"
                sequence: !input hanh_dong_doi_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int == 3 }}"
                sequence: !input hanh_dong_doi_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int == 4 }}"
                sequence: !input hanh_dong_doi_4
            default: !input mac_dinh_doi
      - alias: Nhấn ba lần
        conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'ba' }}"
        sequence:
          - choose:
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int == 1 }}"
                sequence: !input hanh_dong_ba_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int == 2 }}"
                sequence: !input hanh_dong_ba_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int == 3 }}"
                sequence: !input hanh_dong_ba_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int == 4 }}"
                sequence: !input hanh_dong_ba_4
            default: !input mac_dinh_ba
      - alias: Nhấn giữ
        conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'giu' }}"
        sequence:
          - choose:
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int == 1 }}"
                sequence: !input hanh_dong_giu_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int == 2 }}"
                sequence: !input hanh_dong_giu_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int == 3 }}"
                sequence: !input hanh_dong_giu_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int == 4 }}"
                sequence: !input hanh_dong_giu_4
            default: !input mac_dinh_giu
