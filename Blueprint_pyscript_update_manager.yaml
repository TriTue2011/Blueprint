# blueprint_pyscript_update_manager.yaml
# Import: Settings > Automations > Blueprints > Import Blueprint
# Yeu cau: Home Assistant >= 2024.10.0
blueprint:
  name: Tự động update Pyscript
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/Blueprint_pyscript_update_manager.yaml
  homeassistant:
    min_version: 2024.10.0
  description: >
    Đồng bộ file / folder từ GitHub về /config/pyscript.
    Cấu hình chính đọc từ /config/scripts/pyscript_sync.conf.
    Blueprint chỉ quản lý lịch chạy và thông báo.
  domain: automation

  input:
    update_mode:
      name: Che do goi
      description: >
        Conf: dung nguyen cau hinh trong .conf.
        Kiem tra: ep check, khong ghi file.
        Cap nhat: ep ghi file du .conf dat auto_update=false.
      selector:
        select:
          options:
            - label: "Dung .conf (ton trong cau hinh file)"
              value: "conf"
            - label: "Ep kiem tra (khong ghi file)"
              value: "check"
            - label: "Ep cap nhat (ghi file)"
              value: "update"
      default: "conf"

    schedule_enabled:
      name: Bat lich tu dong
      selector:
        boolean: {}
      default: false

    schedule_hour:
      name: Gio chay tu dong (0-23)
      selector:
        number:
          min: 0
          max: 23
          mode: slider
      default: 3

    reload_after_update:
      name: Tu dong reload pyscript sau khi cap nhat
      selector:
        boolean: {}
      default: true

    # Thong bao Mobile
    notification_section:
      name: Thong bao Mobile
      icon: mdi:bell
      collapsed: true
      input:
        notify_enabled:
          name: Bat thong bao mobile
          selector:
            boolean: {}
          default: false

        notify_device:
          name: Thiet bi nhan thong bao
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

        notification_channel:
          name: Notification Channel (Android)
          default: "Pyscript Updates"
          selector:
            text: {}

        notification_color:
          name: Notification Color
          default: "#03a9f4"
          selector:
            select:
              options:
                - label: "Blue  - #03a9f4"
                  value: "#03a9f4"
                - label: "Green - #4caf50"
                  value: "#4caf50"
                - label: "Orange- #ff9800"
                  value: "#ff9800"
              custom_value: true

        notification_icon:
          name: Notification Icon
          default: "mdi:update"
          selector:
            icon: {}

    # Zalo
    zalo_settings:
      name: Zalo Notification
      icon: mdi:message-image-outline
      collapsed: true
      input:
        include_zalo_notify:
          name: Bat thong bao Zalo
          default: false
          selector:
            boolean: {}

        zalo_group_id:
          name: Zalo Group ID / User ID
          default: ""
          selector:
            text: {}

        zalo_phone:
          name: Zalo Account (so dien thoai)
          default: "+84000000000"
          selector:
            text: {}

        zalo_types:
          name: Loai Zalo
          default: "0"
          selector:
            select:
              options:
                - label: "Ca nhan (User)"
                  value: "0"
                - label: "Nhom (Group)"
                  value: "1"

        zalo_ttl:
          name: TTL (ms, 0 = khong het han)
          default: 0
          selector:
            number:
              min: 0
              max: 86400000
              step: 1000
              unit_of_measurement: ms

    zalo_calling_settings:
      name: Zalo Calling (chọn người nhận từ danh sách)
      icon: mdi:phone-message-outline
      collapsed: true
      input:
        include_zalo_calling:
          name: ✅ Bật gửi qua Zalo Calling
          description: >-
            Gửi qua tích hợp Zalo Calling (kho TriTue2011/Zalo-calling, bản 2026.11.11.3 trở lên). Người nhận chọn từ danh sách
            (Zalo Call → Cấu hình → Người và nhóm nhận), người và nhóm lẫn lộn đều được, mỗi người đúng loại của mình.
          default: false
          selector:
            boolean: {}
        zalo_calling_recipients:
          name: 👥 Người nhận Zalo Calling (chọn nhiều)
          description: Thực thể notify.zalo_call_... của Zalo Calling.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: zalo_call
                  domain: notify

        zalo_calling_ma_nguoi:
          name: ➕ Thêm người theo mã Zalo (threadID)
          description: Mỗi dòng một mã, chỉ gồm chữ số. Người bất kỳ, không cần cấu hình tích hợp. Xem mã ở *Công cụ nhà phát triển → Hành động → zalo_call.list_contacts*. Dùng cùng ô chọn bên trên cũng được.
          default: []
          selector:
            text:
              multiple: true
        zalo_calling_ma_nhom:
          name: ➕ Thêm nhóm theo mã Zalo (threadID)
          description: Mỗi dòng một mã nhóm, chỉ gồm chữ số.
          default: []
          selector:
            text:
              multiple: true

        # ---- Tham số của dịch vụ gửi tin Zalo Calling (sinh bởi bp_zalo_params.py; «Theo mặc định» = không gửi trường đó) ----
        zalo_calling_ttl:
          name: ⏳ Tự xóa tin sau (ms)
          description: >-
            0 = không tự xóa. Zalo chỉ nhận một số mức cố định (1, 7, 14, 30 ngày); mức khác app sẽ báo lỗi.
          default: 0
          selector:
            number:
              min: 0
              max: 2592000000
              step: 1000
              mode: box
              unit_of_measurement: "ms"
        zalo_calling_recall_after:
          name: ↩️ Tự thu hồi sau (giây)
          description: >-
            0 = không thu hồi. Tin biến mất ở cả hai bên đúng giờ; hẹn giờ nằm trong app nên vẫn chạy khi HA khởi động lại. Tối đa 86400 giây.
          default: 0
          selector:
            number:
              min: 0
              max: 86400
              step: 1
              mode: box
              unit_of_measurement: "s"
        zalo_calling_format:
          name: 🔤 Định dạng chữ
          description: >-
            plain = chữ thường · markdown = **đậm**, __gạch chân__… Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "plain"
                  value: "plain"
                - label: "markdown"
                  value: "markdown"
        zalo_calling_text_color:
          name: 🎨 Màu chữ
          description: >-
            auto = tô màu các con số; hoặc chọn một màu cho cả tin. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "auto"
                  value: "auto"
                - label: "red"
                  value: "red"
                - label: "orange"
                  value: "orange"
                - label: "yellow"
                  value: "yellow"
                - label: "green"
                  value: "green"
        zalo_calling_font_size:
          name: 🔠 Cỡ chữ
          description: >-
            auto = tiêu đề to, dòng trong ngoặc nhỏ. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "small"
                  value: "small"
                - label: "big"
                  value: "big"
                - label: "auto"
                  value: "auto"
        zalo_calling_bold:
          name: 🅱️ In đậm
          description: >-
            auto = in đậm các con số. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_italic:
          name: 𝑰 In nghiêng
          description: >-
            auto = nghiêng đoạn trong dấu "…" hoặc (…). Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_underline:
          name: U̲ Gạch chân
          description: >-
            auto = gạch chân liên kết, email. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_heading:
          name: 📰 Tiêu đề
          description: >-
            on = dòng đầu thành tiêu đề; auto = tự nhận dòng đầu ngắn. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_auto_emoji:
          name: 😀 Tự thêm emoji
          description: >-
            true = tự chọn emoji theo nội dung; false = không. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "true"
                  value: "true"
                - label: "false"
                  value: "false"
        zalo_calling_ai_style:
          name: 🧠 Nhờ AI chọn định dạng
          description: >-
            true = nhờ trợ lý AI đánh giá các mục «auto» (thêm vài giây); false = quy tắc tức thì. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "true"
                  value: "true"
                - label: "false"
                  value: "false"
        zalo_calling_emoji:
          name: 🎯 Emoji đầu tin
          description: >-
            Tên emoji gắn vào đầu tin chữ (alert = 🚨, door = 🚪…); gõ thêm tên riêng được. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "ok"
                  value: "ok"
                - label: "x"
                  value: "x"
                - label: "warn"
                  value: "warn"
                - label: "alert"
                  value: "alert"
                - label: "info"
                  value: "info"
                - label: "hoi"
                  value: "hoi"
                - label: "idea"
                  value: "idea"
                - label: "fire"
                  value: "fire"
                - label: "water"
                  value: "water"
                - label: "temp"
                  value: "temp"
                - label: "sun"
                  value: "sun"
                - label: "rain"
                  value: "rain"
                - label: "moon"
                  value: "moon"
                - label: "door"
                  value: "door"
                - label: "lock"
                  value: "lock"
                - label: "unlock"
                  value: "unlock"
                - label: "bell"
                  value: "bell"
                - label: "home"
                  value: "home"
                - label: "car"
                  value: "car"
                - label: "wifi"
                  value: "wifi"
                - label: "battery"
                  value: "battery"
                - label: "power"
                  value: "power"
                - label: "tv"
                  value: "tv"
                - label: "music"
                  value: "music"
                - label: "camera"
                  value: "camera"
                - label: "video"
                  value: "video"
                - label: "phone"
                  value: "phone"
                - label: "time"
                  value: "time"
                - label: "calendar"
                  value: "calendar"
                - label: "heart"
                  value: "heart"
                - label: "like"
                  value: "like"
                - label: "clap"
                  value: "clap"
                - label: "party"
                  value: "party"
                - label: "star"
                  value: "star"
                - label: "money"
                  value: "money"
        zalo_calling_video_caption_inside:
          name: 🎬 Chú thích nằm TRONG video
          description: >-
            Bật: chữ chú thích đi cùng video (một tin duy nhất). Tắt: gửi một tin chữ riêng rồi mới tới video.
          default: true
          selector:
            boolean: {}
        zalo_calling_video_thumbnail:
          name: 🖼️ Ảnh bìa video (tùy chọn)
          description: >-
            Đường dẫn JPEG trong HA (thư mục được phép) hoặc URL. Để trống = khung hình đầu của chính video.
          default: ""
          selector:
            text: {}
# trigger_variables bat buoc de dung !input trong enabled:
trigger_variables:
  _schedule_enabled: !input schedule_enabled

triggers:
  - trigger: time_pattern
    hours: !input schedule_hour
    id: scheduled
    enabled: "{{ _schedule_enabled }}"

  - trigger: event
    event_type: pyscript_update_trigger
    id: manual

conditions: []

# Mirror tat ca !input -> variables
# Bat buoc voi nested input sections (zalo_settings, notification_section)
variables:
  update_mode:          !input update_mode
  reload_after_update:  !input reload_after_update

  notify_enabled:       !input notify_enabled
  notify_devices:       !input notify_device
  notification_channel: !input notification_channel
  notification_color:   !input notification_color
  notification_icon:    !input notification_icon

  include_zalo_notify:  !input include_zalo_notify
  zalo_group_id:        !input zalo_group_id
  zalo_phone:           !input zalo_phone
  zalo_types:           !input zalo_types
  zalo_ttl:             !input zalo_ttl
  include_zalo_calling: !input include_zalo_calling
  zalo_calling_recipients: !input zalo_calling_recipients
  zalo_calling_ma_nguoi: !input zalo_calling_ma_nguoi
  zalo_calling_ma_nhom: !input zalo_calling_ma_nhom
  zalo_calling_ttl: !input zalo_calling_ttl
  zalo_calling_recall_after: !input zalo_calling_recall_after
  zalo_calling_format: !input zalo_calling_format
  zalo_calling_text_color: !input zalo_calling_text_color
  zalo_calling_font_size: !input zalo_calling_font_size
  zalo_calling_bold: !input zalo_calling_bold
  zalo_calling_italic: !input zalo_calling_italic
  zalo_calling_underline: !input zalo_calling_underline
  zalo_calling_heading: !input zalo_calling_heading
  zalo_calling_auto_emoji: !input zalo_calling_auto_emoji
  zalo_calling_ai_style: !input zalo_calling_ai_style
  zalo_calling_emoji: !input zalo_calling_emoji
  zalo_calling_video_caption_inside: !input zalo_calling_video_caption_inside
  zalo_calling_video_thumbnail: !input zalo_calling_video_thumbnail
  zc_opt_msg: >-
    {% set o = {} %}
    {% if zalo_calling_ttl | int(0) > 0 %}{% set o = dict(o, ttl=zalo_calling_ttl | int) %}{% endif %}
    {% if zalo_calling_recall_after | int(0) > 0 %}{% set o = dict(o, recall_after=zalo_calling_recall_after | int) %}{% endif %}
    {% if zalo_calling_format | string not in ['default', ''] %}{% set o = dict(o, format=zalo_calling_format) %}{% endif %}
    {% if zalo_calling_text_color | string not in ['default', ''] %}{% set o = dict(o, text_color=zalo_calling_text_color) %}{% endif %}
    {% if zalo_calling_font_size | string not in ['default', ''] %}{% set o = dict(o, font_size=zalo_calling_font_size) %}{% endif %}
    {% if zalo_calling_bold | string not in ['default', ''] %}{% set o = dict(o, bold=zalo_calling_bold) %}{% endif %}
    {% if zalo_calling_italic | string not in ['default', ''] %}{% set o = dict(o, italic=zalo_calling_italic) %}{% endif %}
    {% if zalo_calling_underline | string not in ['default', ''] %}{% set o = dict(o, underline=zalo_calling_underline) %}{% endif %}
    {% if zalo_calling_heading | string not in ['default', ''] %}{% set o = dict(o, heading=zalo_calling_heading) %}{% endif %}
    {% if zalo_calling_auto_emoji | string not in ['default', ''] %}{% set o = dict(o, auto_emoji=(zalo_calling_auto_emoji == 'true')) %}{% endif %}
    {% if zalo_calling_ai_style | string not in ['default', ''] %}{% set o = dict(o, ai_style=(zalo_calling_ai_style == 'true')) %}{% endif %}
    {% if zalo_calling_emoji | string not in ['default', ''] %}{% set o = dict(o, emoji=zalo_calling_emoji | string) %}{% endif %}
    {{ o }}
  zc_opt_media: >-
    {% set o = {} %}
    {% if zalo_calling_ttl | int(0) > 0 %}{% set o = dict(o, ttl=zalo_calling_ttl | int) %}{% endif %}
    {% if zalo_calling_recall_after | int(0) > 0 %}{% set o = dict(o, recall_after=zalo_calling_recall_after | int) %}{% endif %}
    {{ o }}
  zc_opt_video: >-
    {% set o = {} %}
    {% if zalo_calling_ttl | int(0) > 0 %}{% set o = dict(o, ttl=zalo_calling_ttl | int) %}{% endif %}
    {% if zalo_calling_recall_after | int(0) > 0 %}{% set o = dict(o, recall_after=zalo_calling_recall_after | int) %}{% endif %}
    {% if zalo_calling_video_thumbnail | string | trim != '' %}{% set o = dict(o, thumbnail=zalo_calling_video_thumbnail | string | trim) %}{% endif %}
    {{ o }}
  zalo_calling_ds: >-
    {% set ns = namespace(l=[], ids=[]) %}
    {% for e in zalo_calling_recipients %}{% set t = state_attr(e, 'thread_id') | string %}{% if t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': state_attr(e, 'type') | string}] %}{% endif %}{% endfor %}
    {% for m in zalo_calling_ma_nguoi %}{% set t = m | string | trim %}{% if t is match('^[0-9]+$') and t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': 'user'}] %}{% endif %}{% endfor %}
    {% for m in zalo_calling_ma_nhom %}{% set t = m | string | trim %}{% if t is match('^[0-9]+$') and t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': 'group'}] %}{% endif %}{% endfor %}
    {{ ns.l }}

  # Chuyen device_id -> ten service notify
  # Vi du: "My Phone" -> "mobile_app_my_phone"
  device_name_map: >
    {% set ns = namespace(names=[]) %}
    {% for device_id in notify_devices %}
      {% set name = device_attr(device_id, "name") | slugify %}
      {% set ns.names = ns.names + ["mobile_app_" + name] %}
    {% endfor %}
    {{ ns.names }}

  # Xac dinh arguments truyen vao shell_command
  # conf  -> khong truyen gi, doc nguyen tu .conf
  # check -> truyen rong, ep khong ghi
  # update-> truyen 'update', ep ghi file
  _arguments: >
    {% if update_mode == 'update' %}update
    {% else %}{% endif %}

actions:
  - variables:
      start_ts: "{{ as_timestamp(now()) }}"

  # Goi shell_command — config chinh doc tu .conf
  - action: shell_command.pyscript_update
    data:
      arguments: "{{ _arguments | trim }}"
    response_variable: cmd_result

  # Guard: dung neu shell command that bai hoan toan
  - if:
      - condition: template
        value_template: "{{ cmd_result.returncode != 0 }}"
    then:
      - action: logbook.log
        data:
          name: Pyscript Update ERROR
          message: >
            Shell command that bai (rc={{ cmd_result.returncode }}).
            stderr: {{ cmd_result.stderr | truncate(300) }}
      - stop: "Shell command failed"
        error: true

  # Parse stdout
  - variables:
      raw_output: "{{ cmd_result.stdout }}"

      # Danh sach file da duoc cap nhat
      # Loc bo cac dong header cua script (> pyscript, > dir, > manifest, ...)
      updated_list: >
        {% set ns = namespace(files=[], current='') %}
        {% for line in raw_output.split('\n') %}
          {% set s = line.strip() %}
          {% if s.startswith('> ')
             and not s.startswith('> pyscript')
             and not s.startswith('> dir')
             and not s.startswith('> manifest')
             and not s.startswith('> update')
             and not s.startswith('> reload')
             and not s.startswith('> token')
             and not s.startswith('> config') %}
            {% set ns.current = s[2:] %}
          {% endif %}
          {% if '-! updated' in s and ns.current != '' %}
            {% set ns.files = ns.files + [ns.current] %}
            {% set ns.current = '' %}
          {% endif %}
        {% endfor %}
        {{ ns.files }}

      # Lay so lieu tu dong "Summary: total=X, changed=Y, failed=Z"
      summary_line: >
        {% set found = namespace(v='') %}
        {% for l in raw_output.split('\n') %}
          {% if l.startswith('Summary:') %}{% set found.v = l %}{% endif %}
        {% endfor %}
        {{ found.v }}

      total_files: >
        {% set m = summary_line | regex_findall('total=(\d+)') %}
        {{ m[0] if m else '0' }}
      update_count: "{{ updated_list | length }}"
      failed_count: >
        {% set m = summary_line | regex_findall('failed=(\d+)') %}
        {{ m[0] if m else '0' }}
      uptodate_count: "{{ raw_output.split('\n') | select('search', '-> up-to-date') | list | length }}"
      nosource_count: "{{ raw_output.split('\n') | select('search', 'no source') | list | length }}"

      duration:    "{{ (as_timestamp(now()) - start_ts) | float | round(2) }}"
      update_time: "{{ now().strftime('%H:%M %d/%m/%Y') }}"

  # FIX: reload khi co cap nhat, bat ke che do goi la gi
  # (khong check update_mode == 'update' vi co the dung che do 'conf')
  - if:
      - condition: template
        value_template: >
          {{ update_count | int > 0 and reload_after_update }}
    then:
      - action: pyscript.reload

  # Ghi logbook
  - action: logbook.log
    data:
      name: Pyscript Update
      message: >
        [{{ update_mode }}]
        total={{ total_files }}, updated={{ update_count }},
        failed={{ failed_count }}, time={{ duration }}s

  # Mobile notify (ca khi co loi download)
  - if:
      - condition: template
        value_template: >
          {{ notify_enabled
             and (update_count | int > 0 or failed_count | int > 0) }}
    then:
      - repeat:
          for_each: "{{ device_name_map }}"
          sequence:
            - action: "notify.{{ repeat.item }}"
              data:
                title: >
                  {% if failed_count | int > 0 %}
                  ⚠️ Pyscript: {{ failed_count }} loi
                  {% elif update_count | int > 0 %}
                  ✅ Pyscript: {{ update_count }} cap nhat
                  {% else %}
                  ℹ️ Pyscript: khong co gi moi
                  {% endif %}
                message: >
                  Mode: {{ update_mode }}
                  Total: {{ total_files }} | Updated: {{ update_count }} | Failed: {{ failed_count }}
                  {% if update_count | int > 0 %}

                  Files cap nhat:
                  {% for f in updated_list %}- {{ f }}
                  {% endfor %}{% endif %}
                  ⏱ {{ duration }}s | {{ update_time }}
                data:
                  channel: "{{ notification_channel }}"
                  color:   "{{ notification_color }}"
                  notification_icon: "{{ notification_icon }}"

  # Zalo notify
  - if:
      - condition: template
        value_template: "{{ include_zalo_notify }}"
    then:
      - action: zalo_bot.send_message
        data:
          type:              !input zalo_types
          ttl:               !input zalo_ttl
          thread_id:         !input zalo_group_id
          account_selection: !input zalo_phone
          message: >
            📋 PYSCRIPT UPDATE REPORT

            📊 Summary
            • Mode     : {{ update_mode }}
            • Total    : {{ total_files }}
            • Updated  : {{ update_count }}
            • Up-to-date: {{ uptodate_count }}
            • Failed   : {{ failed_count }}
            • No source: {{ nosource_count }}
            {% if update_count | int > 0 %}

            🔄 Updated Files:
            {% for f in updated_list %}
            • {{ f }}
            {% endfor %}
            {% endif %}

            ⏱ Duration: {{ duration }}s
            ⏰ {{ update_time }}


  # Zalo Calling
  - if:
      - condition: template
        value_template: "{{ include_zalo_calling and zalo_calling_ds | count > 0 }}"
    then:
      - variables:
          zalo_calling_msg: >
            📋 PYSCRIPT UPDATE REPORT

            📊 Summary
            • Mode     : {{ update_mode }}
            • Total    : {{ total_files }}
            • Updated  : {{ update_count }}
            • Up-to-date: {{ uptodate_count }}
            • Failed   : {{ failed_count }}
            • No source: {{ nosource_count }}
            {% if update_count | int > 0 %}

            🔄 Updated Files:
            {% for f in updated_list %}
            • {{ f }}
            {% endfor %}
            {% endif %}

            ⏱ Duration: {{ duration }}s
            ⏰ {{ update_time }}
      - repeat:
          for_each: "{{ zalo_calling_ds }}"
          sequence:
            - continue_on_error: true
              action: zalo_call.send_message
              data: >-
                {{ {'thread_id': repeat.item.thread_id, 'type': repeat.item.type,
                    'message': zalo_calling_msg | trim} | combine(zc_opt_msg) }}

# single: khong chay song song
# silent: neu dang chay thi bo qua trigger moi (khong bao loi)
mode: single

max_exceeded: silent
