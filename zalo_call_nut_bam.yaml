blueprint:
  name: Zalo Call - Một nút bấm nghe máy, cúp máy hoặc gọi đi
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/zalo_call_nut_bam.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: "**Phiên bản: v.2026.11.13**"
  input:
    nut:
      name: ① Nút bấm
      icon: mdi:gesture-tap-button
      description: Chọn trigger của nút (có thể chọn nhiều).
      input:
        nut_bam:
          name: Nút bấm
          selector:
            trigger: {}
        cam_bien_cuoc_goi:
          name: Cảm biến «Trạng thái cuộc gọi» của Zalo Call
          description: Để biết đang đổ chuông, đang gọi hay rảnh.
          selector:
            entity:
              filter:
                - integration: zalo_call
                  domain: sensor
    khi_ranh:
      name: ② Khi không có cuộc gọi nào
      icon: mdi:phone-outgoing-outline
      input:
        hanh_dong_ranh:
          name: Nhấn nút lúc rảnh thì
          selector:
            select:
              mode: dropdown
              options:
                - label: Gọi điện cho người đã chọn
                  value: goi_di
                - label: Gọi cảnh báo (đọc câu cảnh báo rồi nối thiết bị nhà)
                  value: canh_bao
                - label: Nhắn tin cho người đã chọn
                  value: nhan_tin
                - label: Không làm gì
                  value: khong
          default: goi_di
        nguoi_nhan:
          name: Người nhận (chọn nhiều)
          description: >-
            Chọn từ danh sách Zalo Call, người và nhóm lẫn lộn đều được. Nhắn tin gửi cho TẤT CẢ (mỗi người đúng loại của mình).
            Gọi điện chỉ gọi được người, và gọi người ĐẦU TIÊN trong danh sách (một lúc chỉ có một cuộc gọi).
          selector:
            entity:
              multiple: true
              filter:
                - integration: zalo_call
                  domain: notify
          default: []
        ma_nguoi:
          name: Thêm người theo mã Zalo (threadID)
          description: Mỗi dòng một mã, chỉ gồm chữ số. Người bất kỳ, không cần cấu hình tích hợp. Mã là duy nhất nên không nhầm khi trùng tên. Xem mã ở *Công cụ nhà phát triển → Hành động → zalo_call.list_contacts*. Dùng cùng ô chọn bên trên cũng được.
          selector:
            text:
              multiple: true
          default: []
        ma_nhom:
          name: Thêm nhóm theo mã Zalo (threadID)
          description: Mỗi dòng một mã nhóm, chỉ gồm chữ số. Chỉ dùng khi gửi tin nhắn (nhóm không gọi điện được).
          selector:
            text:
              multiple: true
          default: []
        loai_cuoc_goi:
          name: Gọi thoại hay gọi video
          selector:
            select:
              mode: dropdown
              options:
                - label: Gọi thoại
                  value: user
                - label: Gọi video
                  value: video
          default: user
        cau_noi:
          name: Câu có sẵn (khi gọi cảnh báo hoặc nhắn tin)
          selector:
            select:
              mode: dropdown
              options:
                - label: Cần giúp ngay (khẩn cấp)
                  value: can_giup
                - label: Có người bấm chuông cửa
                  value: chuong_cua
                - label: Gọi giúp tôi một chút
                  value: goi_giup
                - label: Tôi đã về đến nhà
                  value: ve_nha
                - label: Tự viết
                  value: tu_viet
          default: can_giup
        cau_tu_viet:
          name: Câu tự viết (chỉ dùng khi chọn «Tự viết»)
          selector:
            text:
              multiline: true
          default: ""
    khi_dang_goi:
      name: ③ Khi đang có cuộc gọi
      icon: mdi:phone-in-talk-outline
      collapsed: true
      input:
        nghe_may:
          name: Có cuộc gọi đến thì nghe máy
          selector:
            boolean: {}
          default: true
        cup_may:
          name: Đang trong cuộc gọi hoặc đang gọi đi thì cúp máy
          selector:
            boolean: {}
          default: true
    thiet_bi:
      name: ④ Thiết bị trong nhà dùng khi gọi cảnh báo (tuỳ chọn)
      icon: mdi:speaker-wireless
      collapsed: true
      input:
        noi_gom:
          name: Nối những thứ nào
          description: Tích 1 = dùng 1, tích 2 = dùng 2, tích 3 = dùng cả 3. Không tích gì = nối tất cả thiết bị đã chọn.
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Mic
                  value: mic
                - label: Loa
                  value: speaker
                - label: Camera (cuộc gọi video)
                  value: camera
          default: []
        loa:
          name: Loa trong nhà (chọn nhiều = dự phòng theo thứ tự)
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
          default: []
        mic:
          name: Mic trong nhà (chọn nhiều = dự phòng theo thứ tự)
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - camera
                    - assist_satellite
          default: []
        camera:
          name: Camera trong nhà (chọn nhiều = dự phòng theo thứ tự)
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera
          default: []

mode: single
max_exceeded: silent

variables:
  version: 20261113
  cam_bien_cuoc_goi: !input cam_bien_cuoc_goi
  hanh_dong_ranh: !input hanh_dong_ranh
  nguoi_nhan: !input nguoi_nhan
  ma_nguoi: !input ma_nguoi
  ma_nhom: !input ma_nhom
  ds_nhan: >-
    {% set ns = namespace(l=[], ids=[]) %}
    {% for e in nguoi_nhan %}{% set t = state_attr(e, 'thread_id') | string %}{% if t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': state_attr(e, 'type') | string}] %}{% endif %}{% endfor %}
    {% for m in ma_nguoi %}{% set t = m | string | trim %}{% if t is match('^[0-9]+$') and t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': 'user'}] %}{% endif %}{% endfor %}
    {% for m in ma_nhom %}{% set t = m | string | trim %}{% if t is match('^[0-9]+$') and t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': 'group'}] %}{% endif %}{% endfor %}
    {{ ns.l }}
  loai_cuoc_goi: !input loai_cuoc_goi
  cau_noi: !input cau_noi
  cau_tu_viet: !input cau_tu_viet
  nghe_may: !input nghe_may
  cup_may: !input cup_may
  noi_gom: !input noi_gom
  loa_goc: !input loa
  loa: >-
    {{ (loa_goc if loa_goc is not string else ([loa_goc] if loa_goc else [])) | join(',') }}
  mic_goc: !input mic
  mic: >-
    {{ (mic_goc if mic_goc is not string else ([mic_goc] if mic_goc else [])) | join(',') }}
  camera_goc: !input camera
  camera: >-
    {{ (camera_goc if camera_goc is not string else ([camera_goc] if camera_goc else [])) | join(',') }}
  mau_cau:
    can_giup: Tôi cần giúp ngay, hãy liên lạc với tôi
    chuong_cua: Có người bấm chuông cửa
    goi_giup: Gọi giúp tôi một chút nhé
    ve_nha: Tôi đã về đến nhà
  noi_dung: >-
    {% if cau_noi == 'tu_viet' and cau_tu_viet | trim != '' %}{{ cau_tu_viet }}{% else %}{{ mau_cau.get(cau_noi, 'Cần giúp') }}{% endif %}
  nguoi_goi_id: >-
    {% set ns = namespace(r='') %}{% for p in ds_nhan %}{% if ns.r == '' and p.type == 'user' %}{% set ns.r = p.thread_id %}{% endif %}{% endfor %}{{ ns.r | string }}
  trang_thai_goi: "{{ states(cam_bien_cuoc_goi) }}"
  trang_thai_chi_tiet: "{{ state_attr(cam_bien_cuoc_goi, 'status') }}"

triggers: !input nut_bam

actions:
  - choose:
      - alias: Có cuộc gọi đến đổ chuông - nghe máy
        conditions:
          - condition: template
            value_template: "{{ nghe_may and trang_thai_goi == 'ringing' and trang_thai_chi_tiet == 'incoming' }}"
        sequence:
          - action: zalo_call.answer_call
            data: {}
      - alias: Đang trong cuộc gọi - cúp máy
        conditions:
          - condition: template
            value_template: "{{ cup_may and trang_thai_goi in ['ringing', 'active'] }}"
        sequence:
          - action: zalo_call.end_call
            data: {}
      - alias: Rảnh - gọi điện cho người đầu tiên trong danh sách
        conditions:
          - condition: template
            value_template: "{{ hanh_dong_ranh == 'goi_di' and nguoi_goi_id != '' }}"
        sequence:
          - action: zalo_call.make_call
            data: >-
              {{ {'thread_id': nguoi_goi_id | string, 'type': loai_cuoc_goi} }}
      - alias: Rảnh - cảnh báo (nhắn tin cho tất cả, gọi cảnh báo người đầu tiên)
        conditions:
          - condition: template
            value_template: "{{ hanh_dong_ranh == 'canh_bao' and ds_nhan | count > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ ds_nhan }}"
              sequence:
                - action: zalo_call.send_message
                  data: >-
                    {{ {'thread_id': repeat.item.thread_id, 'type': repeat.item.type,
                        'message': noi_dung, 'emoji': 'alert'} }}
          - if:
              - condition: template
                value_template: "{{ nguoi_goi_id != '' }}"
            then:
              - action: zalo_call.alert_call
                data: >-
                  {% set d = {'thread_id': nguoi_goi_id | string, 'message': noi_dung} %}
                  {% if loai_cuoc_goi == 'video' %}{% set d = dict(d, type='video') %}{% endif %}
                  {% if loa %}{% set d = dict(d, speaker=loa) %}{% endif %}
                  {% if mic %}{% set d = dict(d, mic=mic) %}{% endif %}
                  {% if camera %}{% set d = dict(d, camera=camera) %}{% endif %}
                  {% if noi_gom | count > 0 %}{% set d = dict(d, connect=noi_gom) %}{% endif %}
                  {{ d }}
      - alias: Rảnh - nhắn tin cho tất cả người nhận (người và nhóm)
        conditions:
          - condition: template
            value_template: "{{ hanh_dong_ranh == 'nhan_tin' and ds_nhan | count > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ ds_nhan }}"
              sequence:
                - action: zalo_call.send_message
                  data: >-
                    {{ {'thread_id': repeat.item.thread_id, 'type': repeat.item.type, 'message': noi_dung} }}
