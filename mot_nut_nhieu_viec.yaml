variables:
  version: 20261112
  thuc_the_1: !input thuc_the_1
  trang_thai_1: !input trang_thai_1
  thuoc_tinh_1: !input thuoc_tinh_1
  gia_tri_1: !input gia_tri_1
  thuc_the_2: !input thuc_the_2
  trang_thai_2: !input trang_thai_2
  thuoc_tinh_2: !input thuoc_tinh_2
  gia_tri_2: !input gia_tri_2
  thuc_the_3: !input thuc_the_3
  trang_thai_3: !input trang_thai_3
  thuoc_tinh_3: !input thuoc_tinh_3
  gia_tri_3: !input gia_tri_3
  thuc_the_4: !input thuc_the_4
  trang_thai_4: !input trang_thai_4
  thuoc_tinh_4: !input thuoc_tinh_4
  gia_tri_4: !input gia_tri_4
  thuc_the_5: !input thuc_the_5
  trang_thai_5: !input trang_thai_5
  thuoc_tinh_5: !input thuoc_tinh_5
  gia_tri_5: !input gia_tri_5
  thuc_the_6: !input thuc_the_6
  trang_thai_6: !input trang_thai_6
  thuoc_tinh_6: !input thuoc_tinh_6
  gia_tri_6: !input gia_tri_6
  viec_dang_can: >-
    {% set ns = namespace(l=[]) %}
    {% set e = thuc_the_1 %}{% set st = trang_thai_1 %}{% if e != '' and st | count > 0 and states(e) in st and (thuoc_tinh_1 == '' or (state_attr(e, thuoc_tinh_1) | string) == (gia_tri_1 | string)) %}{% set ns.l = ns.l + [{'i': 1, 't': states[e].last_changed.timestamp()}] %}{% endif %}
    {% set e = thuc_the_2 %}{% set st = trang_thai_2 %}{% if e != '' and st | count > 0 and states(e) in st and (thuoc_tinh_2 == '' or (state_attr(e, thuoc_tinh_2) | string) == (gia_tri_2 | string)) %}{% set ns.l = ns.l + [{'i': 2, 't': states[e].last_changed.timestamp()}] %}{% endif %}
    {% set e = thuc_the_3 %}{% set st = trang_thai_3 %}{% if e != '' and st | count > 0 and states(e) in st and (thuoc_tinh_3 == '' or (state_attr(e, thuoc_tinh_3) | string) == (gia_tri_3 | string)) %}{% set ns.l = ns.l + [{'i': 3, 't': states[e].last_changed.timestamp()}] %}{% endif %}
    {% set e = thuc_the_4 %}{% set st = trang_thai_4 %}{% if e != '' and st | count > 0 and states(e) in st and (thuoc_tinh_4 == '' or (state_attr(e, thuoc_tinh_4) | string) == (gia_tri_4 | string)) %}{% set ns.l = ns.l + [{'i': 4, 't': states[e].last_changed.timestamp()}] %}{% endif %}
    {% set e = thuc_the_5 %}{% set st = trang_thai_5 %}{% if e != '' and st | count > 0 and states(e) in st and (thuoc_tinh_5 == '' or (state_attr(e, thuoc_tinh_5) | string) == (gia_tri_5 | string)) %}{% set ns.l = ns.l + [{'i': 5, 't': states[e].last_changed.timestamp()}] %}{% endif %}
    {% set e = thuc_the_6 %}{% set st = trang_thai_6 %}{% if e != '' and st | count > 0 and states(e) in st and (thuoc_tinh_6 == '' or (state_attr(e, thuoc_tinh_6) | string) == (gia_tri_6 | string)) %}{% set ns.l = ns.l + [{'i': 6, 't': states[e].last_changed.timestamp()}] %}{% endif %}
    {{ ns.l }}
  chon: >-
    {% set ns = namespace(i=0, t=0) %}{% for v in viec_dang_can %}{% if v.t > ns.t %}{% set ns.i = v.i %}{% set ns.t = v.t %}{% endif %}{% endfor %}{{ ns.i }}

triggers: !input nut_bam

actions:
  - choose:
      - alias: Việc 1
        conditions:
          - condition: template
            value_template: "{{ chon | int == 1 }}"
        sequence: !input hanh_dong_1
      - alias: Việc 2
        conditions:
          - condition: template
            value_template: "{{ chon | int == 2 }}"
        sequence: !input hanh_dong_2
      - alias: Việc 3
        conditions:
          - condition: template
            value_template: "{{ chon | int == 3 }}"
        sequence: !input hanh_dong_3
      - alias: Việc 4
        conditions:
          - condition: template
            value_template: "{{ chon | int == 4 }}"
        sequence: !input hanh_dong_4
      - alias: Việc 5
        conditions:
          - condition: template
            value_template: "{{ chon | int == 5 }}"
        sequence: !input hanh_dong_5
      - alias: Việc 6
        conditions:
          - condition: template
            value_template: "{{ chon | int == 6 }}"
        sequence: !input hanh_dong_6
    default: !input mac_dinh
