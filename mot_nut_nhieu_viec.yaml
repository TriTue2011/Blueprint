blueprint:
  name: Một nút nhiều việc - ưu tiên yêu cầu gần nhất
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/mot_nut_nhieu_viec.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: >
    **Một nút bấm, làm đúng việc đang cần.** Bạn khai tối đa 6 «việc», mỗi việc gồm một **thực thể** (báo thức, cảm biến cuộc gọi, hẹn giờ, chuông cửa...), **trạng thái** nghĩa là việc đó
    đang cần xử lý, và **hành động** khi nhấn nút. Khi nhấn, blueprint xem việc nào đang cần xử lý và chọn việc có **yêu cầu gần nhất** (thực thể đổi sang trạng thái đó mới nhất).
    Không việc nào đang cần thì chạy **hành động mặc định** (ví dụ: gọi đi).

    <details>
    <summary><b>Ví dụ cho nút giữa loa R1:</b> - Nhấn để mở rộng</summary>

      - Việc 1: thực thể báo thức của loa, trạng thái `on`, hành động *Tắt báo thức* (dịch vụ `r1_speaker.bao_thuc_tat`).
      - Việc 2: cảm biến «Trạng thái cuộc gọi» của Zalo Call, trạng thái `ringing`, thuộc tính `status` = `incoming`, hành động *Nghe máy* (`zalo_call.answer_call`).
      - Việc 3: cùng cảm biến, trạng thái `active`, hành động *Cúp máy* (`zalo_call.end_call`).
      - Mặc định: *Gọi đi* (`zalo_call.make_call`).
      Báo thức kêu lúc 19:00 rồi 19:02 có cuộc gọi đến thì nhấn nút sẽ **nghe máy** (yêu cầu gần nhất); xong cuộc gọi mà báo thức còn kêu thì nhấn sẽ **tắt báo thức**.

    </details>

    **Phiên bản: v.2026.11.12**
  input:
    nut:
      name: ① Nút bấm
      icon: mdi:gesture-tap-button
      input:
        nut_bam:
          name: Nút bấm
          description: Chọn trigger của nút (nút giữa loa R1, nút Zigbee, nút ảo...).
          selector:
            trigger: {}
    mac_dinh_nhom:
      name: ② Khi không có việc nào đang cần
      icon: mdi:gesture-tap
      input:
        mac_dinh:
          name: Hành động mặc định
          selector:
            action: {}
          default: []
    viec_1:
      name: ③ Việc 1
      icon: mdi:numeric-1-circle-outline
      collapsed: false
      input:
        thuc_the_1:
          name: Thực thể của việc 1
          selector:
            entity: {}
          default: ""
        trang_thai_1:
          name: Trạng thái nghĩa là việc này đang cần xử lý
          description: Một hoặc nhiều trạng thái (ví dụ ringing, on, active). Để trống = bỏ qua việc này.
          selector:
            text:
              multiple: true
          default: []
        thuoc_tinh_1:
          name: Thuộc tính cần khớp (tuỳ chọn)
          description: Tên thuộc tính, ví dụ status. Để trống = không xét thuộc tính.
          selector:
            text: {}
          default: ""
        gia_tri_1:
          name: Giá trị của thuộc tính (tuỳ chọn)
          selector:
            text: {}
          default: ""
        hanh_dong_1:
          name: Hành động khi nhấn nút lúc này
