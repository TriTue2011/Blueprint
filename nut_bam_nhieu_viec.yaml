mode: single
max_exceeded: silent

triggers: !input nut_bam

conditions:
  - alias: Đúng loa R1 đã chọn (nếu có chọn)
    condition: template
    value_template: >-
      {{ thiet_bi_r1 == '' or trigger.platform != 'event' or trigger.event.event_type != 'r1_speaker_phim'
         or trigger.event.data.device_id == thiet_bi_r1 }}

actions:
  - choose:
      - alias: Nhấn đơn
        conditions:
          - condition: template
            value_template: "{{ cu_chi == 'don' }}"
        sequence:
          - choose:
              - alias: Chế độ một việc
                conditions:
                  - condition: template
                    value_template: "{{ che_do_don == 'mot_viec' }}"
                sequence: !input mac_dinh_don
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int(0) == 1 }}"
                sequence: !input hanh_dong_don_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int(0) == 2 }}"
                sequence: !input hanh_dong_don_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int(0) == 3 }}"
                sequence: !input hanh_dong_don_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int(0) == 4 }}"
                sequence: !input hanh_dong_don_4
              - alias: Việc 5
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int(0) == 5 }}"
                sequence: !input hanh_dong_don_5
              - alias: Việc 6
                conditions:
                  - condition: template
                    value_template: "{{ chon_don | int(0) == 6 }}"
                sequence: !input hanh_dong_don_6
            default: !input mac_dinh_don
      - alias: Nhấn đúp
        conditions:
          - condition: template
            value_template: "{{ cu_chi == 'doi' }}"
        sequence:
          - choose:
              - alias: Chế độ một việc
                conditions:
                  - condition: template
                    value_template: "{{ che_do_doi == 'mot_viec' }}"
                sequence: !input mac_dinh_doi
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int(0) == 1 }}"
                sequence: !input hanh_dong_doi_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int(0) == 2 }}"
                sequence: !input hanh_dong_doi_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int(0) == 3 }}"
                sequence: !input hanh_dong_doi_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int(0) == 4 }}"
                sequence: !input hanh_dong_doi_4
              - alias: Việc 5
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int(0) == 5 }}"
                sequence: !input hanh_dong_doi_5
              - alias: Việc 6
                conditions:
                  - condition: template
                    value_template: "{{ chon_doi | int(0) == 6 }}"
                sequence: !input hanh_dong_doi_6
            default: !input mac_dinh_doi
      - alias: Nhấn ba lần
        conditions:
          - condition: template
            value_template: "{{ cu_chi == 'ba' }}"
        sequence:
          - choose:
              - alias: Chế độ một việc
                conditions:
                  - condition: template
                    value_template: "{{ che_do_ba == 'mot_viec' }}"
                sequence: !input mac_dinh_ba
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int(0) == 1 }}"
                sequence: !input hanh_dong_ba_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int(0) == 2 }}"
                sequence: !input hanh_dong_ba_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int(0) == 3 }}"
                sequence: !input hanh_dong_ba_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int(0) == 4 }}"
                sequence: !input hanh_dong_ba_4
              - alias: Việc 5
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int(0) == 5 }}"
                sequence: !input hanh_dong_ba_5
              - alias: Việc 6
                conditions:
                  - condition: template
                    value_template: "{{ chon_ba | int(0) == 6 }}"
                sequence: !input hanh_dong_ba_6
            default: !input mac_dinh_ba
      - alias: Giữ nút
        conditions:
          - condition: template
            value_template: "{{ cu_chi == 'giu' }}"
        sequence:
          - choose:
              - alias: Chế độ một việc
                conditions:
                  - condition: template
                    value_template: "{{ che_do_giu == 'mot_viec' }}"
                sequence: !input mac_dinh_giu
              - alias: Việc 1
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int(0) == 1 }}"
                sequence: !input hanh_dong_giu_1
              - alias: Việc 2
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int(0) == 2 }}"
                sequence: !input hanh_dong_giu_2
              - alias: Việc 3
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int(0) == 3 }}"
                sequence: !input hanh_dong_giu_3
              - alias: Việc 4
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int(0) == 4 }}"
                sequence: !input hanh_dong_giu_4
              - alias: Việc 5
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int(0) == 5 }}"
                sequence: !input hanh_dong_giu_5
              - alias: Việc 6
                conditions:
                  - condition: template
                    value_template: "{{ chon_giu | int(0) == 6 }}"
                sequence: !input hanh_dong_giu_6
            default: !input mac_dinh_giu
