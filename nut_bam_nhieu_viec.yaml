blueprint:
  name: Nút bấm (loa R1, Zigbee, công tắc, mọi loại) - MỘT automation, thêm bao nhiêu việc cũng được
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/nut_bam_nhieu_viec.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: |
    **Phiên bản: v.2026.11.17** — thay cho các blueprint nút riêng của loa R1 (nhận cuộc gọi, gọi đi, nút giữa nhiều cử chỉ): MỘT automation cho mọi nút.

    **Nút:** ô «Nút bấm» nhận MỌI loại trigger (cử chỉ loa R1, nút Zigbee/Z-Wave/Matter, sự kiện `event`, `button`, công tắc, thiết bị bất kỳ…). Đặt **ID** cho từng trigger
    (ví dụ `don`, `doi`, `giu`) để biết đó là cử chỉ nào.

    **Việc:** bấm «Thêm» để thêm một việc, **thêm bao nhiêu cũng được** (kể cả 100): không có danh sách làm sẵn. Mỗi việc gồm: tên, *nhấn kiểu nào* (ID trigger, trống = mọi kiểu),
    *cảm biến + trạng thái nghĩa là «đang cần việc này»* (ví dụ cảm biến cuộc gọi = `incoming`), và các hành động (lời gọi dịch vụ) sẽ chạy.

    **Chọn việc theo cảm biến gần nhất:** mỗi lần bấm, các việc khớp kiểu nhấn VÀ có cảm biến đang ở trạng thái cần được so với nhau; việc có cảm biến **vừa đổi trạng thái gần đây nhất** thắng
    (ví dụ vừa có cuộc gọi Telegram đến thì nhấn sẽ nghe cuộc Telegram, dù cuộc Zalo cũng đang đổ chuông từ trước). Có thể đổi sang «việc đứng trước» hoặc «chạy hết các việc khớp».
    Việc KHÔNG chọn cảm biến là việc dự phòng: chỉ chạy khi không việc nào có cảm biến khớp.

    **Lưu ý về hành động:** ô hành động trong mỗi việc chạy các lời gọi dịch vụ (action) với dữ liệu đã nhập. Nếu cần giá trị lấy từ mẫu (`{{ }}`), dùng ô «Việc dự phòng»
    hoặc đặt giá trị cụ thể (mã người, entity_id…).
  input:
    nut:
      name: ① Nút bấm
      icon: mdi:gesture-tap-button
      input:
        nut_bam:
          name: Nút bấm (mọi loại trigger)
          description: "Thêm trigger của từng nút/cử chỉ và đặt **ID** (ví dụ `don`, `doi`). Loa R1: trigger «Thiết bị» của loa R1, kiểu nhấn đơn/đôi."
          selector:
            trigger: {}
    viec_chung:
      name: ② Các việc (thêm khi cần)
      icon: mdi:format-list-checks
      input:
        viec:
          name: Việc
          description: |
            Bấm «Thêm». Mỗi việc: **Tên**; **Khi nhấn kiểu** = ID trigger (trống = mọi kiểu); **Cảm biến** + **Trạng thái cần việc** (trống = bất kỳ trạng thái nào trừ unavailable/unknown);
            **Thuộc tính** + **Giá trị** (tuỳ chọn); **Hành động** = các lời gọi dịch vụ chạy khi việc được chọn.
          selector:
            object:
              multiple: true
              label_field: ten
              description_field: cam_bien
              fields:
                ten:
                  label: Tên việc
                  selector:
                    text: {}
                khi_nhan:
                  label: Khi nhấn kiểu (ID trigger, trống = mọi kiểu)
                  selector:
                    text:
                      multiple: true
                cam_bien:
                  label: Cảm biến theo dõi (trống = việc dự phòng)
                  selector:
                    entity: {}
                trang_thai:
                  label: Trạng thái nghĩa là «đang cần việc này»
                  selector:
                    text:
                      multiple: true
                thuoc_tinh:
                  label: Thuộc tính cần khớp (tuỳ chọn)
                  selector:
                    text: {}
                gia_tri:
                  label: Giá trị của thuộc tính (tuỳ chọn)
                  selector:
                    text: {}
                hanh_dong:
                  label: Hành động khi việc được chọn
                  selector:
                    action: {}
          default: []
        cach_chon:
          name: Khi nhiều việc cùng khớp
          selector:
            select:
              mode: dropdown
              options:
                - label: Chạy việc có cảm biến vừa đổi trạng thái gần đây nhất
                  value: moi_nhat
                - label: Chạy việc đứng đầu danh sách
                  value: dau_tien
                - label: Chạy tất cả các việc khớp (theo thứ tự)
                  value: tat_ca
          default: moi_nhat
        viec_du_phong:
          name: Việc dự phòng (khi không việc nào ở trên khớp)
          description: "Hành động đầy đủ của HA (có thể dùng mẫu, điều kiện, delay)."
          selector:
            action: {}
          default: []

mode: single
max_exceeded: silent

variables:
  viec: !input viec
  cach_chon: !input cach_chon
  kieu_nhan: "{{ trigger.id | string }}"
  # Danh sách CHỈ SỐ của các việc sẽ chạy. Việc có cảm biến: khớp kiểu nhấn + trạng thái (+ thuộc tính). Mới nhất = cảm biến đổi trạng thái gần nhất (bằng nhau: việc đứng trước).
  chon: >-
    {% set ns = namespace(ung_vien=[], du_phong=[]) %}
    {% for j in viec | default([], true) %}
      {% set kn = j.khi_nhan | default([], true) %}
      {% set kn = [kn] if kn is string else kn %}
      {% if kn | count == 0 or kieu_nhan in (kn | map('string') | list) %}
        {% set cb = (j.cam_bien | default('', true)) | string | trim %}
        {% if cb == '' %}
          {% set ns.du_phong = ns.du_phong + [loop.index0] %}
        {% else %}
          {% set st = expand(cb) | selectattr('entity_id', 'eq', cb) | first | default(none) %}
          {% if st is not none and st.state not in ['unavailable', 'unknown'] %}
            {% set tt = j.trang_thai | default([], true) %}
            {% set tt = [tt] if tt is string else tt %}
            {% set tt = tt | map('string') | list %}
            {% set ok = (tt | count == 0) or (st.state in tt) %}
            {% set ta = (j.thuoc_tinh | default('', true)) | string | trim %}
            {% if ok and ta != '' %}{% set ok = (st.attributes.get(ta) | string) == ((j.gia_tri | default('', true)) | string) %}{% endif %}
            {% if ok %}
              {% set ns.ung_vien = ns.ung_vien + [{'i': loop.index0, 't': st.last_changed.timestamp()}] %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% if ns.ung_vien | count == 0 %}{{ ns.du_phong | tojson }}
    {% elif cach_chon == 'tat_ca' %}{{ ns.ung_vien | map(attribute='i') | list | tojson }}
    {% elif cach_chon == 'dau_tien' %}{{ [ns.ung_vien | map(attribute='i') | min] | tojson }}
    {% else %}
      {% set ns2 = namespace(best=ns.ung_vien[0]) %}
      {% for u in ns.ung_vien %}{% if u.t > ns2.best.t %}{% set ns2.best = u %}{% endif %}{% endfor %}
      {{ [ns2.best.i] | tojson }}
    {% endif %}

triggers: !input nut_bam

actions:
  - alias: Chạy các việc đã chọn (theo cảm biến)
    repeat:
      for_each: "{{ chon }}"
      sequence:
        - variables:
            viec_dang_chay: "{{ viec[repeat.item] }}"
        - alias: "{{ 'Việc: ' ~ (viec_dang_chay.ten | default('không tên', true)) }}"
          repeat:
            for_each: "{{ viec_dang_chay.hanh_dong | default([], true) }}"
            sequence:
              - alias: Lời gọi dịch vụ của việc
                continue_on_error: true
                action: "{{ repeat.item.action | default(repeat.item.service, true) }}"
                data: >-
                  {{ (repeat.item.data | default({}, true)) | combine(repeat.item.target | default({}, true)) }}
  - alias: Không việc nào khớp - chạy việc dự phòng
    if:
      - condition: template
        value_template: "{{ chon | count == 0 }}"
    then: !input viec_du_phong
