variables:
  version: 20261114
  thiet_bi_r1: !input thiet_bi_r1
  cua_so_giay: !input cua_so_giay
  che_do_don: !input che_do_don
  che_do_doi: !input che_do_doi
  che_do_ba: !input che_do_ba
  che_do_giu: !input che_do_giu
  cu_chi_tho: >-
    {{ trigger.event.data.type if trigger.platform == 'event' and trigger.event.data.type is defined else (trigger.id | default('', true)) }}
  cu_chi: >-
    {% set m = {'don': 'don', 'single': 'don', '1': 'don', 'doi': 'doi', 'double': 'doi', '2': 'doi', 'ba': 'ba', 'triple': 'ba', '3': 'ba', 'giu': 'giu', 'hold': 'giu', 'long': 'giu'} %}
    {{ m.get(cu_chi_tho | string | lower, 'don') }}
  thuc_the_don_1: !input thuc_the_don_1
  trang_thai_don_1: !input trang_thai_don_1
  thuoc_tinh_don_1: !input thuoc_tinh_don_1
  gia_tri_don_1: !input gia_tri_don_1
  dieu_kien_don_1: !input dieu_kien_don_1
  thuc_the_don_2: !input thuc_the_don_2
  trang_thai_don_2: !input trang_thai_don_2
  thuoc_tinh_don_2: !input thuoc_tinh_don_2
  gia_tri_don_2: !input gia_tri_don_2
  dieu_kien_don_2: !input dieu_kien_don_2
  thuc_the_don_3: !input thuc_the_don_3
  trang_thai_don_3: !input trang_thai_don_3
  thuoc_tinh_don_3: !input thuoc_tinh_don_3
  gia_tri_don_3: !input gia_tri_don_3
  dieu_kien_don_3: !input dieu_kien_don_3
  thuc_the_don_4: !input thuc_the_don_4
  trang_thai_don_4: !input trang_thai_don_4
  thuoc_tinh_don_4: !input thuoc_tinh_don_4
  gia_tri_don_4: !input gia_tri_don_4
  dieu_kien_don_4: !input dieu_kien_don_4
  thuc_the_don_5: !input thuc_the_don_5
  trang_thai_don_5: !input trang_thai_don_5
  thuoc_tinh_don_5: !input thuoc_tinh_don_5
  gia_tri_don_5: !input gia_tri_don_5
  dieu_kien_don_5: !input dieu_kien_don_5
  thuc_the_don_6: !input thuc_the_don_6
  trang_thai_don_6: !input trang_thai_don_6
  thuoc_tinh_don_6: !input thuoc_tinh_don_6
  gia_tri_don_6: !input gia_tri_don_6
  dieu_kien_don_6: !input dieu_kien_don_6
  chon_don: >-
    {% set ns = namespace(l=[]) %}
    {% set dk_ok = (dieu_kien_don_1 | string | trim | lower) in ['', 'true', 'yes', 'on', '1'] %}{% set dk_co = (dieu_kien_don_1 | string | trim) != '' %}{% if thuc_the_don_1 != '' and trang_thai_don_1 | count > 0 %}{% set s = states[thuc_the_don_1] %}{% if s is not none and dk_ok and s.state in trang_thai_don_1 and (thuoc_tinh_don_1 == '' or (state_attr(thuc_the_don_1, thuoc_tinh_don_1) | string) == (gia_tri_don_1 | string)) %}{% set tm = s.last_updated if thuoc_tinh_don_1 != '' else s.last_changed %}{% if (now() - tm).total_seconds() <= cua_so_giay | float(30) %}{% set ns.l = ns.l + [{'i': 1, 't': tm.timestamp()}] %}{% endif %}{% endif %}{% elif thuc_the_don_1 == '' and dk_co and dk_ok %}{% set ns.l = ns.l + [{'i': 1, 't': 0}] %}{% endif %}
    {% set dk_ok = (dieu_kien_don_2 | string | trim | lower) in ['', 'true', 'yes', 'on', '1'] %}{% set dk_co = (dieu_kien_don_2 | string | trim) != '' %}{% if thuc_the_don_2 != '' and trang_thai_don_2 | count > 0 %}{% set s = states[thuc_the_don_2] %}{% if s is not none and dk_ok and s.state in trang_thai_don_2 and (thuoc_tinh_don_2 == '' or (state_attr(thuc_the_don_2, thuoc_tinh_don_2) | string) == (gia_tri_don_2 | string)) %}{% set tm = s.last_updated if thuoc_tinh_don_2 != '' else s.last_changed %}{% if (now() - tm).total_seconds() <= cua_so_giay | float(30) %}{% set ns.l = ns.l + [{'i': 2, 't': tm.timestamp()}] %}{% endif %}{% endif %}{% elif thuc_the_don_2 == '' and dk_co and dk_ok %}{% set ns.l = ns.l + [{'i': 2, 't': 0}] %}{% endif %}
