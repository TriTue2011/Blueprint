blueprint:
  name: Nút bấm nhiều việc - mỗi cử chỉ nhiều việc theo điều kiện (ưu tiên sự kiện gần nhất)
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/nut_bam_nhieu_viec.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: |
    **Một nút bấm, làm đúng việc đang cần** - hợp nhất «Một nút nhiều việc» và «Loa R1 nút giữa mọi cử chỉ». Dùng cho nút bất kỳ (Zigbee, Matter, ESPHome, nút ảo...) và cho nút giữa loa R1.

    - **Bốn cử chỉ**: nhấn đơn, nhấn đúp, nhấn ba lần, giữ. Mỗi cử chỉ có tối đa 6 «việc».
    - **Mỗi việc đi kèm điều kiện** nên không bị lẫn: một **thực thể + trạng thái** (và thuộc tính nếu cần) cho biết việc đang cần, cộng một **điều kiện mẫu** tuỳ chọn.
    - **Ưu tiên sự kiện gần nhất**: nhiều việc cùng đang cần thì làm việc có thực thể vừa đổi trạng thái MỚI NHẤT.
    - **Chỉ xét sự kiện trong N giây gần nhất** (mặc định 30 giây): sự kiện đã quá cũ thì nút không làm việc đó nữa (tránh nhấn nhầm vào chuyện đã xong từ lâu).
    - **Hành động mặc định** khi không việc nào đang cần; hoặc chọn chế độ **«Một việc»** để nút luôn làm đúng một việc, không xét sự kiện.

    **Nút bất kỳ:** thêm trigger vào ô «Khi nhấn nút» và đặt **ID của trigger** là `don`, `doi`, `ba` hoặc `giu` (không đặt ID = nhấn đơn). **Loa R1:** giữ trigger mặc định (sự kiện `r1_speaker_phim`) và chọn loa ở ô «Loa R1»; cử chỉ lấy từ chính sự kiện.

    <details>
    <summary><b>Ví dụ nhấn đơn trên loa R1:</b> - Nhấn để mở rộng</summary>

      - Việc 1: cảm biến «Trạng thái cuộc gọi» của Zalo Call, trạng thái `ringing`, thuộc tính `status` = `incoming` → *Nghe máy* (`zalo_call.answer_call`).
      - Việc 2: cùng cảm biến, trạng thái `active` → *Cúp máy* (`zalo_call.end_call`).
      - Việc 3: thực thể báo thức của loa, trạng thái `on` → *Tắt báo thức*.
      - Mặc định: *Gọi đi* (`zalo_call.make_call`).
      Báo thức kêu 19:00 rồi 19:02 có cuộc gọi đến, nhấn nút sẽ **nghe máy** (sự kiện gần nhất); không ai nhấn trong 30 giây thì cuộc gọi cũ không còn tranh việc nữa.

    </details>

    **Phiên bản: v.2026.11.14**
  input:
    nut:
      name: ① Nút bấm
      icon: mdi:gesture-tap-button
      input:
        nut_bam:
          name: Khi nhấn nút (trigger)
          description: >-
            Mặc định là sự kiện nút giữa loa R1 (`r1_speaker_phim`). Nút khác: xoá trigger này rồi thêm trigger của nút (sự kiện, trạng thái, thiết bị...) và đặt ID là `don`, `doi`, `ba` hoặc `giu`.
          default:
            - trigger: event
              event_type: r1_speaker_phim
              event_data: {}
          selector:
            trigger: {}
        thiet_bi_r1:
          name: Loa R1 (chỉ khi dùng sự kiện r1_speaker_phim)
          description: Chọn loa R1 để chỉ nhận nút của đúng loa này. Để trống = nhận từ mọi loa R1.
          default: ""
          selector:
            device:
              integration: r1_speaker
    gioi_han:
      name: ② Thời gian và độ ưu tiên
      icon: mdi:timer-sand
      input:
        cua_so_giay:
          name: Chỉ xét sự kiện trong vòng (giây)
          description: >-
            Việc có thực thể đổi trạng thái cách đây LÂU HƠN số giây này thì không được xét. Gợi ý 30 giây. Các việc không chọn thực thể (chỉ dùng điều kiện mẫu) không bị giới hạn thời gian và luôn xếp sau các việc có sự kiện.
          default: 30
          selector:
            number:
              min: 5
              max: 600
              step: 5
              unit_of_measurement: giây
              mode: box

    cu_chi_don:
      name: ③ Nhấn đơn
      icon: mdi:gesture-tap
      collapsed: false
      input:
        che_do_don:
          name: Chế độ
          description: >-
            «Theo sự kiện»: chọn việc đang cần nhất trong các việc bên dưới (ưu tiên sự kiện xảy ra gần nhất, trong khoảng thời gian đã đặt); không việc nào cần thì làm «hành động mặc định».
            «Một việc»: bỏ qua mọi sự kiện, luôn làm đúng «hành động mặc định» (nút chỉ có một nhiệm vụ).
          default: theo_su_kien
          selector:
            select:
              mode: dropdown
              options:
                - label: Theo sự kiện (nhiều việc, có ưu tiên)
                  value: theo_su_kien
                - label: Một việc (luôn làm hành động mặc định)
                  value: mot_viec
        mac_dinh_don:
          name: Hành động mặc định
          description: Làm khi không việc nào đang cần (hoặc khi chế độ là «Một việc»). Để trống = không làm gì.
          default: []
          selector:
            action: {}
        thuc_the_don_1:
          name: Việc 1 - thực thể cho biết «đang cần»
          description: >-
            Thực thể mà thay đổi của nó là «sự kiện» của việc này (báo thức, cảm biến cuộc gọi, hẹn giờ, chuông cửa, cảm biến...). Việc có sự kiện mới hơn được ưu tiên. Để trống nếu việc này chỉ dựa vào điều kiện mẫu bên dưới.
          default: ""
          selector:
            entity: {}
        trang_thai_don_1:
          name: Việc 1 - trạng thái nghĩa là đang cần
          description: Một hoặc nhiều trạng thái (ví dụ ringing, on, active). Để trống = bỏ qua việc này (trừ khi có điều kiện mẫu và không chọn thực thể).
          default: []
          selector:
            text:
              multiple: true
        thuoc_tinh_don_1:
          name: Việc 1 - thuộc tính cần khớp (tuỳ chọn)
          description: Tên thuộc tính của thực thể (ví dụ status). Để trống = chỉ xét trạng thái.
          default: ""
          selector:
            text: {}
        gia_tri_don_1:
          name: Việc 1 - giá trị thuộc tính cần khớp
          default: ""
          selector:
            text: {}
        dieu_kien_don_1:
          name: Việc 1 - điều kiện thêm (mẫu, tuỳ chọn)
          description: >-
            Biểu thức phải ĐÚNG thì việc này mới được xét, ví dụ `{{ is_state('person.tri', 'home') and now().hour < 22 }}`. Để trống = không thêm điều kiện.
          default: ""
          selector:
            template: {}
        hanh_dong_don_1:
          name: Việc 1 - hành động
          default: []
          selector:
            action: {}
        thuc_the_don_2:
          name: Việc 2 - thực thể cho biết «đang cần»
          description: >-
