    {% set dk_ok = (dieu_kien_giu_1 | string | trim | lower) in ['', 'true', 'yes', 'on', '1'] %}{% set dk_co = (dieu_kien_giu_1 | string | trim) != '' %}{% if thuc_the_giu_1 != '' and trang_thai_giu_1 | count > 0 %}{% set s = states[thuc_the_giu_1] %}{% if s is not none and dk_ok and s.state in trang_thai_giu_1 and (thuoc_tinh_giu_1 == '' or (state_attr(thuc_the_giu_1, thuoc_tinh_giu_1) | string) == (gia_tri_giu_1 | string)) %}{% set tm = s.last_updated if thuoc_tinh_giu_1 != '' else s.last_changed %}{% if (now() - tm).total_seconds() <= cua_so_giay | float(30) %}{% set ns.l = ns.l + [{'i': 1, 't': tm.timestamp()}] %}{% endif %}{% endif %}{% elif thuc_the_giu_1 == '' and dk_co and dk_ok %}{% set ns.l = ns.l + [{'i': 1, 't': 0}] %}{% endif %}
