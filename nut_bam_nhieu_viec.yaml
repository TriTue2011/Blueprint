    {% set dk_ok = (dieu_kien_giu_3 | string | trim | lower) in ['', 'true', 'yes', 'on', '1'] %}{% set dk_co = (dieu_kien_giu_3 | string | trim) != '' %}{% if thuc_the_giu_3 != '' and trang_thai_giu_3 | count > 0 %}{% set s = states[thuc_the_giu_3] %}{% if s is not none and dk_ok and s.state in trang_thai_giu_3 and (thuoc_tinh_giu_3 == '' or (state_attr(thuc_the_giu_3, thuoc_tinh_giu_3) | string) == (gia_tri_giu_3 | string)) %}{% set tm = s.last_updated if thuoc_tinh_giu_3 != '' else s.last_changed %}{% if (now() - tm).total_seconds() <= cua_so_giay | float(30) %}{% set ns.l = ns.l + [{'i': 3, 't': tm.timestamp()}] %}{% endif %}{% endif %}{% elif thuc_the_giu_3 == '' and dk_co and dk_ok %}{% set ns.l = ns.l + [{'i': 3, 't': 0}] %}{% endif %}
    {% set dk_ok = (dieu_kien_giu_4 | string | trim | lower) in ['', 'true', 'yes', 'on', '1'] %}{% set dk_co = (dieu_kien_giu_4 | string | trim) != '' %}{% if thuc_the_giu_4 != '' and trang_thai_giu_4 | count > 0 %}{% set s = states[thuc_the_giu_4] %}{% if s is not none and dk_ok and s.state in trang_thai_giu_4 and (thuoc_tinh_giu_4 == '' or (state_attr(thuc_the_giu_4, thuoc_tinh_giu_4) | string) == (gia_tri_giu_4 | string)) %}{% set tm = s.last_updated if thuoc_tinh_giu_4 != '' else s.last_changed %}{% if (now() - tm).total_seconds() <= cua_so_giay | float(30) %}{% set ns.l = ns.l + [{'i': 4, 't': tm.timestamp()}] %}{% endif %}{% endif %}{% elif thuc_the_giu_4 == '' and dk_co and dk_ok %}{% set ns.l = ns.l + [{'i': 4, 't': 0}] %}{% endif %}
    {% set dk_ok = (dieu_kien_giu_5 | string | trim | lower) in ['', 'true', 'yes', 'on', '1'] %}{% set dk_co = (dieu_kien_giu_5 | string | trim) != '' %}{% if thuc_the_giu_5 != '' and trang_thai_giu_5 | count > 0 %}{% set s = states[thuc_the_giu_5] %}{% if s is not none and dk_ok and s.state in trang_thai_giu_5 and (thuoc_tinh_giu_5 == '' or (state_attr(thuc_the_giu_5, thuoc_tinh_giu_5) | string) == (gia_tri_giu_5 | string)) %}{% set tm = s.last_updated if thuoc_tinh_giu_5 != '' else s.last_changed %}{% if (now() - tm).total_seconds() <= cua_so_giay | float(30) %}{% set ns.l = ns.l + [{'i': 5, 't': tm.timestamp()}] %}{% endif %}{% endif %}{% elif thuc_the_giu_5 == '' and dk_co and dk_ok %}{% set ns.l = ns.l + [{'i': 5, 't': 0}] %}{% endif %}
