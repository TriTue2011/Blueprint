blueprint:
  name: Universal Cooldown Recovery
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/universal_cooldown_recovery.yaml
  description: >
    Khi entity chuyển trạng thái theo cấu hình sẽ bắt đầu Timer Helper.
    Khi timer kết thúc sẽ thực hiện các action được cấu hình.

  domain: automation

  homeassistant:
    min_version: 2024.10.0

  input:

    trigger_entity:
      name: Trigger Entity
      selector:
        entity: {}

    from_state:
      name: From State
      default: "on"
      selector:
        text: {}

    to_state:
      name: To State
      default: "off"
      selector:
        text: {}

    timer_entity:
      name: Timer Helper
      selector:
        entity:
          filter:
            - domain: timer

    finish_actions:
      name: Actions When Finished
      selector:
        action: {}

mode: single

variables:
  timer_entity: !input timer_entity

trigger:

  - id: start_timer
    trigger: state
    entity_id: !input trigger_entity
    from: !input from_state
    to: !input to_state

  - id: timer_finished
    trigger: event
    event_type: timer.finished

action:

  - choose:

      - conditions:
          - condition: trigger
            id: start_timer

        sequence:

          - action: timer.start
            target:
              entity_id: !input timer_entity

      - conditions:
          - condition: trigger
            id: timer_finished

          - condition: template
            value_template: >
              {{ trigger.event.data.entity_id == timer_entity }}

        sequence: !input finish_actions
