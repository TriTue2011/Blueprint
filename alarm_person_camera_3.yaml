blueprint:
  name: Cảnh báo camera AI
  author: TriTue2011
  homeassistant:
    min_version: 2026.3.0
  description: >
    Phân tích sự kiện camera bằng AI Task (Structured Output) HOẶC JSON (OpenAI/raw).
    Gửi thông báo với ảnh và phân tích AI qua điện thoại, Telegram, Zalo và TTS ra loa.

    <details>
    <summary><b>Chi tiết:</b> - Nhấn để mở rộng</summary>

      **Phiên bản: v.2026.08.18 - Security Mode + Trigger Confirmation + Multi-Image Send**

      **Tác giả gốc: TriTue2011**

      **Tính năng:**

        1- **Hai chế độ AI:** Structured Output (HA native ai_task) hoặc JSON (OpenAI/raw JSON response).

        2- **8 trường hợp prompt đầy đủ:** JSON×4 + Structured×4 (humans / animals / both / security).

        3- **Gửi thông báo ngay lập tức** với ảnh, sau đó cập nhật kết quả phân tích AI (2 bước).

        4- **Hỗ trợ đa nền tảng:** Mobile App (Android/iOS), Telegram, Zalo Bot (Pyscript), Zalo Custom Integration, TTS ra loa.

        5- **Phát hiện người và/hoặc động vật** (chó, mèo, chim) — lọc báo động ảo.

        6- **Tùy chọn chờ người** bằng occupancy sensor trước khi phân tích.

        7- **Cooldown** để tránh spam thông báo.

        8- **continue_on_error** cho tất cả action gửi thông báo (HA 2026.3+).

        9- **Gửi nhiều ảnh theo từng kênh** — Mobile App, Telegram, Zalo Bot và Zalo Custom.

        10- **MỚI: Trigger Confirmation** — tùy chọn chờ một khoảng thời gian rồi kiểm tra lại sensor đã kích hoạt và toàn bộ Run Conditions trước khi chụp ảnh.

        11- **MỚI: Security AI mode** — đếm người, mô tả hành động và đánh giá hành vi có khả nghi về an ninh hay không; tối ưu cho hành lang/cửa căn hộ chung cư và cổng/sân/hiên nhà riêng.

      **Thay đổi so với phiên bản cũ:**
        - **MỚI:** Thêm công tắc "Gửi tất cả ảnh chụp cùng lúc" trong mục Camera & Snapshot Settings. Mặc định TẮT để giữ nguyên hành vi cũ (chỉ gửi ảnh đầu tiên).
        - Prompt JSON/Structured: chuyển toàn bộ prompt sang tiếng Anh, tối ưu cho chuỗi ảnh và thêm nhánh security; nội dung thông báo AI vẫn trả về tiếng Việt có dấu.
        - Prompt Structured: Tách riên 3 nhánh, bổ sung hướng di chuyển (đi vào/đi ra/ngang), cảnh báo vật nguy hiểm, ghi chú phương tiện.
        - ai_structure_description_humans và animals đồng bộ hoàn toàn theo detect_subjects.
        - Chuỗi fallback khớp chính xác với bộ lọc filter phrases.

    </details>

    <details>
    <summary><b>⚙️ Yêu cầu cấu hình:</b> - Nhấn để mở rộng</summary>

      **Thêm vào `configuration.yaml` để HA nhận diện đúng thư mục media:**

      ```yaml
      homeassistant:
        media_dirs:
          local: /media
      ```

      ⚠️ Nếu thiếu dòng này, AI Task và mobile notification có thể không truy cập được ảnh.

    </details>

  domain: automation
  source_url: https://raw.githubusercontent.com/TriTue2011/Blueprint/main/alarm_person_camera_3.yaml

  input:

    # ============================================================
    # TRIGGER SETTINGS
    # ============================================================
    trigger_section:
      name: Trigger Settings
      icon: mdi:play-circle
      collapsed: true
      input:
        trigger_sensor:
          name: 🚶 Trigger Sensor
          description: |
            👉 Cảm biến kích hoạt automation (cửa, motion sensor).
            ✅ Có thể chọn nhiều sensor cùng lúc.
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: true

        trigger_from_state:
          name: 🔄 Trigger From State
          description: Trạng thái ban đầu của cảm biến trước khi kích hoạt.
          default: "off"
          selector:
            select:
              options: ["off", "on"]
              custom_value: true
              multiple: false

        trigger_to_state:
          name: 🔄 Trigger To State
          description: Trạng thái mà cảm biến chuyển sang để kích hoạt automation.
          default: "on"
          selector:
            select:
              options: ["on", "off"]
              custom_value: true
              multiple: false

        enable_trigger_confirmation:
          name: ✅ Trigger Confirmation (Optional)
          description: |
            👉 Bật để chờ một khoảng thời gian sau khi Trigger + Run Conditions ban đầu đã đạt.
            ✅ Hết thời gian chờ, blueprint kiểm tra lại sensor VỪA kích hoạt và toàn bộ Run Conditions.
            ⚠️ Nếu sensor không còn ở Trigger To State hoặc Run Conditions không còn đúng, lần chạy sẽ dừng.
          default: false
          selector:
            boolean: {}

        trigger_confirmation_time:
          name: ⏱️ Trigger Confirmation Time
          description: |
            👉 Số giây chờ trước khi kiểm tra lại Trigger + Run Conditions.
            ✅ Hữu ích để lọc trigger chớp nhanh / rung / motion thoáng qua.
            ⚠️ 0 giây = kiểm tra lại ngay.
          default: 3
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: seconds
              mode: box

        person_occupancy_sensor:
          name: 🧍 Person Occupancy Sensor (Optional)
          description: |
            👉 Sensor phát hiện người (ví dụ: mmWave, PIR zone).
            ⚠️ Dùng kết hợp với "Wait for Person Detection" bên dưới.
            ✅ Nếu không dùng, bỏ trống.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: false

        person_detected_state:
          name: 🔎 Person Detected State
          description: Trạng thái của sensor khi phát hiện có người.
          default: "on"
          selector:
            select:
              options: ["on", "off"]
              custom_value: true
              multiple: false

        wait_for_person:
          name: ⏳ Wait for Person Detection
          description: |
            👉 Bật để đợi sensor phát hiện người TRƯỚC KHI chụp ảnh và phân tích.
            ✅ Giúp giảm ảnh chụp khi chưa có người trong khung hình.
          default: false
          selector:
            boolean: {}

        max_wait_time:
          name: ⌛ Maximum Wait Time (Optional)
          description: |
            👉 Thời gian tối đa (giây) để đợi phát hiện người.
            ⚠️ Đặt 0 = chờ không giới hạn cho đến khi phát hiện người.
          default: 0
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
              mode: box
              step: 1

    # ============================================================
    # GLOBAL CONDITIONS
    # ============================================================
    run_conditions:
      name: 🛠️ Run Conditions
      description: |
        👉 Thêm Condition để chạy Automation.
        ⚠️ Tất cả điều kiện phải đúng thì automation mới chạy.
      default: []
      selector:
        condition: {}

    # ============================================================
    # COOLDOWN
    # ============================================================
    cooldown:
      name: ⏱️ Cooldown
      description: |
        👉 Thời gian chờ SAU KHI automation chạy xong trước khi có thể chạy lại.
        ✅ Giúp tránh spam thông báo khi sensor liên tục kích hoạt.
      default:
        minutes: 10
      selector:
        duration: {}

    # ============================================================
    # CAMERA & SNAPSHOT SETTINGS
    # ============================================================
    camera_sensor_section:
      name: Camera & Snapshot Settings
      icon: mdi:camera
      collapsed: true
      input:
        camera_entities:
          name: 📸 Camera Entities
          description: |
            👉 Danh sách camera để giám sát.
            ⚠️ Hiện tại chỉ sử dụng camera đầu tiên trong danh sách để chụp ảnh.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera

        num_snapshots:
          name: ⌛ Number of Snapshots
          description: |
            👉 Số ảnh sẽ chụp liên tiếp để so sánh và gửi cho AI phân tích.
            ✅ Nhiều ảnh giúp AI phân tích chính xác hơn nhưng mất nhiều thời gian hơn.
          default: 3
          selector:
            number:
              min: 1
              max: 5
              step: 1
              unit_of_measurement: snapshots
              mode: slider

        num_delay_before_snapshot:
          name: ⌛ Delay Before First Snapshot
          description: |
            👉 Thời gian chờ (giây) TRƯỚC KHI chụp ảnh đầu tiên.
            ✅ Giúp camera ổn định sau khi trigger kích hoạt.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

        num_delay:
          name: ⌛ Delay Between Snapshots
          description: |
            👉 Thời gian trễ (giây) GIỮA các lần chụp ảnh.
            ✅ Giúp chụp được ảnh ở các thời điểm khác nhau để AI so sánh.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

        overwrite_image:
          name: 🏞️ Overwrite Image (Optional)
          description: |
            👉 Bật để ghi đè ảnh cũ bằng ảnh mới (tiết kiệm dung lượng).
            ⚠️ Tắt sẽ lưu nhiều ảnh riêng biệt theo context.id — tốn dung lượng.
            ✅ Ảnh luôn được lưu vào /media/snapshots/ (Media Folder, bảo mật).
          default: true
          selector:
            boolean: {}

        send_all_snapshots:
          name: 🖼️ [KHÔNG CÒN DÙNG] Gửi tất cả ảnh chụp cùng lúc
          description: |
            👉 Bật để gửi TOÀN BỘ các ảnh đã chụp (thay vì chỉ ảnh đầu tiên) ngay ở bước gửi ảnh ban đầu.
            ✅ Mobile App & Telegram & Zalo Bot (Pyscript): mỗi ảnh sẽ được gửi thành 1 thông báo/tin nhắn riêng biệt, đánh số thứ tự.
            ✅ Zalo Custom Integration: tất cả ảnh sẽ được gộp gửi chung trong 1 tin nhắn (tích hợp tự động xử lý khi nhận nhiều đường dẫn ảnh).
            ⚠️ KHÔNG CÒN DÙNG — mỗi kênh giờ có công tắc RIÊNG trong section của
            kênh đó, vì trần mỗi kênh khác nhau: Zalo cá nhân gộp 1 album tới 50
            ảnh, Telegram tối đa 10 ảnh/album, Zalo Bot không có album (mỗi ảnh 1
            tin), Mobile App mỗi thông báo 1 ảnh. Một công tắc chung không diễn
            tả được khác biệt đó. Giữ ô này để automation cũ không vỡ.
          default: false
          selector:
            boolean: {}

    # ============================================================
    # AI TASK SETTINGS
    # ============================================================
    ai_task_section:
      name: AI Task Settings
      icon: mdi:brain
      collapsed: true
      input:
        ai_powered:
          name: ✅ AI-powered (Optional)
          description: |
            👉 Bật để dùng AI phân tích ảnh trước khi gửi thông báo.
            ⚠️ Nếu tắt, sẽ gửi thông báo ngay khi phát hiện chuyển động mà không phân tích.
            ✅ Khuyến nghị bật để lọc báo động ảo.
          default: true
          selector:
            boolean: {}

        ai_mode:
          name: 🤖 AI Output Mode
          description: |
            👉 Chọn cách AI trả về kết quả phân tích ảnh.
            ✅ Structured Output: dùng ai_task native của HA (khuyến nghị, ổn định hơn).
            ✅ JSON: dùng cho OpenAI hoặc AI trả về raw JSON — cần parse thủ công.
            ⚠️ Nếu chọn JSON, hãy đảm bảo AI provider hỗ trợ trả về đúng định dạng JSON.
          default: structured
          selector:
            select:
              options:
                - label: Structured Output (HA Native - Khuyến nghị)
                  value: structured
                - label: JSON (OpenAI / Raw JSON)
                  value: json
              multiple: false

        detect_subjects:
          name: 🔍 Phát hiện đối tượng
          description: |
            👉 Chọn loại đối tượng / mục tiêu AI muốn phân tích.
            ✅ Chỉ người: đếm và mô tả người.
            ✅ Chỉ động vật: đếm và mô tả động vật.
            ✅ Cả hai: phân tích người và động vật.
            ✅ An ninh: chỉ cần số người, hành động đang làm và có khả nghi về an ninh hay không.
            ⚠️ Chế độ An ninh được tối ưu cho cả chung cư và nhà riêng.
          default: humans
          selector:
            select:
              options:
                - label: 👤 Chỉ phát hiện người
                  value: humans
                - label: 🐾 Chỉ phát hiện động vật (chó, mèo, chim)
                  value: animals
                - label: 👤🐾 Phát hiện cả người và động vật
                  value: both
                - label: 🛡️ Phân tích an ninh
                  value: security
              multiple: false

        ai_provider:
          name: 🤖 AI Task Provider
          description: |
            👉 Chọn AI Task provider để phân tích ảnh.
            ✅ Bỏ trống để dùng AI provider mặc định của hệ thống (HA 2025.7+).
          default: []
          selector:
            entity:
              domain: ai_task
              multiple: false

    # ============================================================
    # MOBILE APP NOTIFY SETTINGS
    # ============================================================
    notification_section:
      name: Mobile App Notify Settings
      icon: mdi:bell
      collapsed: true
      input:
        include_notify:
          name: ✅ Mobile App Notify Option (Optional)
          description: |
            👉 Bật nếu muốn gửi thông báo lên điện thoại đã cài HA Companion App.
          default: false
          selector:
            boolean: {}

        is_ios_android:
          name: 🔔 Android or iOS device?
          description: |
            👉 Chọn hệ điều hành của điện thoại nhận thông báo.
          default: android_device
          selector:
            select:
              options:
                - label: Android
                  value: android_device
                - label: iOS
                  value: ios_device
              multiple: false

        notify_device:
          name: 📱 Devices Notified
          description: |
            👉 Chọn điện thoại muốn nhận thông báo đẩy.
            ✅ Có thể chọn nhiều điện thoại.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

        notify_title:
          name: 📝 Title
          description: |
            👉 Tiêu đề của thông báo.
          default: "🔔 <b><span style=\"color: red\">Có chuyển động</span></b>\n"
          selector:
            text: {}

        tap_navigate:
          name: 📲 Tap Navigate
          description: |
            👉 Mở HA và đi đến vị trí này khi nhấn vào thông báo.
          default: /lovelace/camera
          selector:
            text: {}

        status_bar_icon:
          name: 🌠 Status Bar Icon (Android)
          description: |
            👉 Dành cho Android - Thiết lập icon cho thông báo trên Status Bar.
          default: mdi:motion-sensor
          selector:
            icon: {}

        notification_color:
          name: 🎨 Notification Color (Android)
          description: 👉 Dành cho Android - Màu của icon thông báo trên Status Bar.
          default: [255, 0, 0]
          selector:
            color_rgb: {}

        mobile_send_all_images:
          name: 🖼️ Mobile App — gửi tất cả ảnh (từng thông báo riêng)
          description: >
            Thông báo Android/iOS chỉ đính kèm được MỘT ảnh, nên bật là nhận N
            thông báo. TẮT: chỉ 1 thông báo với ảnh đầu.
          default: false
          selector:
            boolean: {}

        notification_time:
          name: 🕒 Notification Time
          description: 👉 Tùy chọn hiển thị thời gian trong nội dung thông báo.
          default: ""
          selector:
            select:
              options:
                - label: No Time Added
                  value: ""
                - label: 12 Hour
                  value: "at {{ now().strftime('%-I:%M %p') }}"
                - label: 24 Hour
                  value: "at {{ now().strftime('%H:%M') }}"
              multiple: false

    # ============================================================
    # TELEGRAM SETTINGS
    # ============================================================
    telegram_section:
      name: Telegram Settings
      icon: mdi:send
      collapsed: true
      input:
        include_telegram_notify:
          name: ✅ Telegram Option (Optional)
          description: |
            👉 Bật nếu muốn gửi thông báo lên Telegram.
          default: false
          selector:
            boolean: {}

        telegram_config_entry:
          name: 🤖 Telegram Bot
          description: 👉 Chọn Telegram Bot đã cấu hình trong HA.
          default: ""
          selector:
            config_entry:
              integration: telegram_bot

        telegram_target:
          name: 🧑‍💻 Target Chat ID
          description: |
            👉 Chat ID của người hoặc nhóm nhận thông báo.
            ✅ Bỏ trống để dùng chat ID mặc định của bot.
          default: ""
          selector:
            text: {}

        telegram_thread_id:
          name: 🧵 Thread ID (Optional)
          description: |
            👉 ID của chủ đề trong nhóm Telegram (nếu dùng nhóm có topic).
            ✅ Bỏ trống nếu không dùng topic.
          default: ""
          selector:
            text: {}

        telegram_send_all_images:
          name: 🖼️ Telegram — gửi tất cả ảnh (Album)
          description: >
            BẬT: gộp thành MỘT album (media group). Telegram chỉ nhận tối đa 10
            ảnh mỗi album nên ảnh thứ 11 trở đi bị bỏ.
            TẮT: chỉ gửi 1 ảnh đầu.
          default: false
          selector:
            boolean: {}

        telegram_initial_caption:
          name: 📝 Initial Caption
          description: 👉 Caption gửi kèm ảnh ban đầu (trước khi có kết quả AI).
          default: "🔔 Phát hiện chuyển động!"
          selector:
            text: {}

    # ============================================================
    # ZALO BOT SETTINGS (PYSCRIPT)
    # ============================================================
    zalo_bot_section:
      name: Zalo Bot Settings (Pyscript)
      icon: mdi:chat
      collapsed: true
      input:
        enable_zalo_bot:
          name: ✅ Enable Zalo Bot (Pyscript)
          description: |
            👉 Bật/tắt gửi thông báo qua Zalo Bot dùng Pyscript.
          default: false
          selector:
            boolean: {}

        zalo_bot_chat_id:
          name: 🧑‍💻 Zalo Bot Chat ID
          description: 👉 Chat ID hoặc User ID nhận thông báo Zalo Bot qua Pyscript.
          default: ""
          selector:
            text: {}

        zalo_bot_send_all_images:
          name: 🖼️ Zalo Bot — gửi tất cả ảnh (từng tin riêng)
          description: >
            Zalo Bot API KHÔNG có album — mỗi ảnh là MỘT TIN RIÊNG. Bật với 3 ảnh
            là nhận 3 tin. TẮT: chỉ gửi 1 ảnh đầu.
          default: false
          selector:
            boolean: {}

        zalo_bot_initial_caption:
          name: 📝 Zalo Bot Initial Caption
          description: 👉 Caption khi gửi ảnh ban đầu qua Zalo Bot.
          default: "🔔 Phát hiện chuyển động!"
          selector:
            text: {}

    # ============================================================
    # ZALO CUSTOM INTEGRATION SETTINGS
    # ============================================================
    zalo_custom_section:
      name: Zalo Custom Integration Settings
      icon: mdi:chat-processing
      collapsed: true
      input:
        enable_zalo_custom:
          name: ✅ Enable Zalo Custom Integration
          description: |
            👉 Bật/tắt gửi thông báo qua Zalo Custom Integration (zalo_bot).
          default: false
          selector:
            boolean: {}

        zalo_custom_account:
          name: 📱 Zalo Account
          description: |
            👉 Số điện thoại tài khoản Zalo dùng để gửi tin nhắn.
            ⚠️ Ví dụ: +84376861184
          default: ""
          selector:
            text: {}

        zalo_custom_thread_id:
          name: 💬 Thread ID (Nhóm)
          description: |
            👉 ID của nhóm Zalo muốn gửi thông báo.
            ⚠️ Nhập dạng text để tránh mất độ chính xác với số lớn.
            ⚠️ Chỉ dùng khi Receiver Type = Group.
          default: ""
          selector:
            text:
              multiple: false

        zalo_custom_user_id:
          name: 👤 User ID (Cá nhân)
          description: |
            👉 ID của người nhận Zalo.
            ⚠️ Nhập dạng text để tránh mất độ chính xác với số lớn.
            ⚠️ Chỉ dùng khi Receiver Type = User.
          default: ""
          selector:
            text:
              multiple: false

        zalo_custom_receiver_type:
          name: 👥 Type of Receiver
          description: |
            👉 Loại người nhận tin nhắn Zalo.
          default: "0"
          selector:
            select:
              options:
                - label: User (Cá nhân)
                  value: "0"
                - label: Group (Nhóm)
                  value: "1"
              multiple: false

        zalo_custom_send_all_images:
          name: 🖼️ Zalo cá nhân — gửi tất cả ảnh (Album)
          description: >
            BẬT: gộp TOÀN BỘ ảnh thành 1 ALBUM trong MỘT tin (giới hạn thật của
            phiên Zalo là 50 ảnh/tin). Chú thích sẽ đi thành một tin chữ riêng
            TRƯỚC album, vì service gửi nhiều ảnh không có tham số caption.
            TẮT: chỉ gửi 1 ảnh đầu kèm chú thích như cũ.
          default: false
          selector:
            boolean: {}

        zalo_custom_ttl:
          name: ⏳ Message TTL
          description: |
            👉 Thời gian tự động thu hồi tin nhắn (milliseconds).
            ✅ Đặt 0 = không thu hồi. Tối đa 86400000ms = 24 giờ.
          default: 0
          selector:
            number:
              min: 0
              max: 86400000
              step: 1000
              mode: box

        zalo_custom_initial_caption:
          name: 📝 Initial Caption
          description: 👉 Nội dung tin nhắn ban đầu gửi kèm ảnh qua Zalo Custom.
          default: "🔔 Phát hiện chuyển động!"
          selector:
            text:
              multiline: true

    # ============================================================
    # TTS SPEAKER SETTINGS
    # ============================================================
    tts_speaker_section:
      name: TTS Speaker Settings
      icon: mdi:speaker
      collapsed: true
      input:
        include_tts_announcement:
          name: ✅ Use TTS Announcement (Optional)
          description: |
            👉 Bật để phát thông báo bằng giọng nói ra loa được tích hợp HA.
          default: false
          selector:
            boolean: {}

        num_volume_speaker:
          name: 🔊 Volume Set
          description: |
            👉 Thiết lập âm lượng cho loa (từ 0.1 đến 1.0).
            ✅ Mặc định: 0.5 (50%).
          default: 0.5
          selector:
            number:
              min: 0.1
              max: 1.0
              step: 0.1
              mode: slider

        text_to_speech_engine:
          name: 🗣️ Text-to-Speech Service Provider
          description: 👉 Chọn dịch vụ TTS hỗ trợ trong HA.
          default: []
          selector:
            entity:
              filter:
                - domain: tts
              multiple: false

        media_player:
          name: 🎶 Media Player
          description: |
            👉 Chọn loa để phát thông báo giọng nói.
            ✅ Có thể chọn nhiều loa cùng lúc.
          default: []
          selector:
            entity:
              filter:
                - domain: media_player
              multiple: true

    # ============================================================
    # DELAY SETTINGS
    # ============================================================
    delay_settings:
      name: Delay Settings
      icon: mdi:clock-start
      collapsed: true
      input:
        num_delay_actions:
          name: ⌛ Delays
          description: |
            👉 Thời gian chờ (giây) sau khi hoàn thành tất cả các hành động.
          default: 10
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: seconds
              mode: slider

# ============================================================
# VARIABLES
# ============================================================
variables:
  trigger_sensor: !input trigger_sensor
  trigger_to_state: !input trigger_to_state
  enable_trigger_confirmation: !input enable_trigger_confirmation
  trigger_confirmation_time: !input trigger_confirmation_time
  person_sensor: !input person_occupancy_sensor
  person_detected_state: !input person_detected_state
  wait_for_person: !input wait_for_person
  max_wait_time: !input max_wait_time
  cooldown: !input cooldown

  # Camera
  camera_entities_list: !input camera_entities
  camera_entity: "{{ camera_entities_list[0] if camera_entities_list else '' }}"
  camera_name: '{{ state_attr(camera_entity, "friendly_name") | default(camera_entity) }}'
  camera_file_path: '{{ camera_entity.replace("camera.", "") }}'

  # Snapshot
  num_snapshots: !input num_snapshots
  num_delay_before_snapshot: !input num_delay_before_snapshot
  num_delay: !input num_delay
  overwrite_image: !input overwrite_image
  send_all_snapshots: !input send_all_snapshots
  # Công tắc nhiều ảnh RIÊNG từng kênh — trần mỗi kênh khác nhau nên không dùng
  # chung một cờ được (xem mô tả từng input).
  telegram_send_all_images: !input telegram_send_all_images
  zalo_bot_send_all_images: !input zalo_bot_send_all_images
  zalo_custom_send_all_images: !input zalo_custom_send_all_images
  mobile_send_all_images: !input mobile_send_all_images

  # AI
  ai_powered: !input ai_powered
  ai_mode: !input ai_mode
  ai_provider: !input ai_provider
  detect_subjects: !input detect_subjects

  # ============================================================
  # AI PROMPTS - 8 CASES, ENGLISH INSTRUCTIONS / VIETNAMESE OUTPUT
  # ============================================================
  # JSON: humans / animals / both / security
  # Structured: humans / animals / both / security
  # Prompts are written in English for consistency, while all user-facing
  # descriptions are explicitly requested in Vietnamese with full diacritics.
  # ============================================================
  ai_task_instructions: >
    {% if ai_mode == 'json' %}

      {# ============================================================ #}
      {# CASE 1: JSON — HUMANS ONLY                                  #}
      {# ============================================================ #}
      {% if detect_subjects == 'humans' %}
    You are analyzing a chronological sequence of images from a home security camera.
    Analyze HUMANS ONLY. Ignore animals unless needed to understand a person's action.
    Use the scene context only when useful: the camera may face an apartment/condominium hallway, lobby or unit entrance, or a detached-house porch, gate, driveway, yard or doorway.

    Return raw JSON only, with exactly this shape:
    {"humans_detected":0,"humans_detected_summary":"","humans_detected_description":""}

    Field rules:
    humans_detected: integer. Count DISTINCT people visible across the sequence. Do not count the same person again in multiple frames. Return 0 if no person is visible.
    humans_detected_summary: concise Vietnamese summary of the people, for example "1 phụ nữ, 2 trẻ em". Use apparent adult/child and apparent gender only when visually clear. Return an empty string if no person is visible.
    humans_detected_description: concise but informative Vietnamese description of each person's observable appearance and behavior:
      - adult or child, and apparent gender only when visually clear;
      - clothing type and prominent colors;
      - current action and any clearly visible object being carried or held;
      - if a clearly visible dangerous object such as a knife, firearm or club is being held, state this clearly without guessing intent;
      - movement across the sequence: approaching the camera/entry area, moving away, moving laterally, standing still, or turning back. Only say a person is entering or leaving a home when an actual doorway/gate crossing is visually supported.
    If humans_detected = 0, humans_detected_description MUST be exactly: "Đã phát hiện chuyển động tuy nhiên không có người trong chuỗi ảnh khi so sánh".

    Output rules:
    - All user-facing text values MUST be natural Vietnamese with full diacritics.
    - Base claims only on visible evidence from the image sequence. Do not identify people or infer occupation, relationship, ethnicity, health, criminal intent, or other unsupported attributes.
    - Return raw JSON only. No markdown, no code fences, no extra text.
    - The JSON must be on one line.

      {# ============================================================ #}
      {# CASE 2: JSON — ANIMALS ONLY                                 #}
      {# ============================================================ #}
      {% elif detect_subjects == 'animals' %}
    You are analyzing a chronological sequence of images from a home security camera.
    Analyze ANIMALS ONLY. The camera may face a shared apartment corridor/lobby or a detached-house porch, gate, driveway, yard or doorway.

    Return raw JSON only, with exactly this shape:
    {"animals_detected":0,"animals_detected_summary":"","animals_detected_description":""}

    Field rules:
    animals_detected: integer. Count DISTINCT animals visible across the sequence. Do not count the same animal again in multiple frames. Return 0 if none are visible.
    animals_detected_summary: concise Vietnamese summary by species and visible color, for example "1 con chó vàng, 2 con mèo đen". Return an empty string if none are visible.
    animals_detected_description: concise Vietnamese description of each animal: species, visible color/markings, relative size, observable action, and movement across the sequence (approaching, moving away, moving laterally, standing/sitting/lying still).
    If animals_detected = 0, animals_detected_description MUST be exactly: "Đã phát hiện chuyển động tuy nhiên không có động vật trong chuỗi ảnh khi so sánh".

    Output rules:
    - All user-facing text values MUST be natural Vietnamese with full diacritics.
    - Use only visible evidence. Do not invent species/breed details that are not clear.
    - Return raw JSON only. No markdown, no code fences, no extra text.
    - The JSON must be on one line.

      {# ============================================================ #}
      {# CASE 3: JSON — HUMANS + ANIMALS                             #}
      {# ============================================================ #}
      {% elif detect_subjects == 'both' %}
    You are analyzing a chronological sequence of images from a home security camera.
    Analyze HUMANS and ANIMALS. Use scene context only when useful: an apartment/condominium hallway, lobby or unit entrance, or a detached-house porch, gate, driveway, yard or doorway.

    Return raw JSON only, with exactly this shape:
    {"humans_detected":0,"humans_detected_summary":"","humans_detected_description":"","animals_detected":0,"animals_detected_summary":"","animals_detected_description":""}

    Count DISTINCT people and DISTINCT animals across the sequence; do not count the same subject again in repeated frames.

    humans_detected_summary: concise Vietnamese count summary.
    humans_detected_description: concise Vietnamese description of people, clothing, observable action, clearly visible held objects, and movement across frames. Clearly mention a visible dangerous object without guessing intent. Only describe entering/leaving a residence if a doorway/gate crossing is visually supported.
    If humans_detected = 0, humans_detected_description MUST be exactly: "Đã phát hiện chuyển động tuy nhiên không có người trong chuỗi ảnh khi so sánh".

    animals_detected_summary: concise Vietnamese count summary by species/color.
    animals_detected_description: concise Vietnamese description of species, color/markings, relative size, action and movement across frames.
    If animals_detected = 0, animals_detected_description MUST be exactly: "Đã phát hiện chuyển động tuy nhiên không có động vật trong chuỗi ảnh khi so sánh".

    If a vehicle is visibly involved with a person, you may briefly mention its type and visible color in humans_detected_description. If a vehicle appears without a person, mention it only if it materially explains the observed movement; do not treat it as a counted animal or human.

    Output rules:
    - All user-facing text values MUST be natural Vietnamese with full diacritics.
    - Use only visible evidence and avoid unsupported identity or intent claims.
    - Return raw JSON only. No markdown, no code fences, no extra text.
    - The JSON must be on one line.

      {# ============================================================ #}
      {# CASE 4: JSON — SECURITY                                     #}
      {# ============================================================ #}
      {% else %}
    You are a computer-vision assistant for a residential security camera. Analyze the ENTIRE chronological image sequence, focusing only on: HOW MANY PEOPLE are present, WHAT THEY ARE DOING, and WHETHER THE OBSERVED BEHAVIOR IS SECURITY-SUSPICIOUS.

    Return raw JSON only, with exactly this shape:
    {"humans_detected":0,"human_action":"","security_suspicious":false}

    Field rules:
    humans_detected: integer. Count DISTINCT people visible across the sequence. Do not count the same person again across frames. Return 0 if no person is visible.
    human_action: one concise Vietnamese description of the observable actions and movement of the people across the sequence. Describe what they actually do, such as passing by, approaching, leaving, waiting, returning, pacing, looking around repeatedly, looking toward a door/window, delivering or collecting an item, touching/testing a door or gate, manipulating a lock, handling property, climbing, or carrying a clearly visible dangerous object.
    security_suspicious: boolean. Set true ONLY when the sequence contains observable behavior that reasonably warrants security attention; otherwise false.

    CONTEXT-AWARE SECURITY RULES:
    - Apartment/condominium: shared corridors, elevator lobbies and common entrances naturally contain neighbors, visitors, delivery activity and ordinary pass-through traffic. Passing, briefly waiting, looking at a unit number/door, using the elevator, or making a normal delivery is NOT suspicious by itself.
    - Detached/private house: sidewalks and streets outside the property naturally contain passersby. Briefly approaching a gate/door, waiting, calling at the door, delivering an item, or normally entering/leaving is NOT suspicious by itself.
    - Suspicion should come from observable behavior and progression across frames, especially repeated or combined actions: prolonged/repeated loitering near the same entrance; repeatedly returning; repeatedly inspecting a specific door, window, lock or interior; deliberately testing/pulling/pushing a door/gate/handle; manipulating a lock; reaching through an opening; entering/climbing into a clearly private or restricted area in an unusual manner; tampering with or taking property; deliberate concealment/evasion combined with other concerning actions; threatening behavior; or a dangerous object used/carried in a clearly concerning context.
    - A single glance around, looking at the camera, ordinary clothing, a helmet/mask by itself, standing briefly, or simply being near an entrance is NOT enough for security_suspicious=true.
    - Do not infer criminal intent, identity, occupation, relationship, or motive. Do not mark someone suspicious based on appearance or demographic characteristics.
    - If evidence is unclear, the sequence is too short, or the behavior has a reasonable ordinary explanation supported by the images, set security_suspicious=false.
    - Evaluate the sequence as a whole. Prefer repeated behavior and change over time over a single-frame impression.

    If humans_detected = 0, human_action MUST be exactly: "Không phát hiện người trong chuỗi ảnh." and security_suspicious MUST be false.

    Output rules:
    - human_action MUST be natural Vietnamese with full diacritics.
    - Keep human_action direct and suitable for a phone notification.
    - Return raw JSON only. No markdown, no code fences, no extra text.
    - The JSON must be on one line.
      {% endif %}

    {% else %}

      {# ============================================================ #}
      {# CASE 5: STRUCTURED — HUMANS ONLY                            #}
      {# ============================================================ #}
      {% if detect_subjects == 'humans' %}
    You are a computer-vision assistant for a residential camera. Analyze HUMANS ONLY across the full chronological image sequence.
    Count distinct people, describe observable appearance/action and movement across frames, and use apartment/condominium or detached-house entrance context only when visually relevant.
    Do not count the same person again in multiple frames. Do not infer identity or intent.
    Fill the requested structured fields only. All user-facing text fields MUST be natural Vietnamese with full diacritics and concise enough for a phone notification.
    For animal fields, return the fixed values requested by their field descriptions because animal analysis is not requested.

      {# ============================================================ #}
      {# CASE 6: STRUCTURED — ANIMALS ONLY                           #}
      {# ============================================================ #}
      {% elif detect_subjects == 'animals' %}
    You are a computer-vision assistant for a residential camera. Analyze ANIMALS ONLY across the full chronological image sequence.
    Count distinct animals and describe species, visible color/markings, relative size, observable action and movement across frames.
    Do not count the same animal again in multiple frames. Use only visible evidence.
    Fill the requested structured fields only. All user-facing text fields MUST be natural Vietnamese with full diacritics and concise enough for a phone notification.
    For human fields, return the fixed values requested by their field descriptions because human analysis is not requested.

      {# ============================================================ #}
      {# CASE 7: STRUCTURED — HUMANS + ANIMALS                       #}
      {# ============================================================ #}
      {% elif detect_subjects == 'both' %}
    You are a computer-vision assistant for a residential camera. Analyze HUMANS and ANIMALS across the full chronological image sequence.
    Count each distinct subject only once across repeated frames. Describe observable actions and movement, not unsupported identity or intent.
    Use apartment/condominium or detached-house entrance context only when relevant. Vehicles may be briefly mentioned when they materially relate to a person's action.
    Fill the requested structured fields only. All user-facing text fields MUST be natural Vietnamese with full diacritics and concise enough for a phone notification.

      {# ============================================================ #}
      {# CASE 8: STRUCTURED — SECURITY                               #}
      {# ============================================================ #}
      {% else %}
    You are a computer-vision assistant for a residential security camera. Analyze the ENTIRE chronological image sequence and answer only three questions: how many DISTINCT people are visible, what they are doing, and whether their OBSERVED behavior is security-suspicious.

    Apply context carefully:
    - In apartments/condominiums, ordinary corridor, elevator-lobby, visitor and delivery traffic is normal.
    - At detached/private houses, ordinary sidewalk/street traffic, brief waiting, calling at the door, delivery, and normal entry/exit are normal.
    - Mark behavior suspicious only when visible actions across the sequence support it, especially repeated loitering/returning, repeated inspection of a specific door/window/lock/interior, testing or manipulating an entrance/lock, unusual climbing or entry into a clearly private area, tampering with/taking property, threatening behavior, or a dangerous object in a clearly concerning context.
    - A single glance around, looking at the camera, clothing, helmet/mask alone, or brief presence near an entrance is not enough.
    - Do not infer identity, motive, occupation, relationship or criminal intent. If evidence is unclear, set security_suspicious to false.

    Fill only the requested structured fields. human_action MUST be concise natural Vietnamese with full diacritics.
      {% endif %}

    {% endif %}

  # ============================================================
  # STRUCTURED OUTPUT FIELD DESCRIPTIONS - ENGLISH PROMPTS
  # ============================================================
  ai_structure_description_humans: >
    {% if ai_mode == 'structured' and detect_subjects in ['humans', 'both'] %}
    Describe each DISTINCT person in concise natural Vietnamese. Include apparent adult/child and apparent gender only when visually clear; clothing type and prominent colors; observable action; clearly visible held objects; and movement across the sequence (approaching, moving away, lateral movement, standing still, turning back). Do not count the same person twice across frames. Clearly mention a visible dangerous object without guessing intent. Only say someone is entering/leaving a residence when a doorway or gate crossing is visually supported. If humans_detected = 0, return EXACTLY: "Đã phát hiện chuyển động tuy nhiên không có người trong chuỗi ảnh khi so sánh".
    {% else %}
    Human analysis is not requested in the current mode. Return EXACTLY: "Không phân tích người theo yêu cầu".
    {% endif %}

  ai_structure_description_animals: >
    {% if ai_mode == 'structured' and detect_subjects in ['animals', 'both'] %}
    Describe each DISTINCT animal in concise natural Vietnamese: species when clear, visible color/markings, relative size, observable action, and movement across the sequence (approaching, moving away, lateral movement, standing/sitting/lying still). Do not count the same animal twice across frames. If animals_detected = 0, return EXACTLY: "Đã phát hiện chuyển động tuy nhiên không có động vật trong chuỗi ảnh khi so sánh".
    {% else %}
    Animal analysis is not requested in the current mode. Return EXACTLY: "Không phân tích động vật theo yêu cầu".
    {% endif %}

  ai_structure_description_security_action: >
    Describe in ONE concise natural Vietnamese sentence what the DISTINCT people do across the full chronological sequence. Focus on observable actions and progression: passing, approaching, leaving, waiting, returning, pacing, repeatedly looking around, observing a door/window, delivery/collection, touching/testing an entrance, manipulating a lock, handling property, climbing, or carrying a clearly visible dangerous object. Use apartment/condominium versus detached-house context to avoid false alarms. Do not infer identity or motive. If no person is visible, return EXACTLY: "Không phát hiện người trong chuỗi ảnh.".

  # Mobile Notify
  include_notify: !input include_notify
  notify_device: !input notify_device
  is_ios_android: !input is_ios_android
  notify_title: !input notify_title
  tap_navigate: !input tap_navigate
  notification_time: !input notification_time
  filtered_devices: "{{ notify_device }}"

  # Telegram
  include_telegram_notify: !input include_telegram_notify
  telegram_config_entry: !input telegram_config_entry
  telegram_target: !input telegram_target
  telegram_thread_id: !input telegram_thread_id
  telegram_initial_caption: !input telegram_initial_caption

  # Zalo Bot (Pyscript)
  enable_zalo_bot: !input enable_zalo_bot
  zalo_bot_chat_id: !input zalo_bot_chat_id
  zalo_bot_initial_caption: !input zalo_bot_initial_caption

  # Zalo Custom Integration
  enable_zalo_custom: !input enable_zalo_custom
  zalo_custom_account: !input zalo_custom_account
  zalo_custom_thread_id: !input zalo_custom_thread_id
  zalo_custom_user_id: !input zalo_custom_user_id
  zalo_custom_receiver_type: !input zalo_custom_receiver_type
  zalo_custom_ttl: !input zalo_custom_ttl
  zalo_custom_initial_caption: !input zalo_custom_initial_caption
  # Chỉ dùng để KIỂM TRA có ID hay chưa. TUYỆT ĐỐI không dùng làm thread_id:
  # kết quả template bị HA diễn giải thành số và ID 19 chữ số bị làm tròn.
  zalo_resolved_id: >-
    {{ (zalo_custom_thread_id if zalo_custom_receiver_type == '1'
        else zalo_custom_user_id) | trim }}

  # TTS
  include_tts_announcement: !input include_tts_announcement
  num_volume_speaker: !input num_volume_speaker
  text_to_speech_engine: !input text_to_speech_engine
  media_player: !input media_player
  num_delay_actions: !input num_delay_actions

  # Tag duy nhất cho mỗi lần chạy
  tag: "{{ camera_entity + int(as_timestamp(now())) | string }}"

  # Màu thông báo Android dạng HEX
  notification_color: !input notification_color
  notification_color_hex: >
    #{{ '%02x%02x%02x' | format(notification_color[0], notification_color[1], notification_color[2]) }}

max_exceeded: silent
mode: single

# ============================================================
# TRIGGER VARIABLES
# ============================================================
trigger_variables:
  _trigger_sensors: !input trigger_sensor

# ============================================================
# TRIGGER
# ============================================================
trigger:
  - platform: state
    entity_id: !input trigger_sensor
    from: !input trigger_from_state
    to: !input trigger_to_state

# ============================================================
# CONDITION
# ============================================================
condition:
  - condition: and
    conditions: !input run_conditions

# ============================================================
# ACTION
# ============================================================
action:

  # ============================================================
  # BƯỚC 0: TRIGGER CONFIRMATION (tùy chọn)
  # Chờ X giây, sau đó kiểm tra lại sensor đã kích hoạt + Run Conditions.
  # ============================================================
  - choose:
      - alias: "Xác nhận Trigger sau thời gian chờ"
        conditions:
          - condition: template
            value_template: "{{ enable_trigger_confirmation }}"
        sequence:
          - delay:
              seconds: "{{ trigger_confirmation_time }}"

          # Kiểm tra lại chính sensor đã kích hoạt automation.
          # Nếu chạy thủ công (không có trigger object), cho phép tiếp tục.
          - condition: template
            value_template: >
              {{ trigger is not defined
                 or trigger.entity_id is not defined
                 or is_state(trigger.entity_id, trigger_to_state) }}

          # Kiểm tra lại toàn bộ Run Conditions sau thời gian xác nhận.
          - condition: and
            conditions: !input run_conditions

  # ============================================================
  # BƯỚC 1: WAIT FOR PERSON (tùy chọn)
  # ============================================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait_for_person and person_sensor | length > 0 }}"
        sequence:
          - if:
              - condition: state
                entity_id: !input person_occupancy_sensor
                state: !input person_detected_state
            then: []
            else:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ max_wait_time == 0 }}"
                    sequence:
                      - wait_for_trigger:
                          - platform: state
                            entity_id: !input person_occupancy_sensor
                            to: !input person_detected_state
                        continue_on_timeout: true
                  - conditions:
                      - condition: template
                        value_template: "{{ max_wait_time > 0 }}"
                    sequence:
                      - wait_for_trigger:
                          - platform: state
                            entity_id: !input person_occupancy_sensor
                            to: !input person_detected_state
                        timeout:
                          seconds: "{{ max_wait_time }}"
                        continue_on_timeout: true

  # ============================================================
  # BƯỚC 2: XÁC ĐỊNH ĐƯỜNG DẪN FILE
  # ============================================================
  - variables:
      file_path_dynamic: >
        {% if overwrite_image %}
          {{ camera_file_path }}
        {% else %}
          {{ camera_file_path }}_{{ context.id }}
        {% endif %}

  # ============================================================
  # BƯỚC 3: DELAY TRƯỚC KHI CHỤP ẢNH ĐẦU TIÊN
  # ============================================================
  - delay:
      seconds: "{{ num_delay_before_snapshot }}"

  # ============================================================
  # BƯỚC 4: CHỤP ẢNH LIÊN TIẾP
  # ============================================================
  - repeat:
      count: "{{ num_snapshots }}"
      sequence:
        - action: camera.snapshot
          data:
            filename: /media/snapshots/{{ file_path_dynamic }}_snapshot{{ repeat.index }}.jpg
          target:
            entity_id: "{{ camera_entity }}"
        - if:
            - condition: template
              value_template: "{{ repeat.index < num_snapshots }}"
          then:
            - delay:
                seconds: "{{ num_delay }}"

  # ============================================================
  # BƯỚC 5: BUILD DANH SÁCH URL SNAPSHOTS CHO AI + DANH SÁCH ẢNH GỬI THÔNG BÁO
  # ============================================================
  - variables:
      snapshots_url: >
        {% set snap_count = num_snapshots | int %}
        {% set camera = file_path_dynamic %}
        {% set ns = namespace(images=[]) %}
        {%- for i in range(1, snap_count + 1) -%}
          {% set ns.images = ns.images + [{
            'media_content_id': 'media-source://media_source/local/snapshots/' ~ camera ~ '_snapshot' ~ i ~ '.jpg',
            'media_content_type': 'image/jpeg'
          }] %}
        {%- endfor -%}
        {{ ns.images }}
      snapshot_first: /media/local/snapshots/{{ file_path_dynamic }}_snapshot1.jpg
      # Danh sách đường dẫn tuyệt đối (dùng cho Telegram, Zalo Bot Pyscript, Zalo Custom)
      all_snapshot_paths: >
        {% set snap_count = num_snapshots | int %}
        {% set camera = file_path_dynamic %}
        {% set ns = namespace(paths=[]) %}
        {%- for i in range(1, snap_count + 1) -%}
          {% set ns.paths = ns.paths + ['/media/snapshots/' ~ camera ~ '_snapshot' ~ i ~ '.jpg'] %}
        {%- endfor -%}
        {{ ns.paths }}
      # Chuỗi các đường dẫn nối bằng dấu phẩy (dùng cho Zalo Custom Integration khi gộp nhiều ảnh)
      all_snapshot_paths_comma: "{{ all_snapshot_paths | join(',') }}"
      # Danh sách đường dẫn media (dùng cho Mobile App image/attachment)
      all_snapshot_media_paths: >
        {% set snap_count = num_snapshots | int %}
        {% set camera = file_path_dynamic %}
        {% set ns = namespace(paths=[]) %}
        {%- for i in range(1, snap_count + 1) -%}
          {% set ns.paths = ns.paths + ['/media/local/snapshots/' ~ camera ~ '_snapshot' ~ i ~ '.jpg'] %}
        {%- endfor -%}
        {{ ns.paths }}

  # ============================================================
  # BƯỚC 6: GỬI ẢNH NGAY LẬP TỨC (trước khi AI phân tích)
  # ============================================================

  # --- Telegram: gửi ảnh + caption ban đầu ---
  - choose:
      # Nhánh 1 ăn cả trường hợp "bật album nhưng chỉ có 1 ảnh": schema của
      # send_media_group là vol.Length(min=2, max=10) (__init__.py:269) nên một
      # ảnh là bị TỪ CHỐI cả lời gọi. Một ảnh phải đi bằng send_photo.
      - alias: "Telegram - Gửi 1 ảnh (mặc định)"
        conditions:
          - condition: template
            value_template: >
              {{ include_telegram_notify
                 and (not telegram_send_all_images
                      or all_snapshot_paths | length < 2) }}
        sequence:
          - alias: "Gửi ảnh qua Telegram"
            continue_on_error: true
            action: telegram_bot.send_photo
            data: >
              {% set data = {
                'config_entry_id': telegram_config_entry,
                'file': '/media/snapshots/' + file_path_dynamic + '_snapshot1.jpg',
                'caption': telegram_initial_caption
              } %}
              {% if telegram_target != "" %}
                {% set data = dict(data, chat_id=telegram_target | int) %}
              {% endif %}
              {% if telegram_thread_id != "" %}
                {% set data = dict(data, message_thread_id=telegram_thread_id | int) %}
              {% endif %}
              {{ data }}

      - alias: "Telegram - Gửi tất cả ảnh (ALBUM)"
        conditions:
          - condition: template
            value_template: >
              {{ include_telegram_notify
                 and telegram_send_all_images
                 and all_snapshot_paths | length > 1 }}
        sequence:
          # send_media_group = MỘT album, thay vì lặp send_photo thành N tin rời.
          # `[:10]` là trần của Telegram cho media group — quá 10 là cả lời gọi
          # bị từ chối, nên cắt ở đây chứ không để nền tảng đánh trượt cả lô.
          #
          # Tên khoá mỗi phần tử phải theo HA, KHÔNG theo Telegram Bot API gốc.
          # Schema thật (__init__.py:246-269): media_type là vol.Required, ảnh
          # trên đĩa đi bằng `file`, ảnh trên web đi bằng `url`. Dùng 'type' và
          # 'media' kiểu API gốc thì vol.Schema mặc định PREVENT_EXTRA đá cả lời
          # gọi, mà dòng này có continue_on_error nên lỗi bị nuốt: không ảnh nào
          # tới Telegram và cũng không thấy báo lỗi ở đâu.
          - alias: "Gửi ALBUM qua Telegram"
            continue_on_error: true
            action: telegram_bot.send_media_group
            data: >
              {% set ns = namespace(media=[]) %}
              {%- for p in all_snapshot_paths[:10] -%}
                {% if loop.first %}
                  {% set ns.media = ns.media + [{'media_type':'photo','file':p,'caption':telegram_initial_caption}] %}
                {% else %}
                  {% set ns.media = ns.media + [{'media_type':'photo','file':p}] %}
                {% endif %}
              {%- endfor -%}
              {% set data = {
                'config_entry_id': telegram_config_entry,
                'media': ns.media
              } %}
              {% if telegram_target != "" %}
                {% set data = dict(data, chat_id=telegram_target | int) %}
              {% endif %}
              {% if telegram_thread_id != "" %}
                {% set data = dict(data, message_thread_id=telegram_thread_id | int) %}
              {% endif %}
              {{ data }}

  # --- Zalo Bot (Pyscript): gửi ảnh + caption ban đầu ---
  - choose:
      - alias: "Zalo Bot Pyscript - Gửi 1 ảnh (mặc định)"
        conditions:
          - condition: template
            value_template: "{{ enable_zalo_bot and not zalo_bot_send_all_images }}"
        sequence:
          - alias: "Gửi ảnh qua Zalo Bot (Pyscript)"
            continue_on_error: true
            action: pyscript.send_zalo_photo
            data:
              chat_id: "{{ zalo_bot_chat_id }}"
              file_path: /media/snapshots/{{ file_path_dynamic }}_snapshot1.jpg
              caption: "{{ zalo_bot_initial_caption }}"
            response_variable: zalo_bot_photo_response

      - alias: "Zalo Bot Pyscript - Gửi tất cả ảnh"
        conditions:
          - condition: template
            value_template: "{{ enable_zalo_bot and zalo_bot_send_all_images }}"
        sequence:
          - alias: "Gửi toàn bộ ảnh qua Zalo Bot (Pyscript)"
            repeat:
              for_each: "{{ all_snapshot_paths }}"
              sequence:
                - continue_on_error: true
                  action: pyscript.send_zalo_photo
                  data:
                    chat_id: "{{ zalo_bot_chat_id }}"
                    file_path: "{{ repeat.item }}"
                    caption: "{{ zalo_bot_initial_caption if repeat.index == 1 else '' }}"
                  response_variable: zalo_bot_photo_response

  # --- Zalo Custom Integration: gửi ảnh + caption ban đầu ---
  #
  # thread_id PHẢI lấy bằng `!input`, KHÔNG qua template.
  #
  # Đo thật (trace 30/07 04:39): khai thread_id 3295299208151385728, HA gửi đi
  # 3295299208151385600 — LỆCH 128. Vì kết quả template được HA tự diễn giải
  # thành SỐ, mà ID Zalo dài 19 chữ số nên bị làm tròn qua float64. `| string`
  # KHÔNG cứu được: HA parse lại sau khi filter chạy.
  #
  # Hệ quả nặng hơn cái lỗi báo ra: `send_images_to_group` ném
  # "expected str for dictionary value @ data['thread_id']" nên còn thấy được,
  # nhưng `send_message` thì `cv.string` tự chuyển int → chuỗi và gửi ÊM vào một
  # ID SAI. Tức tin chữ trước đây đã đi lạc mà không ai biết.
  #
  # Vì `!input` không chọn được bằng template, phải tách hẳn hai nhánh
  # NHÓM / CÁ NHÂN — dài hơn nhưng là cách duy nhất giữ ID nguyên chuỗi.
  - choose:
      - alias: "Zalo cá nhân — NHÓM"
        conditions:
          - condition: template
            value_template: >
              {{ enable_zalo_custom
                 and zalo_custom_receiver_type == '1'
                 and zalo_custom_thread_id | length > 0
                 and zalo_custom_account | length > 0 }}
        sequence:
          # Chú thích đi TIN CHỮ RIÊNG: service gửi nhiều ảnh không có tham số
          # caption (const.py:116-120 — chỉ image_paths/thread_id/account_selection,
          # và vol.Schema mặc định PREVENT_EXTRA nên thêm trường là bị từ chối CẢ
          # lời gọi).
          - if:
              - condition: template
                value_template: "{{ zalo_custom_send_all_images and zalo_custom_initial_caption | length > 0 }}"
            then:
              - alias: "Nhóm — tin chữ chú thích"
                continue_on_error: true
                action: zalo_bot.send_message
                data:
                  account_selection: !input zalo_custom_account
                  thread_id: !input zalo_custom_thread_id
                  type: "1"
                  message: !input zalo_custom_initial_caption
                  ttl: !input zalo_custom_ttl

          - if:
              - condition: template
                value_template: "{{ zalo_custom_send_all_images }}"
            then:
              # send_images_to_group là service DUY NHẤT tách chuỗi dấu phẩy.
              # `send_image` gọi os.path.isfile() trên CẢ chuỗi (chat_features.py:151)
              # nên nhiều đường dẫn không phải tệp nào — bỏ qua im lặng.
              - alias: "Nhóm — ALBUM nhiều ảnh (1 tin)"
                continue_on_error: true
                action: zalo_bot.send_images_to_group
                data:
                  account_selection: !input zalo_custom_account
                  thread_id: !input zalo_custom_thread_id
                  image_paths: "{{ all_snapshot_paths_comma }}"
                response_variable: zalo_custom_image_response
            else:
              - alias: "Nhóm — một ảnh kèm chú thích"
                continue_on_error: true
                action: zalo_bot.send_image
                data:
                  account_selection: !input zalo_custom_account
                  thread_id: !input zalo_custom_thread_id
                  type: "1"
                  image_path: "/media/snapshots/{{ file_path_dynamic }}_snapshot1.jpg"
                  message: !input zalo_custom_initial_caption
                  ttl: !input zalo_custom_ttl
                response_variable: zalo_custom_image_response

      - alias: "Zalo cá nhân — CÁ NHÂN"
        conditions:
          - condition: template
            value_template: >
              {{ enable_zalo_custom
                 and zalo_custom_receiver_type != '1'
                 and zalo_custom_user_id | length > 0
                 and zalo_custom_account | length > 0 }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ zalo_custom_send_all_images and zalo_custom_initial_caption | length > 0 }}"
            then:
              - alias: "Cá nhân — tin chữ chú thích"
                continue_on_error: true
                action: zalo_bot.send_message
                data:
                  account_selection: !input zalo_custom_account
                  thread_id: !input zalo_custom_user_id
                  type: "0"
                  message: !input zalo_custom_initial_caption
                  ttl: !input zalo_custom_ttl

          - if:
              - condition: template
                value_template: "{{ zalo_custom_send_all_images }}"
            then:
              - alias: "Cá nhân — ALBUM nhiều ảnh (1 tin)"
                continue_on_error: true
                action: zalo_bot.send_images_to_user
                data:
                  account_selection: !input zalo_custom_account
                  thread_id: !input zalo_custom_user_id
                  image_paths: "{{ all_snapshot_paths_comma }}"
                response_variable: zalo_custom_image_response
            else:
              - alias: "Cá nhân — một ảnh kèm chú thích"
                continue_on_error: true
                action: zalo_bot.send_image
                data:
                  account_selection: !input zalo_custom_account
                  thread_id: !input zalo_custom_user_id
                  type: "0"
                  image_path: "/media/snapshots/{{ file_path_dynamic }}_snapshot1.jpg"
                  message: !input zalo_custom_initial_caption
                  ttl: !input zalo_custom_ttl
                response_variable: zalo_custom_image_response

  # --- Mobile App: Bước 1 — Gửi ảnh ngay lập tức (thông báo riêng, không tag) ---
  - if:
      - condition: template
        value_template: "{{ include_notify and (filtered_devices | length > 0) }}"
    then:
      - choose:
          - alias: Android - Bước 1 gửi ảnh
            conditions:
              - "{{ is_ios_android == 'android_device' }}"
            sequence:
              - repeat:
                  for_each: "{{ filtered_devices }}"
                  sequence:
                    - variables:
                        current_device: "{{ repeat.item }}"
                    - if:
                        - condition: template
                          value_template: "{{ not mobile_send_all_images }}"
                      then:
                        - continue_on_error: true
                          action: >
                            notify.mobile_app_{{ device_attr(current_device, 'name') | slugify }}
                          data:
                            title: !input notify_title
                            message: "📷 Ảnh chụp từ {{ camera_name }}"
                            data:
                              priority: high
                              notification_icon: !input status_bar_icon
                              color: "{{ notification_color_hex }}"
                              image: "{{ snapshot_first }}"
                              url: "{{ tap_navigate }}"
                              clickAction: "{{ tap_navigate }}"
                              tag: "{{ tag }}_image"
                      else:
                        - repeat:
                            for_each: "{{ all_snapshot_media_paths }}"
                            sequence:
                              - continue_on_error: true
                                action: >
                                  notify.mobile_app_{{ device_attr(current_device, 'name') | slugify }}
                                data:
                                  title: !input notify_title
                                  message: "📷 Ảnh {{ repeat.index }}/{{ all_snapshot_media_paths | length }} từ {{ camera_name }}"
                                  data:
                                    priority: high
                                    notification_icon: !input status_bar_icon
                                    color: "{{ notification_color_hex }}"
                                    image: "{{ repeat.item }}"
                                    url: "{{ tap_navigate }}"
                                    clickAction: "{{ tap_navigate }}"
                                    tag: "{{ tag }}_image_{{ repeat.index }}"

          - alias: iOS - Bước 1 gửi ảnh
            conditions:
              - "{{ is_ios_android == 'ios_device' }}"
            sequence:
              - repeat:
                  for_each: "{{ filtered_devices }}"
                  sequence:
                    - variables:
                        current_device: "{{ repeat.item }}"
                    - if:
                        - condition: template
                          value_template: "{{ not mobile_send_all_images }}"
                      then:
                        - continue_on_error: true
                          action: >
                            notify.mobile_app_{{ device_attr(current_device, 'name') | slugify }}
                          data:
                            title: !input notify_title
                            message: "📷 Ảnh chụp từ {{ camera_name }}"
                            data:
                              attachment:
                                url: "{{ snapshot_first }}"
                                content_type: JPEG
                              tag: "{{ tag }}_image"
                      else:
                        - repeat:
                            for_each: "{{ all_snapshot_media_paths }}"
                            sequence:
                              - continue_on_error: true
                                action: >
                                  notify.mobile_app_{{ device_attr(current_device, 'name') | slugify }}
                                data:
                                  title: !input notify_title
                                  message: "📷 Ảnh {{ repeat.index }}/{{ all_snapshot_media_paths | length }} từ {{ camera_name }}"
                                  data:
                                    attachment:
                                      url: "{{ repeat.item }}"
                                      content_type: JPEG
                                    tag: "{{ tag }}_image_{{ repeat.index }}"

  # ============================================================
  # BƯỚC 7: PHÂN TÍCH AI
  # ============================================================
  - choose:
      - alias: "Chạy phân tích AI nếu được bật"
        conditions:
          - "{{ ai_powered }}"
        sequence:

          # ----------------------------------------------------------
          # Structured Output
          # Security uses exactly 3 fields; other modes keep the legacy 6 fields.
          # ----------------------------------------------------------
          - choose:
              - alias: "Structured Output - Humans / Animals / Both"
                conditions:
                  - condition: template
                    value_template: "{{ ai_mode == 'structured' and detect_subjects != 'security' }}"
                sequence:
                  - action: ai_task.generate_data
                    data:
                      task_name: Phan tich anh khi co chuyen dong
                      instructions: "{{ ai_task_instructions }}"
                      entity_id: "{{ ai_provider if ai_provider | length > 0 else omit }}"
                      attachments: "{{ snapshots_url }}"
                      structure:
                        humans_detected:
                          description: >
                            Count DISTINCT people visible across the image sequence (integer >= 0).
                            Do not count the same person again across frames. Return 0 when no human is visible or human analysis is not requested.
                          required: true
                          selector:
                            number:
                        humans_detected_summary:
                          description: >
                            Concise Vietnamese count summary, for example "1 phụ nữ, 2 đàn ông, 1 trẻ em".
                            Use apparent categories only when visually clear. Return an empty string when no human is visible or human analysis is not requested.
                          required: true
                          selector:
                            text:
                        humans_detected_description:
                          description: "{{ ai_structure_description_humans }}"
                          required: true
                          selector:
                            text:
                        animals_detected:
                          description: >
                            Count DISTINCT animals visible across the image sequence (integer >= 0).
                            Do not count the same animal again across frames. Return 0 when none are visible or animal analysis is not requested.
                          required: true
                          selector:
                            number:
                        animals_detected_summary:
                          description: >
                            Concise Vietnamese summary by species and visible color, for example "1 con chó vàng, 2 con mèo đen".
                            Return an empty string when no animal is visible or animal analysis is not requested.
                          required: true
                          selector:
                            text:
                        animals_detected_description:
                          description: "{{ ai_structure_description_animals }}"
                          required: true
                          selector:
                            text:
                    response_variable: humans_detected_report

              - alias: "Structured Output - Security"
                conditions:
                  - condition: template
                    value_template: "{{ ai_mode == 'structured' and detect_subjects == 'security' }}"
                sequence:
                  - action: ai_task.generate_data
                    data:
                      task_name: Phan tich an ninh camera
                      instructions: "{{ ai_task_instructions }}"
                      entity_id: "{{ ai_provider if ai_provider | length > 0 else omit }}"
                      attachments: "{{ snapshots_url }}"
                      structure:
                        humans_detected:
                          description: >
                            Count DISTINCT people visible across the full image sequence (integer >= 0).
                            Do not count the same person again across repeated frames.
                          required: true
                          selector:
                            number:
                        human_action:
                          description: "{{ ai_structure_description_security_action }}"
                          required: true
                          selector:
                            text:
                        security_suspicious:
                          description: >
                            Boolean. true only when observable behavior across the sequence reasonably warrants residential security attention under the instructions; otherwise false. If evidence is unclear or no person is visible, return false.
                          required: true
                          selector:
                            boolean:
                    response_variable: humans_detected_report

              # ----------------------------------------------------------
              # Chế độ JSON: AI trả về raw JSON, parse thủ công
              # ----------------------------------------------------------
              - alias: "JSON Mode (OpenAI / Raw JSON)"
                conditions:
                  - condition: template
                    value_template: "{{ ai_mode == 'json' }}"
                sequence:
                  - action: ai_task.generate_data
                    data:
                      task_name: Phan tich anh khi co chuyen dong
                      instructions: "{{ ai_task_instructions }}"
                      entity_id: "{{ ai_provider if ai_provider | length > 0 else omit }}"
                      attachments: "{{ snapshots_url }}"
                    response_variable: humans_detected_report_raw

                  - variables:
                      humans_detected_report: >
                        {% if humans_detected_report_raw is defined
                           and humans_detected_report_raw.data is defined %}
                          {% set parsed = (humans_detected_report_raw.data
                            | regex_replace('```json\\s*', '')
                            | regex_replace('```\\s*', '')
                            | trim
                            | from_json(default={})) %}
                          {% set fixed = {
                            'humans_detected':              parsed.get('humans_detected',              parsed.get('humansdetected', 0)),
                            'humans_detected_summary':      parsed.get('humans_detected_summary',      parsed.get('humansdetectedsummary', '')),
                            'humans_detected_description':  parsed.get('humans_detected_description',  parsed.get('humansdetecteddescription', '')),
                            'animals_detected':             parsed.get('animals_detected',             parsed.get('animalsdetected', 0)),
                            'animals_detected_summary':     parsed.get('animals_detected_summary',     parsed.get('animalsdetectedsummary', '')),
                            'animals_detected_description': parsed.get('animals_detected_description', parsed.get('animalsdetecteddescription', '')),
                            'human_action':                 parsed.get('human_action',                 parsed.get('humanaction', '')),
                            'security_suspicious':          parsed.get('security_suspicious',          parsed.get('securitysuspicious', false))
                          } %}
                          {{ {'data': fixed} }}
                        {% else %}
                          {{ {} }}
                        {% endif %}
          # Đợi AI xử lý xong
          - wait_template: >
              {{ humans_detected_report is defined
                 and humans_detected_report.data is defined }}
            timeout: "00:01:00"
            continue_on_timeout: true

          # ============================================================
          # XỬ LÝ KẾT QUẢ AI
          # ============================================================
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              # ----------------------------------------------------------
              # Build message tổng hợp từ kết quả AI
              # ----------------------------------------------------------
              - variables:
                  ai_messages: >-
                    {%- set h_count = humans_detected_report.data.get('humans_detected', 0) | int(0) -%}
                    {%- set a_count = humans_detected_report.data.get('animals_detected', 0) | int(0) -%}
                    {%- set h_summary = humans_detected_report.data.get('humans_detected_summary', '') -%}
                    {%- set a_summary = humans_detected_report.data.get('animals_detected_summary', '') -%}
                    {%- set h_desc = humans_detected_report.data.get('humans_detected_description', '') -%}
                    {%- set a_desc = humans_detected_report.data.get('animals_detected_description', '') -%}
                    {%- set s_action = humans_detected_report.data.get('human_action', '') -%}
                    {%- set s_raw = humans_detected_report.data.get('security_suspicious', false) -%}
                    {%- set s_flag = s_raw in [true, 'true', 'True', 'TRUE', 1, '1', 'yes', 'Yes', 'YES'] -%}
                    {%- set days = ['Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy', 'Chủ nhật'] -%}
                    {%- set ns = namespace(lines=[]) -%}
                    {%- set ns.lines = ns.lines + ['📊  ' + camera_name] -%}
                    {%- if detect_subjects == 'security' -%}
                      {%- set ns.lines = ns.lines + ['🚶: ' + h_count | string + ' người'] -%}
                      {%- set ns.lines = ns.lines + ['👉 ' + (s_action if s_action | length > 0 else 'Không có mô tả hành động.')] -%}
                      {%- set ns.lines = ns.lines + ['🛡️ Khả nghi: ' + ('CÓ' if s_flag else 'KHÔNG')] -%}
                    {%- else -%}
                      {%- if detect_subjects in ['humans', 'both'] -%}
                        {%- set ns.lines = ns.lines + ['🚶: ' + (h_summary if h_summary | length > 0 else h_count | string)] -%}
                        {%- set ns.lines = ns.lines + ['👉 ' + h_desc] -%}
                      {%- endif -%}
                      {%- if detect_subjects in ['animals', 'both'] -%}
                        {%- set ns.lines = ns.lines + ['🐾: ' + (a_summary if a_summary | length > 0 else a_count | string)] -%}
                        {%- set ns.lines = ns.lines + ['👉 ' + a_desc] -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- set time_str = '🕒 ' + now().strftime('%H:%M:%S') + ' ' + days[now().weekday()] + ' Ngày ' + now().strftime('%d') + ' Tháng ' + now().strftime('%m') + ' Năm ' + now().strftime('%Y') + (' ' + notification_time if notification_time != '' else '') -%}
                    {%- set ns.lines = ns.lines + [time_str] -%}
                    {{ ns.lines | join('\n') }}

              # ----------------------------------------------------------
              # Điều kiện lọc thông báo
              # Cụm từ filter khớp chính xác với chuỗi fallback trong prompt.
              # ----------------------------------------------------------
              - if:
                  - condition: template
                    value_template: >
                      {% set h_count = humans_detected_report.data.get('humans_detected', 0) | int(0) %}
                      {% set h_desc  = humans_detected_report.data.get('humans_detected_description', '') | lower %}
                      {% set a_count = humans_detected_report.data.get('animals_detected', 0) | int(0) %}
                      {% set a_desc  = humans_detected_report.data.get('animals_detected_description', '') | lower %}

                      {# Valid human detection for legacy human/both modes #}
                      {% set no_human_phrases = [
                        'không có người trong chuỗi ảnh khi so sánh',
                        'không có người',
                        'không có chuỗi hình ảnh nào được cung cấp',
                        'không phân tích người',
                        'no person',
                        'no people',
                        'human analysis is not requested'
                      ] %}
                      {% set human_invalid = namespace(value=false) %}
                      {% for phrase in no_human_phrases %}
                        {% if phrase in h_desc %}{% set human_invalid.value = true %}{% endif %}
                      {% endfor %}
                      {% set human_ok = (h_count > 0) and not human_invalid.value %}

                      {# Valid animal detection #}
                      {% set no_animal_phrases = [
                        'không có động vật trong chuỗi ảnh khi so sánh',
                        'không có động vật',
                        'không phân tích động vật',
                        'no animal',
                        'animal analysis is not requested'
                      ] %}
                      {% set animal_invalid = namespace(value=false) %}
                      {% for phrase in no_animal_phrases %}
                        {% if phrase in a_desc %}{% set animal_invalid.value = true %}{% endif %}
                      {% endfor %}
                      {% set animal_ok = (a_count > 0) and not animal_invalid.value %}

                      {# Security mode sends the AI result whenever at least one person is detected,
                         so the notification can state count + action + suspicious YES/NO. #}
                      {% if detect_subjects == 'humans' %}
                        {{ human_ok }}
                      {% elif detect_subjects == 'animals' %}
                        {{ animal_ok }}
                      {% elif detect_subjects == 'both' %}
                        {{ human_ok or animal_ok }}
                      {% else %}
                        {{ h_count > 0 }}
                      {% endif %}
                then:

                  # --- Mobile Notification Bước 2 — Gửi kết quả AI (chỉ text, không ảnh) ---
                  - if:
                      - condition: template
                        value_template: "{{ include_notify and (filtered_devices | length > 0) }}"
                    then:
                      - choose:
                          - alias: Android - Bước 2 gửi kết quả AI
                            conditions:
                              - "{{ is_ios_android == 'android_device' }}"
                            sequence:
                              - repeat:
                                  for_each: "{{ filtered_devices }}"
                                  sequence:
                                    - continue_on_error: true
                                      action: >
                                        notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                                      data:
                                        title: !input notify_title
                                        message: "{{ ai_messages }}"
                                        data:
                                          priority: high
                                          notification_icon: !input status_bar_icon
                                          color: "{{ notification_color_hex }}"
                                          url: "{{ tap_navigate }}"
                                          clickAction: "{{ tap_navigate }}"
                                          tag: "{{ tag }}_text"

                          - alias: iOS - Bước 2 gửi kết quả AI
                            conditions:
                              - "{{ is_ios_android == 'ios_device' }}"
                            sequence:
                              - repeat:
                                  for_each: "{{ filtered_devices }}"
                                  sequence:
                                    - continue_on_error: true
                                      action: >
                                        notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                                      data:
                                        title: !input notify_title
                                        message: "{{ ai_messages }}"
                                        data:
                                          tag: "{{ tag }}_text"

                  # --- Telegram: gửi kết quả phân tích AI ---
                  - if:
                      - condition: template
                        value_template: "{{ include_telegram_notify }}"
                    then:
                      - continue_on_error: true
                        action: telegram_bot.send_message
                        data: >
                          {% set data = {
                            'config_entry_id': telegram_config_entry,
                            'message': ai_messages,
                            'parse_mode': 'plain_text'
                          } %}
                          {% if telegram_target != "" %}
                            {% set data = dict(data, chat_id=telegram_target | int) %}
                          {% endif %}
                          {% if telegram_thread_id != "" %}
                            {% set data = dict(data, message_thread_id=telegram_thread_id | int) %}
                          {% endif %}
                          {{ data }}

                  # --- Zalo Bot (Pyscript): gửi kết quả phân tích AI ---
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ enable_zalo_bot }}"
                        sequence:
                          - alias: "Gửi kết quả AI qua Zalo Bot"
                            continue_on_error: true
                            action: pyscript.send_zalo_message
                            data:
                              chat_id: "{{ zalo_bot_chat_id }}"
                              message: "{{ ai_messages }}"
                            response_variable: zalo_bot_message_response

                  # --- Zalo Custom Integration: gửi kết quả phân tích AI ---
                  # thread_id bằng !input, KHÔNG qua template: ID Zalo 19 chữ số bị HA
                  # diễn giải thành số rồi làm tròn qua float64 (đo thật …385728 → …385600).
                  # `cv.string` ở đây tự chuyển nên KHÔNG có lỗi nào báo ra — tin đi êm vào
                  # một ID SAI. Đó là kiểu sai tệ nhất: im lặng và không ai kiểm được.
                  - choose:
                      - alias: "Kết quả AI → NHÓM"
                        conditions:
                          - condition: template
                            value_template: >
                              {{ enable_zalo_custom
                                 and zalo_custom_receiver_type == '1'
                                 and zalo_custom_thread_id | length > 0
                                 and zalo_custom_account | length > 0 }}
                        sequence:
                          - continue_on_error: true
                            alias: "Gửi kết quả AI qua Zalo Custom (nhóm)"
                            action: zalo_bot.send_message
                            data:
                              account_selection: !input zalo_custom_account
                              thread_id: !input zalo_custom_thread_id
                              type: "1"
                              message: "{{ ai_messages }}"
                              ttl: !input zalo_custom_ttl

                      - alias: "Kết quả AI → CÁ NHÂN"
                        conditions:
                          - condition: template
                            value_template: >
                              {{ enable_zalo_custom
                                 and zalo_custom_receiver_type != '1'
                                 and zalo_custom_user_id | length > 0
                                 and zalo_custom_account | length > 0 }}
                        sequence:
                          - continue_on_error: true
                            alias: "Gửi kết quả AI qua Zalo Custom (cá nhân)"
                            action: zalo_bot.send_message
                            data:
                              account_selection: !input zalo_custom_account
                              thread_id: !input zalo_custom_user_id
                              type: "0"
                              message: "{{ ai_messages }}"
                              ttl: !input zalo_custom_ttl

                  # --- TTS ra loa ---
                  - if:
                      - condition: template
                        value_template: "{{ include_tts_announcement }}"
                    then:
                      - alias: "TTS ra từng loa"
                        repeat:
                          for_each: "{{ media_player }}"
                          sequence:
                            - continue_on_error: true
                              action: media_player.volume_set
                              data:
                                volume_level: "{{ num_volume_speaker }}"
                              target:
                                entity_id: "{{ repeat.item }}"
                            - continue_on_error: true
                              action: tts.speak
                              target:
                                entity_id: !input text_to_speech_engine
                              data:
                                media_player_entity_id: "{{ repeat.item }}"
                                message: >
                                  {% set h_count = humans_detected_report.data.get('humans_detected', 0) | int(0) %}
                                  {% set a_count = humans_detected_report.data.get('animals_detected', 0) | int(0) %}
                                  {% if detect_subjects == 'security' %}
                                    {% set s_action = humans_detected_report.data.get('human_action', '') %}
                                    {% set s_raw = humans_detected_report.data.get('security_suspicious', false) %}
                                    {% set s_flag = s_raw in [true, 'true', 'True', 'TRUE', 1, '1', 'yes', 'Yes', 'YES'] %}
                                    Phát hiện {{ h_count }} người. {{ s_action }}. Đánh giá an ninh: {{ 'khả nghi' if s_flag else 'không khả nghi' }}.
                                  {% else %}
                                    {% set parts = [] %}
                                    {% if detect_subjects in ['humans', 'both'] and h_count > 0 %}
                                      {% set parts = parts + [humans_detected_report.data.get('humans_detected_description', '')] %}
                                    {% endif %}
                                    {% if detect_subjects in ['animals', 'both'] and a_count > 0 %}
                                      {% set parts = parts + [humans_detected_report.data.get('animals_detected_description', '')] %}
                                    {% endif %}
                                    {{ parts | join('. ') if parts | length > 0 else 'Phát hiện chuyển động.' }}
                                  {% endif %}

            else:
              # ============================================================
              # XỬ LÝ KHI AI TIMEOUT
              # ============================================================
              - variables:
                  error_message: >
                    ⚠️ AI phân tích ảnh chụp không thành công (timeout).
                    🕒 {{ now().strftime('%H:%M:%S %a, %d-%b-%Y') }}

              - if:
                  - condition: template
                    value_template: "{{ include_notify and (filtered_devices | length > 0) }}"
                then:
                  - choose:
                      - alias: Android - Thông báo lỗi AI timeout (chỉ text)
                        conditions:
                          - "{{ is_ios_android == 'android_device' }}"
                        sequence:
                          - repeat:
                              for_each: "{{ filtered_devices }}"
                              sequence:
                                - continue_on_error: true
                                  action: >
                                    notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                                  data:
                                    title: !input notify_title
                                    message: "{{ error_message }}"
                                    data:
                                      priority: high
                                      notification_icon: !input status_bar_icon
                                      color: "{{ notification_color_hex }}"
                                      url: "{{ tap_navigate }}"
                                      clickAction: "{{ tap_navigate }}"
                                      tag: "{{ tag }}_text"
                      - alias: iOS - Thông báo lỗi AI timeout (chỉ text)
                        conditions:
                          - "{{ is_ios_android == 'ios_device' }}"
                        sequence:
                          - repeat:
                              for_each: "{{ filtered_devices }}"
                              sequence:
                                - continue_on_error: true
                                  action: >
                                    notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                                  data:
                                    title: !input notify_title
                                    message: "{{ error_message }}"
                                    data:
                                      tag: "{{ tag }}_text"

              - if:
                  - condition: template
                    value_template: "{{ include_telegram_notify }}"
                then:
                  - continue_on_error: true
                    action: telegram_bot.send_message
                    data: >
                      {% set data = {
                        'config_entry_id': telegram_config_entry,
                        'message': error_message,
                        'parse_mode': 'plain_text'
                      } %}
                      {% if telegram_target != "" %}
                        {% set data = dict(data, chat_id=telegram_target | int) %}
                      {% endif %}
                      {% if telegram_thread_id != "" %}
                        {% set data = dict(data, message_thread_id=telegram_thread_id | int) %}
                      {% endif %}
                      {{ data }}

              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ enable_zalo_bot }}"
                    sequence:
                      - continue_on_error: true
                        action: pyscript.send_zalo_message
                        data:
                          chat_id: "{{ zalo_bot_chat_id }}"
                          message: "{{ error_message }}"

              # thread_id bằng !input, KHÔNG qua template: ID Zalo 19 chữ số bị HA
              # diễn giải thành số rồi làm tròn qua float64 (đo thật …385728 → …385600).
              # `cv.string` ở đây tự chuyển nên KHÔNG có lỗi nào báo ra — tin đi êm vào
              # một ID SAI. Đó là kiểu sai tệ nhất: im lặng và không ai kiểm được.
              - choose:
                  - alias: "Kết quả AI → NHÓM"
                    conditions:
                      - condition: template
                        value_template: >
                          {{ enable_zalo_custom
                             and zalo_custom_receiver_type == '1'
                             and zalo_custom_thread_id | length > 0
                             and zalo_custom_account | length > 0 }}
                    sequence:
                      - continue_on_error: true
                        action: zalo_bot.send_message
                        data:
                          account_selection: !input zalo_custom_account
                          thread_id: !input zalo_custom_thread_id
                          type: "1"
                          message: "{{ error_message }}"
                          ttl: !input zalo_custom_ttl

                  - alias: "Kết quả AI → CÁ NHÂN"
                    conditions:
                      - condition: template
                        value_template: >
                          {{ enable_zalo_custom
                             and zalo_custom_receiver_type != '1'
                             and zalo_custom_user_id | length > 0
                             and zalo_custom_account | length > 0 }}
                    sequence:
                      - continue_on_error: true
                        action: zalo_bot.send_message
                        data:
                          account_selection: !input zalo_custom_account
                          thread_id: !input zalo_custom_user_id
                          type: "0"
                          message: "{{ error_message }}"
                          ttl: !input zalo_custom_ttl

  # ============================================================
  # BƯỚC CUỐI: COOLDOWN
  # ============================================================
  - delay:
      seconds: "{{ num_delay_actions }}"
  - delay: !input cooldown
