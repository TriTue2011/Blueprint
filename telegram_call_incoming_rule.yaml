blueprint:
  name: Telegram Call - Quy tắc cho cuộc gọi đến (tự nghe máy, báo ra loa, lời nhắn)
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/telegram_call_incoming_rule.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: |
    **Phiên bản: v.2026.11.16** — cùng mô hình với blueprint «Zalo Call - Quy tắc cho cuộc gọi đến».

    **Mỗi cuộc gọi Telegram đến kích hoạt automation này** (có lượt chạy/trace theo từng cuộc) và automation gọi `telegram_call.apply_call_rule` cho ĐÚNG cuộc gọi đó.
    Không lưu gì: tắt hay xoá automation là hết quy tắc. Nhiều automation khác nhau cho cùng một người vẫn chạy đủ: quy tắc cụ thể hơn thắng
    (người > thẻ > danh bạ > người lạ); cùng bậc thì mỗi quy tắc báo ra loa của riêng nó, còn nghe máy / thiết bị / lời nhắn theo quy tắc đầu tiên bật «Tự nghe máy».

    **Riêng tư:** không có quy tắc = chỉ đổ chuông. Thiết bị nhà do hai ô «nối ngay» / «nối khi người nhà nói trực tiếp» quyết: không tích = KHÔNG nối (nghe máy mà mic im lặng, video thì gửi hình đen).
    Cần tích hợp **Telegram Call** từ bản 2026.11.16.2. Telegram Call chưa có trợ lý AI trò chuyện trong cuộc gọi (khác Zalo): thay bằng **lời nhắn** đọc vào cuộc gọi.
  input:
    ap_dung:
      name: ① Áp dụng cho ai
      icon: mdi:account-filter-outline
      collapsed: true
      input:
        tai_khoan:
          name: Tài khoản Telegram
          description: |
            Gateway có NHIỀU tài khoản Telegram thì mỗi tài khoản là một mục Telegram Call riêng. Chọn tài khoản mà automation này lo:
            chỉ cuộc gọi ĐẾN tài khoản đó mới áp quy tắc (người nhận, tự nghe máy, loa/mic…). Mỗi tài khoản một automation, quy tắc riêng.
            Để trống = nhận cuộc gọi của MỌI tài khoản (khi chỉ có một tài khoản).
          selector:
            config_entry:
              integration: telegram_call
          default: ""
        bat_quy_tac:
          name: Bật quy tắc
          description: Tắt thì automation này không làm gì cho cuộc gọi nào.
          selector:
            boolean: {}
          default: true
        pham_vi:
          name: Phạm vi
          description: |
            Người cụ thể (chọn bên dưới) · mọi người mang MỘT thẻ (gắn bằng dịch vụ `telegram_call.set_contact_tags`) · mọi người trong danh bạ Telegram · người lạ (không có trong danh bạ).
            Quy tắc theo người thay hẳn quy tắc theo thẻ/danh bạ, nên một automation «chặn» một người thắng automation «cho phép danh bạ».
          selector:
            select:
              mode: dropdown
              options:
                - label: Người cụ thể (chọn bên dưới)
                  value: thread
                - label: Mọi người mang một thẻ
                  value: tag
                - label: Mọi người trong danh bạ Telegram
                  value: contacts
                - label: Người lạ (không có trong danh bạ)
                  value: strangers
          default: thread
        nguoi_cu_the:
          name: Người cụ thể (chọn từ danh sách)
          description: Chọn các thực thể `notify` của Telegram Call (người đã chọn ở Cấu hình → «Người nhận»; người còn lại trong danh bạ vẫn chọn được, gõ để lọc).
          selector:
            entity:
              multiple: true
              filter:
                - integration: telegram_call
                  domain: notify
          default: []
        them_theo_id:
          name: Hoặc thêm theo ID Telegram (mỗi dòng một ID)
          description: ID số của người gọi (xem dịch vụ `telegram_call.list_contacts`); dùng cho người lạ chưa có trong danh bạ.
          selector:
            text:
              multiple: true
          default: []
        the_tag:
          name: Thẻ (chỉ khi phạm vi là «thẻ»)
          selector:
            text: {}
          default: ""
        loai_cuoc_goi:
          name: Áp cho loại cuộc gọi
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Thoại
                  value: voice
                - label: Video
                  value: video
          default:
            - voice
            - video
        ten_goi:
          name: Tên đọc ra loa (tuỳ chọn)
          description: Trống = tên đã lưu trong danh bạ Telegram; người lạ thì đọc «người lạ».
          selector:
            text: {}
          default: ""
    nghe_may:
      name: ② Tự nghe máy và thiết bị nhà
      icon: mdi:phone-check-outline
      collapsed: true
      input:
        tu_nghe_may:
          name: Tự nghe máy
          selector:
            boolean: {}
          default: true
        nghe_sau:
          name: Nghe máy sau (giây)
          description: Người gọi cúp trước khi hết giờ thì không nghe. Nếu có báo ra loa thì chờ báo xong mới nghe.
          selector:
            number:
              min: 0
              max: 120
              step: 1
              unit_of_measurement: s
              mode: box
          default: 5
        noi_ngay:
          name: Nối NGAY khi nghe máy
          description: Không tích gì = mic im lặng (cuộc video thì gửi hình đen), chưa nối loa.
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Mic nhà
                  value: mic
                - label: Loa nhà (nghe tiếng người gọi)
                  value: speaker
                - label: Camera (cuộc gọi video)
                  value: camera
          default: []
        noi_khi_chuyen:
          name: Nối khi người nhà bấm «nói trực tiếp»
          description: Nút «Người nhà nói trực tiếp» trên thiết bị Telegram Call (hoặc dịch vụ `take_over_call`) nối các thiết bị này.
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Mic nhà
                  value: mic
                - label: Loa nhà (nghe tiếng người gọi)
                  value: speaker
                - label: Camera (cuộc gọi video)
                  value: camera
          default:
            - mic
            - speaker
        xu_ly_xin_video:
          name: Người gọi bật camera giữa cuộc thoại (xin chuyển sang video)
          description: "Hỏi (mặc định, riêng tư): chỉ báo sự kiện `telegram_call_call_state` trạng thái `video_request`, không tự đồng ý · Đồng ý, gửi hình đen: bật video nhưng không đưa hình trong nhà · Đồng ý và gửi camera: bật video kèm camera đã chọn ở ô «Camera» bên dưới (hoặc camera mặc định của tích hợp)."
          selector:
            select:
              mode: dropdown
              options:
                - label: Hỏi (chỉ báo sự kiện, không tự đồng ý)
                  value: ask
                - label: Đồng ý, gửi hình đen
                  value: accept
                - label: Đồng ý và gửi camera
                  value: accept_camera
          default: ask
        loa:
          name: Loa phát tiếng người gọi
          description: Loa R1 hoặc camera Imou/Dahua có cửa bộ đàm. Bỏ trống = loa mặc định của tích hợp.
          selector:
            entity:
              filter:
                - domain: media_player
          default: ""
        mic:
          name: Mic gửi tiếng trong nhà cho người gọi
          description: Vệ tinh Assist (loa R1) hoặc camera có mic. Bỏ trống = mic mặc định của tích hợp.
          selector:
            entity:
              filter:
                - domain:
                    - assist_satellite
                    - camera
          default: ""
        camera:
          name: Camera gửi hình (cuộc gọi video)
          selector:
            entity:
              filter:
                - domain: camera
          default: ""
        am_luong:
          name: Âm lượng loa lúc đang gọi (%)
          description: 0 = giữ nguyên âm lượng của loa.
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
          default: 0
        cau_chao:
          name: Lời nhắn đọc vào cuộc gọi khi nghe máy (tuỳ chọn)
          description: Giọng của pipeline đã chọn ở ③. Để trống = không đọc (bật «Cho AI nói chuyện» thì AI tự mở lời, không bắt buộc câu này).
          selector:
            text:
              multiline: true
          default: ""
        cup_sau_chao:
          name: Đọc xong lời nhắn thì cúp máy
          description: Bỏ qua nếu đã bật «Cho AI nói chuyện» (AI tự quyết lúc nào cúp).
          selector:
            boolean: {}
          default: false
        cho_ai_noi:
          name: Cho AI nói chuyện khi nghe máy
          description: >-
            AI nghe mic người gọi, hiểu và trả lời qua Assist pipeline đã chọn ở ③, lặp tới khi AI tự báo xong, người gọi im
            lặng, hoặc quá giờ (tối đa 10 phút). CHƯA có chuyển máy trực tiếp cho người nhà giữa chừng (bản đầu).
          selector:
            boolean: {}
          default: false
        nguoi_tin_cay:
          name: Người tin cậy (chỉ khi bật «Cho AI nói chuyện»)
          description: Tin cậy thì AI nói chuyện bình thường. Không tin cậy thì AI được dặn không tiết lộ thông tin gia đình/thiết bị.
          selector:
            boolean: {}
          default: false
        ai_tra_loi_tin:
          name: AI trả lời tin nhắn chữ của người này (ngoài cuộc gọi)
          description: >-
            Người gửi tin nhắn CHỮ cho tài khoản (không phải lúc gọi) cũng được AI trả lời, dùng chung Assist pipeline ở trên.
            Quy tắc này LƯU SẴN (khác apply_call_rule chỉ sống trong một cuộc gọi) — đặt lúc HA khởi động hoặc tải lại automation.
          selector:
            boolean: {}
          default: false
    bao_loa:
      name: ③ Báo ra loa khi có cuộc gọi đến
      icon: mdi:bullhorn-outline
      collapsed: true
      input:
        bat_bao_loa:
          name: Bật báo ra loa
          selector:
            boolean: {}
          default: false
        loa_bao:
          name: Loa dùng để báo (chọn nhiều)
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
          default: []
        tro_ly_giong_noi:
          name: Assist pipeline (lấy giọng đọc)
          description: Tên hoặc id pipeline; giọng TTS của nó dùng cho câu báo và lời nhắn. Trống = pipeline ưu tiên.
          selector:
            text: {}
          default: ""
        cau_bao:
          name: Câu báo
          description: "Dùng {ten} (tên người gọi) và {loai} (thoại/video). Trống = «Có cuộc gọi {loai} từ {ten}»."
          selector:
            text: {}
          default: ""
        lap_bao:
          name: Báo lại sau (giây)
          description: 0 = chỉ báo một lần; khác 0 thì đọc xong chờ chừng đó rồi đọc lại tới khi nghe máy hoặc cuộc gọi kết thúc.
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: s
              mode: box
          default: 0
        am_luong_bao:
          name: Âm lượng khi báo (%)
          description: 0 = giữ nguyên. Không ai nghe thì trả loa về mức cũ.
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
          default: 0
    thong_bao:
      name: ④ Thông báo
      icon: mdi:bell-outline
      collapsed: true
      input:
        bat_thong_bao:
          name: Báo ở chuông thông báo khi quy tắc được áp
          description: "Tiện cho việc thử: hiện «ĐÃ ÁP quy tắc cho cuộc gọi» kèm kết quả (queued / applied / late / duplicate)."
          selector:
            boolean: {}
          default: false

mode: parallel
max: 5

variables:
  tai_khoan: !input tai_khoan
  bat_quy_tac: !input bat_quy_tac
  pham_vi: !input pham_vi
  nguoi_cu_the: !input nguoi_cu_the
  them_theo_id: !input them_theo_id
  the_tag: !input the_tag
  loai_cuoc_goi: !input loai_cuoc_goi
  ten_goi: !input ten_goi
  tu_nghe_may: !input tu_nghe_may
  nghe_sau: !input nghe_sau
  noi_ngay: !input noi_ngay
  noi_khi_chuyen: !input noi_khi_chuyen
  loa_goc: !input loa
  loa: >-
    {{ (loa_goc if loa_goc is not string else ([loa_goc] if loa_goc else [])) | join(',') }}
  mic: !input mic
  camera: !input camera
  am_luong: !input am_luong
  xu_ly_xin_video: !input xu_ly_xin_video
  cau_chao: !input cau_chao
  cup_sau_chao: !input cup_sau_chao
  cho_ai_noi: !input cho_ai_noi
  nguoi_tin_cay: !input nguoi_tin_cay
  ai_tra_loi_tin: !input ai_tra_loi_tin
  bat_bao_loa: !input bat_bao_loa
  loa_bao_goc: !input loa_bao
  loa_bao: >-
    {{ (loa_bao_goc if loa_bao_goc is not string else ([loa_bao_goc] if loa_bao_goc else [])) | join(',') }}
  tro_ly_giong_noi: !input tro_ly_giong_noi
  cau_bao: !input cau_bao
  lap_bao: !input lap_bao
  am_luong_bao: !input am_luong_bao
  bat_thong_bao: !input bat_thong_bao
  # Chú ý: HA đọc kết quả mẫu thành số nếu trông như số, nên mọi phép so sánh ID bên dưới ép `| string` hai vế.
  ds_nguoi: >-
    {% set ns = namespace(l=[]) %}
    {% for e in nguoi_cu_the %}{% set ns.l = ns.l + [state_attr(e, 'user_id') | string] %}{% endfor %}
    {% for ma in them_theo_id %}{% set m = ma | string | trim %}{% if m is match('^[0-9]+$') %}{% set ns.l = ns.l + [m] %}{% endif %}{% endfor %}
    {{ ns.l | unique | list }}
  muc_tieu: "{{ ds_nguoi if pham_vi == 'thread' else [''] }}"

triggers:
  # MỖI cuộc gọi đến kích hoạt automation này; chính nó áp quy tắc cho cuộc đó.
  - trigger: event
    event_type: telegram_call_call_state
    event_data:
      state: incoming
    id: cuoc_goi
  # Lúc HA khởi động / tải lại automation: dọn quy tắc LƯU SẴN cũ và đặt lại phần trả lời TIN NHẮN (apply_call_rule không lưu gì,
  # chỉ sống trong một cuộc gọi — tin nhắn không qua đó nên cần set_rule riêng, một lần, ở đây).
  - trigger: homeassistant
    event: start
    id: khoi_dong
  - trigger: event
    event_type: automation_reloaded
    id: khoi_dong

actions:
  - alias: Khởi động / tải lại - dọn quy tắc cũ và đặt phần trả lời tin nhắn
    if:
      - condition: template
        value_template: "{{ trigger.id == 'khoi_dong' }}"
    then:
      - repeat:
          for_each: "{{ muc_tieu }}"
          sequence:
            - alias: Xoá quy tắc cũ trong kho của mục tiêu (bản blueprint trước ghi vào kho và nó sống mãi dù tắt automation)
              action: telegram_call.remove_rule
              data: >-
                {% set d = {'scope': pham_vi} %}
                {% if pham_vi == 'thread' %}{% set d = dict(d, thread_id=repeat.item | string) %}{% endif %}
                {% if pham_vi == 'tag' %}{% set d = dict(d, tag=the_tag | trim) %}{% endif %}
                {{ (d) | combine({'config_entry_id': tai_khoan}) }}
            - alias: Phần trả lời tin nhắn bằng AI (tin nhắn chưa đi qua automation nên vẫn lưu trong kho)
              if:
                - condition: template
                  value_template: "{{ bat_quy_tac and ai_tra_loi_tin }}"
              then:
                - action: telegram_call.set_rule
                  data: >-
                    {% set d = {'scope': pham_vi, 'ai_reply_text': true} %}
                    {% if pham_vi == 'thread' %}{% set d = dict(d, thread_id=repeat.item | string) %}{% endif %}
                    {% if pham_vi == 'tag' %}{% set d = dict(d, tag=the_tag | trim) %}{% endif %}
                    {% if ten_goi | trim != '' %}{% set d = dict(d, name=ten_goi | trim) %}{% endif %}
                    {% if tro_ly_giong_noi | trim != '' %}{% set d = dict(d, pipeline=tro_ly_giong_noi | trim) %}{% endif %}
                    {{ (d) | combine({'config_entry_id': tai_khoan}) }}
  - alias: Chỉ khi quy tắc đang bật và cuộc gọi thuộc đối tượng của quy tắc
    condition: template
    value_template: >-
      {% set d = trigger.event.data %}
      {{ bat_quy_tac and (tai_khoan | default('', true) == '' or d.config_entry_id == tai_khoan) and (
           (pham_vi == 'thread' and (d.user_id | string) in ds_nguoi)
        or (pham_vi == 'contacts' and d.contact_status == 'friend')
        or (pham_vi == 'strangers' and d.contact_status == 'stranger')
        or (pham_vi == 'tag' and (the_tag | trim) != '' and ((the_tag | trim | lower) in (d.tags | default([], true)))) ) }}
  - alias: Áp quy tắc cho cuộc gọi
    action: telegram_call.apply_call_rule
    response_variable: ket_qua
    data: >-
      {% set d = {'config_entry_id': trigger.event.data.config_entry_id, 'call_id': trigger.event.data.call_id | string, 'scope': pham_vi, 'source': this.entity_id,
                  'answer': tu_nghe_may, 'answer_delay': nghe_sau | int(5), 'call_types': loai_cuoc_goi,
                  'announce': bat_bao_loa and loa_bao != '', 'connect_now': noi_ngay, 'connect': noi_khi_chuyen, 'video_request': xu_ly_xin_video,
                  'announce_repeat': lap_bao | int(0), 'announce_volume': am_luong_bao | int(0), 'hangup_after': cup_sau_chao and cau_chao | trim != '',
                  'ai': cho_ai_noi, 'trusted': nguoi_tin_cay} %}
      {% if ten_goi | trim != '' %}{% set d = dict(d, name=ten_goi | trim) %}{% endif %}
      {% if tro_ly_giong_noi | trim != '' %}{% set d = dict(d, pipeline=tro_ly_giong_noi | trim) %}{% endif %}
      {% if cau_chao | trim != '' %}{% set d = dict(d, greeting=cau_chao | trim) %}{% endif %}
      {% if bat_bao_loa and loa_bao != '' %}{% set d = dict(d, announce_to=loa_bao) %}{% endif %}
      {% if cau_bao | trim != '' %}{% set d = dict(d, announce_text=cau_bao | trim) %}{% endif %}
      {% if loa != '' %}{% set d = dict(d, speaker=loa) %}{% endif %}
      {% if mic != '' %}{% set d = dict(d, mic=mic) %}{% endif %}
      {% if camera != '' %}{% set d = dict(d, camera=camera) %}{% endif %}
      {% if am_luong | int(0) > 0 %}{% set d = dict(d, volume=am_luong | int) %}{% endif %}
      {{ d }}
  - alias: Báo ở chuông thông báo (chỉ khi bật ô «Báo ở chuông thông báo»)
    if:
      - condition: template
        value_template: "{{ bat_thong_bao }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "telegram_call_quy_tac_{{ this.entity_id }}_{{ trigger.event.data.call_id }}"
          title: "Telegram Call: ĐÃ ÁP quy tắc cho cuộc gọi"
          message: |-
            Cuộc gọi {{ trigger.event.data.call_id }} từ {{ trigger.event.data.name or trigger.event.data.user_id }} ({{ trigger.event.data.contact_status }}).
            Phạm vi: {{ pham_vi }} · kết quả: {{ ket_qua.status if ket_qua is defined and ket_qua else '?' }} · tự nghe: {{ 'có sau ' ~ nghe_sau ~ ' giây' if tu_nghe_may else 'không' }}.
