blueprint:
  name: Zalo Call - Nhấn nút ở đâu, nói chuyện hoặc video bằng thiết bị ở đó
  author: TriTue2011
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/zalo_call_nut_theo_thiet_bi.yaml
  homeassistant:
    min_version: 2026.3.0
  domain: automation
  description: |
    **Mỗi nút một bộ thiết bị.** Khai tối đa 6 nút (ví dụ nút phòng khách, nút bếp, nút phòng ngủ...). Nút nào được nhấn thì cuộc gọi Zalo dùng **loa, mic, camera và âm lượng của nút đó**,
    nên nhấn ở phòng nào thì nói chuyện hoặc gọi video bằng thiết bị ở phòng đó.

    - **Thiết bị dự phòng**: mỗi nút có thể chọn nhiều loa / mic / camera theo thứ tự ưu tiên; phần **thiết bị dự phòng chung** được nối vào cuối danh sách, nên thiết bị của nút không dùng được thì lấy thiết bị kế.
    - **Việc làm khi nhấn** (theo từng nút): *Thông minh* (có cuộc gọi đến thì nghe máy, đang nói chuyện thì cúp, rảnh thì gọi), *Gọi đi*, *Nghe máy*, *Cúp máy*.
    - **Thoại hay video** theo từng nút: tự chọn (có camera thì gọi video), chỉ thoại hoặc luôn video.
    - Người nhận: mỗi nút có thể gọi một người riêng, không chọn thì gọi người đầu tiên trong danh sách chung.
    - Nút là thực thể bất kỳ có đổi trạng thái khi nhấn (button, input_button, event, công tắc, cảm biến). Chuyển sang «không khả dụng» không tính là nhấn.

    **Phiên bản: v.2026.11.15**
  input:
    chung:
      name: ① Dùng chung
      icon: mdi:cog-outline
      input:
        nguoi_nhan:
          name: Người gọi mặc định (chọn nhiều)
          description: Thực thể notify.zalo_call_... Nút nào không chọn người riêng thì gọi người ĐẦU TIÊN (chỉ người 1-1 gọi điện được).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: zalo_call
                  domain: notify
        ma_nguoi:
          name: Hoặc theo mã Zalo (threadID)
          description: Mỗi dòng một mã, chỉ gồm chữ số.
          default: []
          selector:
            text:
              multiple: true
        cam_bien_cuoc_goi:
          name: Cảm biến «Trạng thái cuộc gọi» của Zalo Call
          description: Để việc «Thông minh» biết đang đổ chuông, đang nói chuyện hay rảnh. Để trống thì coi như luôn rảnh.
          default: ""
          selector:
            entity:
              filter:
                - integration: zalo_call
                  domain: sensor
        loa_chung:
          name: Loa dự phòng chung
          description: Nối vào cuối danh sách loa của mỗi nút (thứ tự ưu tiên).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        mic_chung:
          name: Mic dự phòng chung
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - assist_satellite
                    - camera
        camera_chung:
          name: Camera dự phòng chung
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera
        am_luong_chung:
          name: Âm lượng loa mặc định (%)
          description: Dùng khi nút không đặt âm lượng riêng. 0 = giữ nguyên âm lượng loa.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    nut_1:
      name: ② Nút 1
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        nut_1:
          name: Nút (thực thể, chọn nhiều nếu cùng một chỗ)
          description: Để trống = bỏ qua nút này. Mỗi lần thực thể đổi trạng thái là một lần nhấn.
          default: []
          selector:
            entity:
              multiple: true
        ten_1:
          name: Tên chỗ đặt nút
          description: Ví dụ «Phòng khách». Dùng trong nhật ký.
          default: ""
          selector:
            text: {}
        hanh_dong_1:
          name: Khi nhấn thì
          default: thong_minh
          selector:
            select:
              mode: dropdown
              options:
                - label: Thông minh (đến thì nghe, đang nói thì cúp, rảnh thì gọi)
                  value: thong_minh
                - label: Gọi đi
                  value: goi
                - label: Nghe máy
                  value: nghe_may
                - label: Cúp máy
                  value: cup_may
        kieu_1:
          name: Thoại hay video
          default: tu_chon
          selector:
            select:
              mode: dropdown
              options:
                - label: Tự chọn (có camera thì gọi video)
                  value: tu_chon
                - label: Chỉ thoại
                  value: thoai
                - label: Luôn video
                  value: video
        nguoi_1:
          name: Gọi người riêng cho nút này (tuỳ chọn)
          description: Để trống = gọi người đầu tiên trong danh sách chung.
          default: ""
          selector:
            entity:
              filter:
                - integration: zalo_call
                  domain: notify
        loa_1:
          name: Loa của nút (thứ tự ưu tiên)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        mic_1:
          name: Mic của nút (thứ tự ưu tiên)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - assist_satellite
                    - camera
        camera_1:
          name: Camera của nút (thứ tự ưu tiên)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera
        am_luong_1:
          name: Âm lượng loa của nút (%)
          description: 0 = dùng âm lượng mặc định chung.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        do_to_mic_1:
          name: Độ to mic gửi đi của nút (%)
          description: Độ to phần mềm, 0 = theo mặc định của Zalo Call.
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 5
              unit_of_measurement: "%"
              mode: slider
        do_to_loa_1:
          name: Độ to tiếng bên kia ra loa của nút (%)
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 5
              unit_of_measurement: "%"
              mode: slider
