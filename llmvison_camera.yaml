blueprint:
  name: LLM Vision camera
  author: TriTue2011
  homeassistant:
    min_version: 2024.10.0
  description: >
    Tóm tắt sự kiện cửa ra vào bằng AI với phát hiện người.
    Hỗ trợ gửi thông báo qua điện thoại, Zalo (Bot, Custom, Calling) và phân tích camera khi cửa mở
    và phát hiện người trong khu vực.
  domain: automation
  source_url: https://github.com/TriTue2011/Blueprint/blob/main/llmvison_camera.yaml

  input:
    door_contact_sensor:
      name: Door Contact Sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor

    door_from_state:
      name: Door From State
      default: "off"
      selector:
        select:
          options: ["off", "on"]
          custom_value: true

    door_to_state:
      name: Door To State
      default: "on"
      selector:
        select:
          options: ["on", "off"]
          custom_value: true

    person_occupancy_sensor:
      name: Person Occupancy Sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor

    person_detected_state:
      name: Person Detected State
      default: "on"
      selector:
        select:
          options: ["on", "off"]
          custom_value: true

    wait_for_person:
      name: Wait for Person Detection
      default: true
      selector:
        boolean: {}

    person_wait_time:
      name: Person Detection Wait Time
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration: {}

    max_wait_time:
      name: Maximum Wait Time (Optional)
      description: 0 = unlimited
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box
          step: 1

    run_conditions:
      name: Run Conditions
      default: []
      selector:
        condition: {}

    cooldown:
      name: Cooldown
      default:
        minutes: 10
      selector:
        duration: {}

    camera_sensor_section:
      name: Camera & Sensor Settings
      icon: mdi:camera
      collapsed: true
      input:
        camera_entities:
          name: Camera Entities
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera

        duration:
          name: Duration
          default: 5
          selector:
            number:
              min: 1
              max: 60
              step: 1

        max_frames:
          name: Max Frames
          default: 3
          selector:
            number:
              min: 1
              max: 60
              step: 1

    ai_section:
      name: AI Settings
      icon: mdi:brain
      collapsed: true
      input:
        remember:
          name: Store in Timeline
          default: true
          selector:
            boolean: {}

        use_memory:
          name: Use Memory
          default: false
          selector:
            boolean: {}

        message:
          name: Prompt
          default: >
            Analyze the door entry event. Identify who entered (person
            description, clothing, items carried), their actions, and any
            notable details. If multiple people are present, describe each
            person. Focus on security-relevant information. Present the
            information naturally without mentioning images.
          selector:
            text:
              multiline: true

        provider:
          name: Provider
          selector:
            config_entry:
              integration: llmvision

        model:
          name: Model
          selector:
            text: {}

        target_width:
          name: Target Width
          default: 1280
          selector:
            number:
              min: 512
              max: 3840
              step: 1

        max_tokens:
          name: Maximum Tokens
          default: 5000
          selector:
            number:
              step: 1
              mode: box

    notification_section:
      name: Notification Settings
      icon: mdi:bell
      collapsed: true
      input:
        notify:
          name: Notify
          default: true
          selector:
            boolean: {}

        take_snapshot:
          name: Take Snapshot
          description: Chụp ảnh từ camera khi cửa mở để dùng cho notify/Zalo
          default: true
          selector:
            boolean: {}

        condition_notify:
          name: Condition to Notify
          default: []
          selector:
            condition: {}

        notify_device:
          name: Notify Device
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

        notification_delivery:
          name: Notification Delivery
          default: Dynamic
          selector:
            select:
              options:
                - Dynamic
                - Consolidated

        preview_mode:
          name: Preview Mode
          default: Snapshot
          selector:
            select:
              options:
                - Snapshot
                - Live Preview

        analysis_mode:
          name: Analysis Mode
          default: Snapshot
          selector:
            select:
              options:
                - Snapshot
                - Live Preview

        notification_time:
          name: Notification Time
          default: ""
          selector:
            select:
              options:
                - label: No Time Added
                  value: ""
                - label: 12 Hour
                  value: "at {{ now().strftime('%-I:%M %p') }}"
                - label: 24 Hour
                  value: "at {{ now().strftime('%H:%M') }}"

        file_path:
          name: File Path
          default: /media/llmvision/snapshots/{{ camera_file_path }}/last_entry.jpg
          selector:
            select:
              options:
                - label: Media Folder - Secured
                  value: /media/llmvision/snapshots/{{ camera_file_path }}/last_entry.jpg
                - label: Public Folder - Unsecured
                  value: /config/www/snapshots/{{ camera_file_path }}/last_entry.jpg
              custom_value: true

        tap_navigate:
          name: Tap Navigate
          default: /lovelace/0
          selector:
            text: {}

        delay_notification:
          name: Notification Cooldown
          default: 60
          selector:
            number:
              min: 0
              max: 86400
              step: 1
              mode: box

        notification_sticky:
          name: Sticky - Android Only
          default: true
          selector:
            boolean: {}

        notification_color:
          name: Notification Color - Android Only
          default: "#03a9f4"
          selector:
            select:
              options:
                - label: Steelblue - #03a9f4
                  value: "#03a9f4"
                - label: Red - #f44336
                  value: "#f44336"
                - label: Orange - #ff9800
                  value: "#ff9800"
                - label: Green - #4caf50
                  value: "#4caf50"
              custom_value: true

        notification_icon:
          name: Notification Icon - Android Only
          default: mdi:door-open
          selector:
            icon: {}

        notification_channel:
          name: Notification Channel - Android Only
          default: "Door Entry"
          selector:
            text: {}

        notification_sound:
          name: Notification Sound - iOS Only
          default: default
          selector:
            select:
              options:
                - label: Default
                  value: default
                - label: None
                  value: none
              custom_value: true

        notification_volume:
          name: Volume Sound - iOS Only
          default: 1
          selector:
            number:
              min: 0
              max: 1
              step: 0.1

        notification_critical:
          name: Critical Notification - iOS Only
          default: false
          selector:
            boolean: {}

    zalo_settings:
      name: Zalo Notifications Settings
      icon: mdi:message-image-outline
      collapsed: true
      input:
        include_zalo_notify:
          name: Use Zalo Notifications
          default: false
          selector:
            boolean: {}

        zalo_group_id:
          name: Zalo Group ID
          description: >
            ID nhóm hoặc người dùng Zalo. Nhập dạng text để tránh mất độ
            chính xác với số lớn (VD: 3295299208151385728).
          default: ""
          selector:
            text: {}

        zalo_phone:
          name: Zalo Acc
          default: "+84000000000"
          selector:
            text: {}

        zalo_types:
          name: Zalo Type
          default: "0"
          selector:
            select:
              options:
                - label: User
                  value: "0"
                - label: Group
                  value: "1"

        zalo_ttl:
          name: TTL
          default: 0
          selector:
            number:
              min: 0
              max: 86400000
              # FIX: đổi step từ 1 thành 1000 (đơn vị ms, step 1 vô nghĩa)
              step: 1000
              unit_of_measurement: ms

    zalo_calling_settings:
      name: Zalo Calling (chọn người nhận từ danh sách)
      icon: mdi:phone-message-outline
      collapsed: true
      input:
        include_zalo_calling:
          name: ✅ Bật gửi qua Zalo Calling
          description: >-
            Gửi qua tích hợp Zalo Calling (kho TriTue2011/Zalo-calling, bản 2026.11.11.3 trở lên). Người nhận chọn từ danh sách
            (Ralo → Cấu hình → Người và nhóm nhận), người và nhóm lẫn lộn đều được, mỗi người đúng loại của mình.
          default: false
          selector:
            boolean: {}
        zalo_calling_tai_khoan:
          name: 📱 Tài khoản Zalo gửi đi (tuỳ chọn)
          description: >-
            Chỉ cần khi máy chủ có nhiều tài khoản Zalo (mỗi tài khoản là một mục «Ralo»). Để trống = tài khoản mặc định.
          default: ""
          selector:
            config_entry:
              integration: zalo_call

        zalo_calling_recipients:
          name: 👥 Người nhận Zalo Calling (chọn nhiều)
          description: Thực thể notify.zalo_call_... của Zalo Calling.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: zalo_call
                  domain: notify

        zalo_calling_ma_nguoi:
          name: ➕ Thêm người theo mã Zalo (threadID)
          description: Mỗi dòng một mã, chỉ gồm chữ số. Người bất kỳ, không cần cấu hình tích hợp. Xem mã ở *Công cụ nhà phát triển → Hành động → zalo_call.list_contacts*. Dùng cùng ô chọn bên trên cũng được.
          default: []
          selector:
            text:
              multiple: true
        zalo_calling_ma_nhom:
          name: ➕ Thêm nhóm theo mã Zalo (threadID)
          description: Mỗi dòng một mã nhóm, chỉ gồm chữ số.
          default: []
          selector:
            text:
              multiple: true

        # ---- Tham số của dịch vụ gửi tin Zalo Calling (sinh bởi bp_zalo_params.py; «Theo mặc định» = không gửi trường đó) ----
        zalo_calling_ttl:
          name: ⏳ Tự xóa tin sau (ms)
          description: >-
            0 = không tự xóa. Zalo chỉ nhận một số mức cố định (1, 7, 14, 30 ngày); mức khác app sẽ báo lỗi.
          default: 0
          selector:
            number:
              min: 0
              max: 2592000000
              step: 1000
              mode: box
              unit_of_measurement: "ms"
        zalo_calling_recall_after:
          name: ↩️ Tự thu hồi sau (giây)
          description: >-
            0 = không thu hồi. Tin biến mất ở cả hai bên đúng giờ; hẹn giờ nằm trong app nên vẫn chạy khi HA khởi động lại. Tối đa 86400 giây.
          default: 0
          selector:
            number:
              min: 0
              max: 86400
              step: 1
              mode: box
              unit_of_measurement: "s"
        zalo_calling_format:
          name: 🔤 Định dạng chữ
          description: >-
            plain = chữ thường · markdown = **đậm**, __gạch chân__… Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "plain"
                  value: "plain"
                - label: "markdown"
                  value: "markdown"
        zalo_calling_text_color:
          name: 🎨 Màu chữ
          description: >-
            auto = tô màu các con số; hoặc chọn một màu cho cả tin. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "auto"
                  value: "auto"
                - label: "red"
                  value: "red"
                - label: "orange"
                  value: "orange"
                - label: "yellow"
                  value: "yellow"
                - label: "green"
                  value: "green"
        zalo_calling_font_size:
          name: 🔠 Cỡ chữ
          description: >-
            auto = tiêu đề to, dòng trong ngoặc nhỏ. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "small"
                  value: "small"
                - label: "big"
                  value: "big"
                - label: "auto"
                  value: "auto"
        zalo_calling_bold:
          name: 🅱️ In đậm
          description: >-
            auto = in đậm các con số. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_italic:
          name: 𝑰 In nghiêng
          description: >-
            auto = nghiêng đoạn trong dấu "…" hoặc (…). Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_underline:
          name: U̲ Gạch chân
          description: >-
            auto = gạch chân liên kết, email. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_heading:
          name: 📰 Tiêu đề
          description: >-
            on = dòng đầu thành tiêu đề; auto = tự nhận dòng đầu ngắn. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "off"
                  value: "off"
                - label: "on"
                  value: "on"
                - label: "auto"
                  value: "auto"
        zalo_calling_auto_emoji:
          name: 😀 Tự thêm emoji
          description: >-
            true = tự chọn emoji theo nội dung; false = không. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "true"
                  value: "true"
                - label: "false"
                  value: "false"
        zalo_calling_ai_style:
          name: 🧠 Nhờ AI chọn định dạng
          description: >-
            true = nhờ trợ lý AI đánh giá các mục «auto» (thêm vài giây); false = quy tắc tức thì. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "true"
                  value: "true"
                - label: "false"
                  value: "false"
        zalo_calling_emoji:
          name: 🎯 Emoji đầu tin
          description: >-
            Tên emoji gắn vào đầu tin chữ (alert = 🚨, door = 🚪…); gõ thêm tên riêng được. Chọn «Theo mặc định» để không gửi trường này.
          default: default
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Theo mặc định trên thiết bị"
                  value: "default"
                - label: "ok"
                  value: "ok"
                - label: "x"
                  value: "x"
                - label: "warn"
                  value: "warn"
                - label: "alert"
                  value: "alert"
                - label: "info"
                  value: "info"
                - label: "hoi"
                  value: "hoi"
                - label: "idea"
                  value: "idea"
                - label: "fire"
                  value: "fire"
                - label: "water"
                  value: "water"
                - label: "temp"
                  value: "temp"
                - label: "sun"
                  value: "sun"
                - label: "rain"
                  value: "rain"
                - label: "moon"
                  value: "moon"
                - label: "door"
                  value: "door"
                - label: "lock"
                  value: "lock"
                - label: "unlock"
                  value: "unlock"
                - label: "bell"
                  value: "bell"
                - label: "home"
                  value: "home"
                - label: "car"
                  value: "car"
                - label: "wifi"
                  value: "wifi"
                - label: "battery"
                  value: "battery"
                - label: "power"
                  value: "power"
                - label: "tv"
                  value: "tv"
                - label: "music"
                  value: "music"
                - label: "camera"
                  value: "camera"
                - label: "video"
                  value: "video"
                - label: "phone"
                  value: "phone"
                - label: "time"
                  value: "time"
                - label: "calendar"
                  value: "calendar"
                - label: "heart"
                  value: "heart"
                - label: "like"
                  value: "like"
                - label: "clap"
                  value: "clap"
                - label: "party"
                  value: "party"
                - label: "star"
                  value: "star"
                - label: "money"
                  value: "money"
        zalo_calling_video_caption_inside:
          name: 🎬 Chú thích nằm TRONG video
          description: >-
            Bật: chữ chú thích đi cùng video (một tin duy nhất). Tắt: gửi một tin chữ riêng rồi mới tới video.
          default: true
          selector:
            boolean: {}
        zalo_calling_video_thumbnail:
          name: 🖼️ Ảnh bìa video (tùy chọn)
          description: >-
            Đường dẫn JPEG trong HA (thư mục được phép) hoặc URL. Để trống = khung hình đầu của chính video.
          default: ""
          selector:
            text: {}
    experimental_section:
      name: Additional Settings
      icon: mdi:cog
      collapsed: true
      input:
        additional_actions:
          name: Additional Actions
          default: []
          selector:
            action: {}

# ============================================================
# VARIABLES
# ============================================================
variables:
  door_contact: !input door_contact_sensor
  door_from_state: !input door_from_state
  door_to_state: !input door_to_state
  person_sensor: !input person_occupancy_sensor
  person_detected_state: !input person_detected_state
  wait_for_person: !input wait_for_person
  person_wait_time: !input person_wait_time
  max_wait_time: !input max_wait_time
  remember: !input remember
  cooldown: !input cooldown
  preview_mode: !input preview_mode
  analysis_mode: !input analysis_mode
  notify_devices: !input notify_device
  notification_delivery: !input notification_delivery
  notification_sticky: !input notification_sticky
  notification_color: !input notification_color
  notification_icon: !input notification_icon
  notification_channel: !input notification_channel
  notification_sound: !input notification_sound
  notification_volume: !input notification_volume
  notification_critical: !input notification_critical
  additional_actions: !input additional_actions
  notify: !input notify
  condition_notify: !input condition_notify
  delay_notification: !input delay_notification
  include_zalo_notify: !input include_zalo_notify
  zalo_group_id: !input zalo_group_id
  zalo_phone: !input zalo_phone
  zalo_types: !input zalo_types
  zalo_ttl: !input zalo_ttl
  include_zalo_calling: !input include_zalo_calling
  zalo_calling_tai_khoan: !input zalo_calling_tai_khoan
  zalo_calling_recipients: !input zalo_calling_recipients
  zalo_calling_ma_nguoi: !input zalo_calling_ma_nguoi
  zalo_calling_ma_nhom: !input zalo_calling_ma_nhom
  zalo_calling_ttl: !input zalo_calling_ttl
  zalo_calling_recall_after: !input zalo_calling_recall_after
  zalo_calling_format: !input zalo_calling_format
  zalo_calling_text_color: !input zalo_calling_text_color
  zalo_calling_font_size: !input zalo_calling_font_size
  zalo_calling_bold: !input zalo_calling_bold
  zalo_calling_italic: !input zalo_calling_italic
  zalo_calling_underline: !input zalo_calling_underline
  zalo_calling_heading: !input zalo_calling_heading
  zalo_calling_auto_emoji: !input zalo_calling_auto_emoji
  zalo_calling_ai_style: !input zalo_calling_ai_style
  zalo_calling_emoji: !input zalo_calling_emoji
  zalo_calling_video_caption_inside: !input zalo_calling_video_caption_inside
  zalo_calling_video_thumbnail: !input zalo_calling_video_thumbnail
  zc_opt_msg: >-
    {% set o = {} %}
    {% if zalo_calling_tai_khoan | string | trim != '' %}{% set o = dict(o, entry_id=zalo_calling_tai_khoan | string | trim) %}{% endif %}
    {% if zalo_calling_ttl | int(0) > 0 %}{% set o = dict(o, ttl=zalo_calling_ttl | int) %}{% endif %}
    {% if zalo_calling_recall_after | int(0) > 0 %}{% set o = dict(o, recall_after=zalo_calling_recall_after | int) %}{% endif %}
    {% if zalo_calling_format | string not in ['default', ''] %}{% set o = dict(o, format=zalo_calling_format) %}{% endif %}
    {% if zalo_calling_text_color | string not in ['default', ''] %}{% set o = dict(o, text_color=zalo_calling_text_color) %}{% endif %}
    {% if zalo_calling_font_size | string not in ['default', ''] %}{% set o = dict(o, font_size=zalo_calling_font_size) %}{% endif %}
    {% if zalo_calling_bold | string not in ['default', ''] %}{% set o = dict(o, bold=zalo_calling_bold) %}{% endif %}
    {% if zalo_calling_italic | string not in ['default', ''] %}{% set o = dict(o, italic=zalo_calling_italic) %}{% endif %}
    {% if zalo_calling_underline | string not in ['default', ''] %}{% set o = dict(o, underline=zalo_calling_underline) %}{% endif %}
    {% if zalo_calling_heading | string not in ['default', ''] %}{% set o = dict(o, heading=zalo_calling_heading) %}{% endif %}
    {% if zalo_calling_auto_emoji | string not in ['default', ''] %}{% set o = dict(o, auto_emoji=(zalo_calling_auto_emoji == 'true')) %}{% endif %}
    {% if zalo_calling_ai_style | string not in ['default', ''] %}{% set o = dict(o, ai_style=(zalo_calling_ai_style == 'true')) %}{% endif %}
    {% if zalo_calling_emoji | string not in ['default', ''] %}{% set o = dict(o, emoji=zalo_calling_emoji | string) %}{% endif %}
    {{ o }}
  zc_opt_media: >-
    {% set o = {} %}
    {% if zalo_calling_tai_khoan | string | trim != '' %}{% set o = dict(o, entry_id=zalo_calling_tai_khoan | string | trim) %}{% endif %}
    {% if zalo_calling_ttl | int(0) > 0 %}{% set o = dict(o, ttl=zalo_calling_ttl | int) %}{% endif %}
    {% if zalo_calling_recall_after | int(0) > 0 %}{% set o = dict(o, recall_after=zalo_calling_recall_after | int) %}{% endif %}
    {{ o }}
  zc_opt_video: >-
    {% set o = {} %}
    {% if zalo_calling_tai_khoan | string | trim != '' %}{% set o = dict(o, entry_id=zalo_calling_tai_khoan | string | trim) %}{% endif %}
    {% if zalo_calling_ttl | int(0) > 0 %}{% set o = dict(o, ttl=zalo_calling_ttl | int) %}{% endif %}
    {% if zalo_calling_recall_after | int(0) > 0 %}{% set o = dict(o, recall_after=zalo_calling_recall_after | int) %}{% endif %}
    {% if zalo_calling_video_thumbnail | string | trim != '' %}{% set o = dict(o, thumbnail=zalo_calling_video_thumbnail | string | trim) %}{% endif %}
    {{ o }}
  zalo_calling_ds: >-
    {% set ns = namespace(l=[], ids=[]) %}
    {% for e in zalo_calling_recipients %}{% set t = state_attr(e, 'thread_id') | string %}{% if t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': state_attr(e, 'type') | string}] %}{% endif %}{% endfor %}
    {% for m in zalo_calling_ma_nguoi %}{% set t = m | string | trim %}{% if t is match('^[0-9]+$') and t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': 'user'}] %}{% endif %}{% endfor %}
    {% for m in zalo_calling_ma_nhom %}{% set t = m | string | trim %}{% if t is match('^[0-9]+$') and t not in ns.ids %}{% set ns.ids = ns.ids + [t] %}{% set ns.l = ns.l + [{'thread_id': t, 'type': 'group'}] %}{% endif %}{% endfor %}
    {{ ns.l }}
  take_snapshot: !input take_snapshot

  camera_entities_list: !input camera_entities
  camera_entity: "{{ camera_entities_list[0] if camera_entities_list else '' }}"
  camera_entity_snapshot: "{{ camera_entities_list[0] if camera_entities_list else '' }}"
  camera_file_path: "{{ camera_entity_snapshot.replace('camera.', '') }}"
  file_path: !input file_path

  # FIX: sửa replace đúng prefix để path hợp lệ khi truy cập qua HA
  snapshot_access_file_path: >
    {{ file_path | replace('/config/www', '/local') | replace('/media', '/media/local') }}
  # FIX: sửa từ replace('/media/local','/media') → replace('/media/llmvision','/media')
  # vì file_path gốc có dạng /media/llmvision/... không phải /media/local/...
  snapshot_access_file_path_social: >
    {{ file_path | replace('/media/llmvision', '/media') }}

  tag: "{{ camera_entity + int(as_timestamp(now())) | string }}"
  label: "Door Entry Detected"
  notification_time: !input notification_time

  device_name_map: >
    {% set ns = namespace(device_names=[]) %}
    {% for device_id in notify_devices %}
      {% set device_name = device_attr(device_id, "name") %}
      {% set sanitized_name = "mobile_app_" + device_name | slugify %}
      {% set ns.device_names = ns.device_names + [sanitized_name] %}
    {% endfor %}
    {{ ns.device_names }}

max_exceeded: silent
mode: single

# ============================================================
# TRIGGER
# ============================================================
triggers:
  - trigger: state
    entity_id: !input door_contact_sensor
    id: door
    from: !input door_from_state
    to: !input door_to_state

# ============================================================
# CONDITION
# ============================================================
conditions:
  - condition: and
    conditions: !input run_conditions

# ============================================================
# ACTION
# ============================================================
actions:

  # === 1. WAIT FOR PERSON (nếu bật) ===
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait_for_person }}"
        sequence:
          - if:
              - condition: state
                entity_id: !input person_occupancy_sensor
                state: !input person_detected_state
            then: []
            else:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ max_wait_time == 0 }}"
                    sequence:
                      - wait_for_trigger:
                          - trigger: state
                            entity_id: !input person_occupancy_sensor
                            to: !input person_detected_state
                        continue_on_timeout: true
                  - conditions:
                      - condition: template
                        value_template: "{{ max_wait_time > 0 }}"
                    sequence:
                      - wait_for_trigger:
                          - trigger: state
                            entity_id: !input person_occupancy_sensor
                            to: !input person_detected_state
                        timeout:
                          seconds: "{{ max_wait_time }}"
                        continue_on_timeout: true

  # === 2. NOTIFY BAN ĐẦU (ảnh placeholder "analyzing...") ===
  - if:
      - condition: template
        value_template: "{{ notify }}"
    then:
      - if:
          - condition: !input condition_notify
        then:
          - if:
              - condition: template
                # FIX: dùng .total_seconds() thay vì .seconds
                # .seconds chỉ trả về phần giây (0-59), không phải tổng giây
                value_template: >
                  {{ not this.attributes.last_triggered or
                     (now() - this.attributes.last_triggered).total_seconds() > delay_notification }}
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ notification_delivery == 'Dynamic' }}"
                    sequence:
                      # 2a. Chụp snapshot nếu được bật
                      - if:
                          - condition: template
                            value_template: "{{ take_snapshot and preview_mode == 'Snapshot' }}"
                        then:
                          - continue_on_error: true
                            action: camera.snapshot
                            target:
                              entity_id: !input camera_entities
                            data:
                              filename: !input file_path

                      # 2b. Gửi notify ban đầu
                      - repeat:
                          for_each: "{{ device_name_map }}"
                          sequence:
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: >
                                        {{ take_snapshot and preview_mode == 'Snapshot' }}
                                  sequence:
                                    - continue_on_error: true
                                      action: "notify.{{ repeat.item }}"
                                      data:
                                        title: "{{ label }} {{ notification_time }}"
                                        message: "Door opened, analyzing entry..."
                                        data:
                                          url: !input tap_navigate
                                          clickAction: !input tap_navigate
                                          tag: "{{ tag }}"
                                          group: !input notification_channel
                                          alert_once: true
                                          ttl: 0
                                          priority: high
                                          channel: !input notification_channel
                                          color: !input notification_color
                                          notification_icon: !input notification_icon
                                          sticky: !input notification_sticky
                                          image: "{{ snapshot_access_file_path }}"
                                          attachment:
                                            url: "{{ snapshot_access_file_path }}"
                                            content_type: JPEG
                                          push:
                                            interruption-level: active
                                            sound:
                                              name: !input notification_sound
                                              volume: !input notification_volume
                                              critical: "{{ notification_critical }}"

                                - conditions:
                                    - condition: template
                                      value_template: "{{ preview_mode == 'Live Preview' }}"
                                  sequence:
                                    - continue_on_error: true
                                      action: "notify.{{ repeat.item }}"
                                      data:
                                        title: "{{ label }} {{ notification_time }}"
                                        message: "Door opened, analyzing entry..."
                                        data:
                                          entity_id: "{{ camera_entity }}"
                                          url: !input tap_navigate
                                          tag: "{{ tag }}"
                                          group: !input notification_channel
                                          alert_once: true
                                          ttl: 0
                                          priority: high
                                          push:
                                            interruption-level: active
                                            sound:
                                              name: !input notification_sound
                                              volume: !input notification_volume
                                              critical: "{{ notification_critical }}"

                                - conditions: []
                                  sequence:
                                    - continue_on_error: true
                                      action: "notify.{{ repeat.item }}"
                                      data:
                                        title: "{{ label }} {{ notification_time }}"
                                        message: "Door opened, analyzing entry..."
                                        data:
                                          url: !input tap_navigate
                                          tag: "{{ tag }}"
                                          group: !input notification_channel
                                          alert_once: true

  # === 3. GỌI AI PHÂN TÍCH ===
  - alias: "Analyze door entry event"
    continue_on_error: true
    action: llmvision.stream_analyzer
    data:
      image_entity: "{{ [camera_entity] }}"
      duration: !input duration
      provider: !input provider
      model: !input model
      message: !input message
      use_memory: !input use_memory
      remember: !input remember
      expose_images: "{{ preview_mode == 'Snapshot' or remember }}"
      generate_title: !input remember
      include_filename: true
      max_frames: !input max_frames
      target_width: !input target_width
      max_tokens: !input max_tokens
    response_variable: response

  # === 4. CẬP NHẬT LABEL TỪ AI ===
  - variables:
      # FIX: thêm default phòng trường hợp AI lỗi / timeout → response.title undefined
      label: "{{ response.title | default('Door Entry Detected') }}"
      ai_response_text: "{{ response.response_text | default('') }}"
      # FIX: chuẩn hoá key_frame path an toàn
      ai_key_frame: >
        {% if response.key_frame is defined and response.key_frame != '' %}
          {{ response.key_frame }}
        {% else %}
          {{ snapshot_access_file_path_social }}
        {% endif %}

  # === 5. CẬP NHẬT NOTIFY VỚI KẾT QUẢ AI ===
  - if:
      - condition: template
        value_template: "{{ notify and ai_response_text != '' }}"
    then:
      - if:
          - condition: !input condition_notify
        then:
          - if:
              - condition: template
                # FIX: dùng .total_seconds() thay vì .seconds
                value_template: >
                  {{ not this.attributes.last_triggered or
                     (now() - this.attributes.last_triggered).total_seconds() > delay_notification }}
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ analysis_mode == 'Snapshot' }}"
                    sequence:
                      - repeat:
                          for_each: "{{ device_name_map }}"
                          sequence:
                            - continue_on_error: true
                              action: "notify.{{ repeat.item }}"
                              data:
                                title: "{{ label }} {{ notification_time }}"
                                message: "{{ ai_response_text }}"
                                data:
                                  # FIX: thêm replace đúng để path hợp lệ
                                  image: >
                                    {{ ai_key_frame | replace('/media', '/media/local')
                                       if ai_key_frame.startswith('/media/')
                                       else ai_key_frame }}
                                  url: !input tap_navigate
                                  clickAction: !input tap_navigate
                                  tag: "{{ tag }}"
                                  group: !input notification_channel
                                  alert_once: true
                                  ttl: 0
                                  priority: high
                                  channel: !input notification_channel
                                  color: !input notification_color
                                  notification_icon: !input notification_icon
                                  sticky: !input notification_sticky
                                  push:
                                    interruption-level: >
                                      {{ 'passive' if notification_delivery == 'Dynamic' else 'active' }}
                                    sound:
                                      name: !input notification_sound
                                      volume: !input notification_volume
                                      critical: "{{ notification_critical }}"
                                  actions:
                                    - action: URI
                                      title: See Snapshot
                                      uri: >
                                        {{ ai_key_frame | replace('/media', '/media/local')
                                           if ai_key_frame.startswith('/media/')
                                           else ai_key_frame }}

                  - conditions:
                      - condition: template
                        value_template: "{{ analysis_mode == 'Live Preview' }}"
                    sequence:
                      - repeat:
                          for_each: "{{ device_name_map }}"
                          sequence:
                            - continue_on_error: true
                              action: "notify.{{ repeat.item }}"
                              data:
                                title: "{{ label }} {{ notification_time }}"
                                message: "{{ ai_response_text }}"
                                data:
                                  entity_id: "{{ camera_entity }}"
                                  url: !input tap_navigate
                                  tag: "{{ tag }}"
                                  group: !input notification_channel
                                  alert_once: true
                                  ttl: 0
                                  priority: high
                                  push:
                                    interruption-level: active
                                    sound:
                                      name: !input notification_sound
                                      volume: !input notification_volume
                                      critical: "{{ notification_critical }}"
                                  actions:
                                    - action: URI
                                      title: See Snapshot
                                      uri: >
                                        {{ ai_key_frame | replace('/media', '/media/local')
                                           if ai_key_frame.startswith('/media/')
                                           else ai_key_frame }}

  # === 6. GỬI ZALO ===
  - if:
      - condition: template
        # FIX: thêm guard kiểm tra zalo_group_id và zalo_phone không rỗng
        value_template: >
          {{ include_zalo_notify
             and zalo_group_id | trim | length > 0
             and zalo_phone | trim | length > 0 }}
    then:
      - choose:
          # 6.1. Có key_frame từ AI → ưu tiên dùng
          - conditions:
              - condition: template
                value_template: >
                  {{ response.key_frame is defined and response.key_frame | trim != '' }}
            sequence:
              - continue_on_error: true
                action: zalo_bot.send_image
                data:
                  type: !input zalo_types
                  ttl: !input zalo_ttl
                  # FIX: key_frame từ llmvision đã là /media/... không cần replace /media/local
                  image_path: "{{ response.key_frame | replace('/media/local', '/media') }}"
                  message: "{{ ai_response_text }}"
                  thread_id: "{{ zalo_group_id | trim }}"
                  account_selection: !input zalo_phone

          # 6.2. Không có key_frame nhưng có snapshot
          - conditions:
              - condition: template
                value_template: "{{ take_snapshot }}"
            sequence:
              - continue_on_error: true
                action: zalo_bot.send_image
                data:
                  type: !input zalo_types
                  ttl: !input zalo_ttl
                  image_path: "{{ snapshot_access_file_path_social }}"
                  message: "{{ ai_response_text }}"
                  thread_id: "{{ zalo_group_id | trim }}"
                  account_selection: !input zalo_phone

        # 6.3. Không có ảnh → chỉ gửi text
        default:
          - continue_on_error: true
            action: zalo_bot.send_image
            data:
              type: !input zalo_types
              ttl: !input zalo_ttl
              image_path: ""
              message: "{{ ai_response_text }}"
              thread_id: "{{ zalo_group_id | trim }}"
              account_selection: !input zalo_phone

  # === 6b. GỬI ZALO CALLING ===
  - alias: Gửi qua Zalo Calling (người và nhóm chọn từ danh sách)
    if:
      - condition: template
        value_template: "{{ include_zalo_calling and zalo_calling_ds | count > 0 }}"
    then:
      - variables:
          zalo_calling_anh: >-
            {% if response.key_frame is defined and response.key_frame | trim != '' %}{{ response.key_frame | replace('/media/local', '/media') }}{% elif take_snapshot %}{{ snapshot_access_file_path_social }}{% endif %}
      - repeat:
          for_each: "{{ zalo_calling_ds }}"
          sequence:
            - continue_on_error: true
              action: zalo_call.send_message
              data: >-
                {{ {'thread_id': repeat.item.thread_id, 'type': repeat.item.type,
                    'message': ai_response_text} | combine(zc_opt_msg) }}
            - if:
                - condition: template
                  value_template: "{{ zalo_calling_anh | trim != '' }}"
              then:
                - continue_on_error: true
                  action: zalo_call.send_image
                  data: >-
                    {{ {'thread_id': repeat.item.thread_id, 'type': repeat.item.type,
                        'file': zalo_calling_anh | trim} | combine(zc_opt_media) }}

  # === 7. ADDITIONAL ACTIONS ===
  - choose: []
    default: !input additional_actions

  # === 8. COOLDOWN ===
  - delay: !input cooldown

